version: '0.2'
language: en
allowCompoundWords: true
caseSensitive: false
ignoreRandomStrings: true
ignorePaths:
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - '**/dist/**'
  - '**/docs/**'
  - '**/node_modules/**'
  - '**/coverage/**'
  - '**/CHANGELOG.md'
  - '**/test/**'
  - apps/synstate-docs/public/**
  - apps/synstate-docs/assets/**
  - apps/synstate-docs/src/components/data-table-demo/sample-data.mts
  - '**/prior-art-research.md'
  - '**/prior-art-and-design-rationale.mdx'
  # --- mono-specific ---
  # Zenn content: Japanese prose published via zenn.dev's GitHub integration.
  # Must never be a CI gate.
  - articles/**
  - books/**
  # Legacy monorepo contents, excluded from the pnpm workspace.
  - experimental/**
  - '**/*.svg'
  - '**/firebase-emulator-exports/**'
