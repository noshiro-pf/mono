version: '0.2'
language: en
allowCompoundWords: true
caseSensitive: false
ignoreRandomStrings: true
ignorePaths:
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - '**/dist/**'
  - '**/node_modules/**'
  - '**/coverage/**'
  # - '**/test/**'
  - 'libs/**/docs/**'
  - 'docs/**/*.html'
  - 'docs/**/*.pdf'
  # Verbatim copies of IETF RFCs; must not be edited to carry
  # in-document cspell directives.
  - 'docs/json-spec/**'
  - apps/synstate-docs/public/**
  - apps/synstate-docs/assets/**
  - apps/synstate-docs/src/components/data-table-demo/sample-data.mts
  - '**/prior-art-research.md'
  - '**/prior-art-and-design-rationale.mdx'
  # --- mono-specific ---
  # Legacy monorepo contents, excluded from the pnpm workspace.
  - experimental/**
  - '**/*.svg'
  - '**/firebase-emulator-exports/**'
  # strict-lib: generated declarations and the diffs taken over them.
  - strict-lib/v*/temp/**
  - strict-lib/v*/output/lib-files/**
  - strict-lib/v*/output/lib-files-branded/**
  - strict-lib/v*/output/lib/libs/**
  - strict-lib/v*/output/lib/libs-branded/**
  - strict-lib/v*/output/diff-from-official/**
  - strict-lib/v*/output/diff-from-prev/**
# Only words that occur across more than one package or top-level directory
# belong here. A word confined to one package goes in that package's
# `cspell.config.yaml`; a word confined to one file goes in a
# `cspell:ignore` comment in that file.
words:
  - anthropics
  - bivariant
  - tsubu
  - blueprintjs
  - nand
  - noshiro
  - sindresorhus
  - testw
  - tscw
  - tses
  - unshifted
  - unsub
  - valtio
  - ymdhm
  - wireit
  - zenn
