name: strict-ts-lib-gen-check

on:
  push:
    paths:
      - packages/strict-ts-lib/**
      - .github/workflows/strict-ts-lib-gen-check.yaml
    branches-ignore:
      - 'develop'
      - 'develop*'
      - 'archive/**'
      - 'deploy/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  strict-ts-lib-gen-check:
    name: strict-ts-lib gen check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        id: setup_node_id
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build dependencies
        run: |
          pnpm --filter "@noshiro/strict-typescript-lib-source..." run build

      - name: Run "npm run gen"
        run: pnpm --filter "@noshiro/strict-typescript-lib-source" run gen

      - name: Check if there is no file diff
        run: pnpm run zz:check:no-diff
