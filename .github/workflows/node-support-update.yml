# cspell:ignore esbuild rollup vitest
name: Node.js Support Update

# Keeps tools/configs/node-support.json — and every `package.json` field
# derived from it — following the Node.js release lines, and tries the next
# major before it exists.
#
# Two jobs, answering the two ends of the same question:
#
# - `canary` runs the build and the tests on the newest *release* and on a
#   nightly of the next major. Neither is a required status check and neither
#   gates a pull request; a failure opens an issue instead. This is what makes
#   the `reactive` upper-bound policy honest rather than optimistic: a nightly
#   of the next major exists roughly nine months before that major ships, so an
#   incompatibility is found, and `knownBroken` written down, long before any
#   consumer can install a Node that hits it.
# - `update` refreshes the pinned `lts` and `current` versions and opens a pull
#   request. It never moves `targets.minimum` — that is the `engines.node` floor
#   of every published package, so raising it is a breaking change and a
#   decision, not a weekly chore. See update-node-support.mts.
#
# The pull request is where the new versions are proven: node-version-compatibility.yml
# runs the full matrix on it, so a version that does not work never reaches
# main. That is the whole reason the refresh is a pull request and not a push.
# The `skip-ci` label it opens with moves when that happens rather than
# whether: every check skips while the label is on, so the matrix runs once,
# on the head that will merge, at the moment the label comes off — which is
# also what makes the weekly force-push to this branch cost nothing.
#
# `update` installs the dependency tree and holds a token in the same job,
# which "Jobs that hold a key" in README.md says not to do; it still follows
# the three rules there. It is not split because of what its token cannot do:
# no `workflows` permission, so a rewritten workflow file cannot be pushed, and
# nothing it opens merges unattended. Auto-merge *is* armed, and that second
# half survives only because the pull request is opened carrying `skip-ci`:
# `no-skip-ci-label` is pending for as long as the label is on, so the merge
# waits for a person to queue it. Arming is what spares them a second action
# when they do, not a statement that this should merge. What the update step
# writes is `tools/configs/node-support.json` and the `package.json` fields
# derived from it. Grant this token `workflows`, or arm auto-merge with
# nothing holding the merge — open it without the label, or add
# `merge-queued` here as pnpm-update.yml does — and the split becomes
# necessary. `close-obsolete`, after it, holds `GITHUB_TOKEN` alone and runs
# nothing but `gh`.
#
# `update` runs on the default branch only. A dispatch on any other ref skips
# it, and `close-obsolete` with it: `update` would otherwise rebuild
# `chore/node-support-update` on that ref's commits and open them into `main`
# with auto-merge armed, reading as a refresh, and queueing it would merge them
# with nobody having reviewed them (`check:root:dispatch-default-branch`).
# `canary` pushes nothing, so it runs on any ref.

on:
  schedule:
    # Weekly, Tuesday 05:17 JST (20:17 UTC Monday). Node's release cadence is
    # measured in weeks and its majors are scheduled a year out, so a daily run
    # would only add noise — nine months of nightly lead time is not improved
    # by finding out on Tuesday instead of the following Monday.
    - cron: '17 20 * * 1'

  workflow_dispatch:

# One run in progress, none cancelled, whatever the ref: every run writes the
# one branch, and `close-obsolete` closes whatever pull request is open from
# it, which an overlapping run could have just opened with a refresh the first
# did not see. A run waiting in the group is replaced by the next to arrive;
# each rebuilds from the tip.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# `update` pushes and opens the pull request through the App token, so
# `contents: read` is the whole of what it takes. Only `close-obsolete` writes
# through `GITHUB_TOKEN`, and only to close a pull request.
permissions: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # No `issues: write`, although this job used to carry it. It installs and
      # builds the whole dependency tree, and it opens no issue — `canary-report`
      # below is what does that, from a job that installs nothing. A write that
      # is never used is a write a compromised dependency inherits for free.
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # `current` is the newest release, floating — the pinned `current` in
        # node-support.json is a week behind it at most, and this catches the
        # patch that broke something before the refresh pull request does.
        # `nightly` is the next major, which has no release at all yet.
        channel: [current, nightly]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # `setup-node` takes `<major>-nightly` and resolves it to the newest
      # nightly of that line; the major comes from the pinned `current` rather
      # than being written here, so this follows the release lines too.
      - name: Resolve the Node.js version for `${{ matrix.channel }}`
        id: node-version
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          if [ "${CHANNEL}" = 'current' ]; then
            version='current'
          else
            current_major="$(node -p "require('./tools/configs/node-support.json').targets.current.split('.')[0]")"
            version="$((current_major + 1))-nightly"
          fi
          echo "${CHANNEL} -> ${version}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      # No `--engine-strict` here, unlike node-version-compatibility.yml, and
      # not by oversight. A semver range matches a prerelease only when one of
      # its comparators names the same `major.minor.patch` *and* carries a
      # prerelease tag, so `>=22.23.4` does not match `27.0.0-nightly…` — the
      # install would fail on every nightly run whatever `engines.node` said,
      # which is the one outcome that would tell us nothing.
      - name: Set up pnpm, Node.js for `${{ matrix.channel }}` and the dependencies
        uses: $/.github/actions/setup
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Build
        run: pnpm run ws:build

      - name: Test
        run: pnpm run ws:check:test

  # Turns a red canary into an issue, because nothing else would: the job is
  # not a required check and runs on a schedule, where a failure is an email
  # nobody reads. One issue per channel, reused — a comment on the open one
  # rather than a new issue every week.
  canary-report:
    needs: canary
    if: always() && needs.canary.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      issues: write

    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          title='Node.js canary is failing'

          # shellcheck disable=SC2016 # literal backticks, not command substitution
          body="$(printf '%s\n' \
            'The scheduled Node.js canary failed: the build or the tests did not pass on the newest release, on a nightly of the next major, or on both.' \
            '' \
            "Run: ${RUN_URL}" \
            '' \
            'What to do with it:' \
            '' \
            '1. Open the run and see which channel failed, and whether the failure is in what the packages *publish* or only in the build toolchain (tsx, esbuild, rollup, vitest). Only the first kind says anything about `engines.node`.' \
            '2. If a published package is genuinely broken on that Node, record it in `tools/configs/node-support.json` as `knownBroken` — `since`, `reason`, and this issue number. Under the `reactive` policy that is what adds the `<major` upper bound to every published `engines.node`; `pnpm run check:root:node-support --fix` writes it out, and it needs a changeset because it narrows what consumers may install.' \
            '3. If the toolchain is what broke, nothing about `engines` changes. Fix or pin the tool.' \
            '' \
            'Close this once the canary is green again, or once `knownBroken` records the breakage; the next failing run reopens the conversation with a new comment.')"

          # The phrase is quoted inside the search so GitHub matches it whole
          # rather than as five separate terms, and the result is filtered on
          # an exact title anyway — a search is a ranking, not a lookup.
          existing="$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  update:
    # The default branch only; see the header. A tag is not a branch, so the
    # full ref is compared.
    if: >-
      github.ref == format('refs/heads/{0}', case(github.event.repository.default_branch != '', github.event.repository.default_branch, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      changed: ${{ steps.open.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js and the dependencies
        uses: $/.github/actions/setup

      # Refreshes `lts` and `current` from nodejs.org and rewrites the
      # `volta.node` / `devEngines.runtime` fields that follow them.
      # `targets.minimum` and therefore `engines.node` are left alone, which is
      # why this pull request needs no changeset: nothing a consumer can
      # observe changes.
      - name: Refresh the Node.js support targets
        run: pnpm run node-support:update

      - name: Format what changed
        run: pnpm run fix:fmt:full

      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          permission-contents: write # push the branch
          permission-pull-requests: write # open it, label it, arm auto-merge

      - name: Open a pull request if anything changed
        id: open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo 'Node support targets already up to date; nothing to do.'
            echo 'changed=false' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          echo 'changed=true' >>"${GITHUB_OUTPUT}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # `pnpm install` above ran the dependency tree's lifecycle scripts
          # in this very job, so this is not a formality here. Set for the
          # rest of the step rather than per command, so a `git` added later
          # is covered too.
          git config core.hooksPath /dev/null

          branch='chore/node-support-update'
          git switch -c "$branch"
          git add -A
          git commit -m 'chore: refresh the Node.js support targets'

          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          remote_ref="$(git ls-remote "$remote_url" "refs/heads/${branch}")"
          expected="$(printf '%s' "$remote_ref" | cut -f1)"

          git push --force-with-lease="refs/heads/${branch}:${expected}" \
            "$remote_url" \
            "HEAD:refs/heads/${branch}"

          # `--label skip-ci` at creation rather than in a call of its own:
          # the label is what holds the merge once auto-merge is armed below,
          # and asking for it in the same request leaves no window in which
          # the pull request exists without it.
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null)" != 'OPEN' ]; then
            # shellcheck disable=SC2016 # literal backticks, not command substitution
            gh pr create \
              --base main \
              --head "$branch" \
              --label skip-ci \
              --title 'chore: refresh the Node.js support targets' \
              --body "$(printf '%s\n' \
                'Refreshes the pinned `lts` and `current` versions in `tools/configs/node-support.json` from the Node.js release data, and the `volta.node` / `devEngines.runtime` fields derived from them.' \
                '' \
                'The `engines.node` floor (`targets.minimum`) is deliberately not touched: raising it is a breaking change for consumers, so it moves by a decision rather than on a schedule. Nothing a consumer can observe changes here, which is why there is no changeset.' \
                '' \
                'The compatibility matrix on this pull request is what proves the new versions work, and it runs when `skip-ci` comes off — on the head that will merge. Rebuilt from main every run, so force-pushes to this branch are expected.' \
                '' \
                'Held by `skip-ci` with auto-merge already armed: add `merge-queued` once the new versions are worth taking, and `unblock-prs` rebases it, takes `skip-ci` off, and GitHub merges it when the matrix is green.')"
          fi

          # Arming reads the pull request afresh instead of trusting the call
          # above, and refuses unless the label is on it — `skip-ci` is the
          # only thing holding this merge, since the `main` ruleset asks for no
          # approvals and `.github/CODEOWNERS` does not cover what this writes.
          # "The label call succeeded" and "the label is on now" are not the
          # same claim, and this is the one decision that lands on `main`;
          # `pnpm run open-pr` refuses here for the same reason, see
          # libs/pr-merge-queue/src/open-pr/README.md.
          #
          # A run over a pull request that already exists does not put
          # `skip-ci` back on. A label already taken off was taken off to
          # start the matrix, auto-merge was armed by the run that opened the
          # pull request, and re-adding it would stop the very checks that
          # removal asked for.
          armable="$(gh pr view "$branch" --json state,isDraft,labels \
            --jq '[.state == "OPEN", (.isDraft | not), any(.labels[].name; . == "skip-ci")] | all')"

          if [ "$armable" = 'true' ]; then
            gh pr merge --auto --squash "$branch"
          else
            echo "::notice::Not arming auto-merge: ${branch} is not an open, ready pull request carrying \`skip-ci\`. A run that opened one armed it already."
          fi

  # When `update` finds nothing to change, `main` already has the targets the
  # branch could carry — typically because another pull request moved them
  # while this one was held under `skip-ci` — and `update` pushes nothing. An
  # open pull request from the branch is then obsolete, and nothing else would
  # close it: every later run finds nothing to do either. Closed rather than
  # pushed `main`'s tip, which would leave an empty pull request open.
  #
  # Only on the default branch, as `update` is, whose skip skips this job: a run
  # dispatched on another ref would find that ref's tree up to date, which says
  # nothing about `main`'s. A refresh that failed fails `update`, which skips
  # this job, so a nodejs.org outage closes nothing.
  #
  # `gh` alone, no checkout: nothing from the tree runs here. `GITHUB_TOKEN`
  # rather than the App token, because a close needs to trigger no workflow.
  # The open pull request is looked up by head branch, from this repository
  # only, since a fork may name a branch the same. `merge-queued` comes off
  # after the close, so that reopening it does not put a stale head back in the
  # queue, and a close that fails leaves it queued as it was; a label that does
  # not come off is a warning, since the close is what matters.
  close-obsolete:
    needs: update
    if: needs.update.outputs.changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write

    steps:
      - name: Close the obsolete pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="chore/node-support-update"

          numbers="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --state open --json number,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .number')"

          if [ -z "$numbers" ]; then
            echo "No open pull request from ${branch}; nothing to close."
            exit 0
          fi

          while IFS= read -r number; do
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment \
              "Closed by [node-support-update.yml](${RUN_URL}): refreshing the Node.js support targets from \`main\`'s tip changes nothing, so \`main\` already has what this pull request carries. The next run that finds a change opens a new one."
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --remove-label merge-queued ||
              echo "::warning::Closed #${number}, but could not take merge-queued off it."
          done <<<"$numbers"
