name: Release

on:
  push:
    branches:
      - main # Trigger a push to the main branch

env:
  CI: true

jobs:
  release:
    name: Release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write # to create release
      issues: write # to post issue comments
      pull-requests: write # to create the version pull request
      id-token: write # required for OIDC / npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node_id
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          # App が持つ全権限をそのまま受け取らないよう、release に必要な範囲へ明示的に絞る。
          permission-contents: write # version ブランチの push / タグ / GitHub Release の作成
          permission-pull-requests: write # version PR の作成と更新

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: pnpm run changeset:publish
          version-script: pnpm run changeset:version-packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          create-github-releases: true
          push-git-tags: true
        env:
          # Used by the `gh` CLI in `dist:github-release` to create/upload the
          # tarball GitHub Release.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
