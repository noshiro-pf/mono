# cspell:ignore esbuild unrs
name: Release

# 依存ツリーのコードが動く `build` job と、鍵（ `id-token: write` と App
# token ）を持つ `release` job に分けてある。分割そのものの理屈 — job の境界
# だけが `$GITHUB_ENV` / `$GITHUB_PATH` を止めること、成果物は tar 一つで
# それはデータであること、鍵を持つ job は tree から何も実行しないこと — は
# README.md の "Jobs that hold a key" にあり、ここには release 固有の事情
# （ OIDC / npm trusted publisher ）だけを書く。

on:
  push:
    branches:
      - main # Trigger a push to the main branch

env:
  CI: true

# `build` below is the reason this line exists: without it the job would
# inherit the repository default, and the whole point of that job is that it
# holds nothing.
permissions: {}

jobs:
  # 依存ツリー自身のコードが動く job。鍵は何も持たない。
  #
  # `ws:build` は数百のワークスペースパッケージを import して実行し、その一つ
  # 一つがさらに第三者の依存を import する。これが `id-token: write` を持つ job
  # の中にある限り、汚染された依存はただ `ACTIONS_ID_TOKEN_REQUEST_URL` と
  # `ACTIONS_ID_TOKEN_REQUEST_TOKEN` を読めばよく、そこから npm の trusted
  # publisher を設定した全パッケージへ任意の tarball を publish できる。
  # `main` 上の正規の run の中で起きるので、`release` environment の branch
  # policy も CODEOWNERS も通過する — どちらも「どの ref が動くか」「何が
  # マージされるか」を見ていて、「その run の中で何が実行されるか」は見ない。
  # `id-token: write` の無い job には `ACTIONS_ID_TOKEN_REQUEST_*` がそもそも
  # 存在しないので、ここで動くコードは OIDC トークンを要求できない。
  #
  # これで消えるのは publish の権限そのものへの到達で、`dist/` の中身が正しい
  # ことの保証ではない。被害は「任意のパッケージを任意の時に publish」から
  # 「このリリースの中身が汚れる」に縮むが、ゼロにはならない。そこまで見るのは
  # npm の staged publishing で、changesets 側が未対応。
  #
  # changeset のある push（ version PR を作り直すだけの run ）でもこの job は
  # 走る。そちらの経路は `dist/` を要らないので純粋な待ち時間だが、`ws:build`
  # を回すかどうかを先に判定させると、その判定と `changesets/action` 自身の
  # 判定がずれたときに「`dist/` の無いまま publish」が起きうる。リリース経路で
  # 一番避けたいのはそれなので、無条件に作る。
  #
  # **この分割は戻さないこと。** `ws:build` を `changeset:publish` に足し直す、
  # 下の `release` job にステップとして足す、二つの job を一つに畳む —
  # どれも同じことで、ビルドツールチェーン全部が `id-token: write` の内側に
  # 帰ってくる。速くしたいなら、ここを速くするか `needs` を組み替えるか。
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all packages
        run: pnpm run ws:build

      # code-check.yml の `build` job と同じ形（ README.md の "The `dist/`
      # artifact" ）。
      - name: Pack the build output
        run: |
          set -euo pipefail
          find libs apps tools languages -maxdepth 3 -type d -name dist \
            -not -path '*/node_modules/*' -print0 |
            tar --null --files-from - -czf "${RUNNER_TEMP}/dist.tar.gz"
          ls -lh "${RUNNER_TEMP}/dist.tar.gz"

      - name: Upload the build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist.tar.gz
          retention-days: 1

  release:
    name: Release
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    # npm の trusted publisher が検証するのは organization / repository /
    # workflow のファイル名、そして（設定されていれば）environment 名だけで、
    # **git ref は見ない**。つまり Environment が空欄のままだと、
    # `.github/workflows/release.yml` という名前の workflow が
    # `id-token: write` 付きでこの repository のどの ref から動いても、
    # trusted publisher を設定した全パッケージへ publish できてしまう。
    #
    # `release` environment に GitHub 側で
    # 「 Deployment branches and tags: Selected branches → main 」を設定し、
    # npm 側の Environment 欄にも `release` を入れることで、その抜けを塞ぐ:
    # main 以外の ref の run は environment を参照できず、OIDC トークンに
    # `environment` claim が乗らないので npm が publish を拒否する。
    #
    # required reviewers は付けていない。ここで止めても審査できるのは
    # 「 publish してよいか」であって依存ツリーの中身ではなく、その代わりに
    # 毎回の merge が承認待ちになる。人手のゲートを足すなら npm の
    # staged publishing の方が筋がよい（ changesets 側が未対応 —
    # changesets/changesets#2025 ）。
    #
    # 順序に注意: この `environment` を main に入れてから npm 側の
    # Environment 欄を埋めること。逆順にすると次の release が落ちる。
    environment: release

    permissions:
      packages: write
      contents: write # to create release
      issues: write # to post issue comments
      pull-requests: write # to create the version pull request
      id-token: write # required for OIDC / npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node_id
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      # `--ignore-scripts`。ここは `id-token: write` を持つ job なので、依存の
      # コードが走る量をできるだけ減らす。root の `pnpm install` が実行する
      # 第三者コードは pnpm 本体と `esbuild` / `sharp` / `unrs-resolver` の
      # install script、そして root の `prepare`（ `strict-ts-lib-v7.0-link` ）
      # で、このフラグは pnpm 本体を除く全部を落とす。
      #
      # publish 経路がそれで困らないことが肝心で、困らない: `changeset publish`
      # は純粋な Node のコードで、`dist/` は下の artifact から来る。publish
      # されるパッケージに `prepare` / `prepack` / `prepublishOnly` が一つも
      # 無いので、`npm publish` 側で再ビルドも起きない。
      #
      # version 経路も通る。`tsx`（ とそれが使う `esbuild` ）と `oxfmt` は
      # install script 抜きでも動く — どちらもプラットフォーム別の
      # optionalDependency からバイナリを解決し、script はその取りこぼしの
      # 保険でしかない。`strict-ts-lib-v7.0-link` が張る
      # `node_modules/@typescript/lib-*` が要るのは型検査だけで、
      # `changeset:version-packages` はどれもしない。その最後の
      # `pnpm install --no-frozen-lockfile` が script 付きで走り直すので、
      # リンクはそこで戻る。
      #
      # ここにステップを足すときは、install script が走っていることを前提に
      # しないこと。前提にしなければならないものは `build` job の側にある。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `build` job が出したもの。この job はビルドしない — それがこの分割の
      # 全部。
      #
      # provenance の指す先は変わらない。npm が attestation に書くのは run の
      # OIDC claim（ repository / workflow_ref / commit ）で、job ではない。
      # 分割前もビルドが attest されていたわけではなく、ここは publish が
      # 同じ workflow・同じコミットの run から出ているという事実のまま。
      - name: Download the build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: ${{ runner.temp }}

      - name: Unpack the build output
        run: tar -xzf "${RUNNER_TEMP}/dist.tar.gz"

      # install も artifact の展開もこのステップより前に置いてある（ "Jobs
      # that hold a key" の 2 つめ ）。ここに足すステップも同じ順序に従うこと。
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          # App が持つ全権限をそのまま受け取らないよう、release に必要な範囲へ明示的に絞る。
          permission-contents: write # version ブランチの push / タグ / GitHub Release の作成
          permission-pull-requests: write # version PR の作成と更新

      # `changeset:publish` はもう `ws:build` を呼ばない。ビルドは `build` job
      # が済ませていて、その成果物は上で展開済み。裏を返すと、このスクリプトを
      # 手で走らせるとディスクにある `dist/` をそのまま publish する — 中身が
      # 何であれ。publish はこの workflow の仕事で、手元の仕事ではない。
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: pnpm run changeset:publish
          version-script: pnpm run changeset:version-packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          create-github-releases: true
          push-git-tags: true
        env:
          # Used by the `gh` CLI in `dist:github-release` to create/upload the
          # tarball GitHub Release.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # version PR は derived state で、この workflow が main の先端から毎回
      # 作り直して force-push し、title と body も上書きする。auto-merge が
      # 武装された状態で素のまま緑になれば、その瞬間に publish まで走る。
      # `skip-ci` だけがそれを押さえられるので、**毎回**付け直す:
      #
      # - 作られたばかりの version PR が、押さえの無いまま存在する窓を無くす
      #   （ CLAUDE.md の「 `skip-ci` を付けてから auto-merge を武装する」を、
      #   人の手順ではなく生成側で保証する）。
      # - `unblock-prs` が `skip-ci` を外した後に別の PR が main に入ると、
      #   このブランチは作り直されて中身が変わる。押さえ直してキューをやり
      #   直させるのが正しい。
      #
      # 既に付いている場合 `--add-label` はイベントを起こさないので、CI が
      # 無駄に回ることはない。リリースが走った run（ version PR が無い）では
      # `pr-number` が空になるので、その時はスキップする。
      - name: Hold the version pull request with `skip-ci`
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --add-label skip-ci
