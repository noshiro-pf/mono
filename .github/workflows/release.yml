name: Release

on:
  push:
    branches:
      - main # Trigger a push to the main branch

env:
  CI: true

jobs:
  release:
    name: Release
    timeout-minutes: 15
    runs-on: ubuntu-latest

    # npm の trusted publisher が検証するのは organization / repository /
    # workflow のファイル名、そして（設定されていれば）environment 名だけで、
    # **git ref は見ない**。つまり Environment が空欄のままだと、
    # `.github/workflows/release.yml` という名前の workflow が
    # `id-token: write` 付きでこの repository のどの ref から動いても、
    # trusted publisher を設定した全パッケージへ publish できてしまう。
    #
    # `release` environment に GitHub 側で
    # 「 Deployment branches and tags: Selected branches → main 」を設定し、
    # npm 側の Environment 欄にも `release` を入れることで、その抜けを塞ぐ:
    # main 以外の ref の run は environment を参照できず、OIDC トークンに
    # `environment` claim が乗らないので npm が publish を拒否する。
    #
    # required reviewers は付けていない。ここで止めても審査できるのは
    # 「 publish してよいか」であって依存ツリーの中身ではなく、その代わりに
    # 毎回の merge が承認待ちになる。人手のゲートを足すなら npm の
    # staged publishing の方が筋がよい（ changesets 側が未対応 —
    # changesets/changesets#2025 ）。
    #
    # 順序に注意: この `environment` を main に入れてから npm 側の
    # Environment 欄を埋めること。逆順にすると次の release が落ちる。
    environment: release

    permissions:
      packages: write
      contents: write # to create release
      issues: write # to post issue comments
      pull-requests: write # to create the version pull request
      id-token: write # required for OIDC / npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node_id
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          # App が持つ全権限をそのまま受け取らないよう、release に必要な範囲へ明示的に絞る。
          permission-contents: write # version ブランチの push / タグ / GitHub Release の作成
          permission-pull-requests: write # version PR の作成と更新

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: pnpm run changeset:publish
          version-script: pnpm run changeset:version-packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          create-github-releases: true
          push-git-tags: true
        env:
          # Used by the `gh` CLI in `dist:github-release` to create/upload the
          # tarball GitHub Release.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # version PR は derived state で、この workflow が main の先端から毎回
      # 作り直して force-push し、title と body も上書きする。auto-merge が
      # 武装された状態で素のまま緑になれば、その瞬間に publish まで走る。
      # `skip-ci` だけがそれを押さえられるので、**毎回**付け直す:
      #
      # - 作られたばかりの version PR が、押さえの無いまま存在する窓を無くす
      #   （ CLAUDE.md の「 `skip-ci` を付けてから auto-merge を武装する」を、
      #   人の手順ではなく生成側で保証する）。
      # - `unblock-prs` が `skip-ci` を外した後に別の PR が main に入ると、
      #   このブランチは作り直されて中身が変わる。押さえ直してキューをやり
      #   直させるのが正しい。
      #
      # 既に付いている場合 `--add-label` はイベントを起こさないので、CI が
      # 無駄に回ることはない。リリースが走った run（ version PR が無い）では
      # `pr-number` が空になるので、その時はスキップする。
      - name: Hold the version pull request with `skip-ci`
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --add-label skip-ci
