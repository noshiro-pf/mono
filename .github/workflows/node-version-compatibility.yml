name: Node.js Version Compatibility

on:
  push:
    branches-ignore:
      # `archive/**` holds frozen snapshots of retired work. They are never
      # merged back, so every check on them is wasted CI.
      - 'archive/**'
    # No `paths-ignore` here — see the note in style-check.yml. `.gitignore`
    # was the only entry, and the `Check diff` step below already ignores it:
    # it is in the `z:check-should-run:code-checks` list.

  # `Check for a draft pull request` below skips the work while the pull
  # request is a draft, and the job still reports — so without this trigger the
  # required checks would sit green on a branch nothing has checked, and
  # marking the pull request ready for review, which is not a push, would not
  # re-run them. This is what runs them for real.
  pull_request:
    types:
      - ready_for_review

  workflow_dispatch:

jobs:
  test-node-versions:
    runs-on: ubuntu-latest
    # install + ws:build + ws:test across 17 packages, per Node version.
    # The 10 minutes this was set to when the repository held two packages
    # cut two of the three matrix entries off mid-test.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.2', '24.17.0', '26.3.1']

    steps:
      # A draft pull request is work in progress, so everything below is
      # skipped until it is marked ready for review. A `push` event carries no
      # pull request context — the branch is all it knows — so ask the API
      # whether the open pull request for that branch is a draft.
      #
      # This runs first, before the checkout: every other step hangs off it, so
      # a push to a draft costs one API call rather than an install and a
      # build. The job itself still runs and still reports, for the same reason
      # nothing here uses `paths-ignore` — these are required status checks,
      # and a job that never reports leaves the pull request waiting on a check
      # that will never arrive.
      - name: Check for a draft pull request
        id: check_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # `workflow_dispatch` is someone asking for the checks explicitly,
          # and `pull_request` only fires here on `ready_for_review`, which is
          # the moment the draft stopped being one.
          if [ "${EVENT_NAME}" != 'push' ] || [ "${GITHUB_REF_NAME}" = 'main' ]; then
            exit 0
          fi

          # Every open pull request whose head is this branch has to be a
          # draft. `none` — no pull request yet — runs the checks: the branch
          # may never get one, and nothing would re-run them if it did, since
          # opening a pull request is not a push.
          jq_filter='if length == 0 then "none" elif all(.[]; .isDraft) then "true" else "false" end'

          # Fail open. A pull request that cannot be read is not a draft as far
          # as this gate is concerned; running the checks anyway is the
          # harmless half of being wrong.
          if ! is_draft="$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --head "${GITHUB_REF_NAME}" --state open --json isDraft \
            --jq "${jq_filter}")"; then
            echo 'Could not read the pull requests for this branch; running the checks.'
            exit 0
          fi

          if [ "${is_draft}" = 'true' ]; then
            echo 'is_draft=true' >>"${GITHUB_OUTPUT}"
            echo 'This branch has a draft pull request; skipping. Mark it ready for review to run the checks.'
          fi

      - name: Checkout
        if: steps.check_draft.outputs.is_draft != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event, so a `ready_for_review` run checks exactly
          # what a push to this branch would have.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch main
        if: steps.check_draft.outputs.is_draft != 'true'
        run: git fetch origin main # To allow the diff gate below to get the diff from main

      - name: Install pnpm
        if: steps.check_draft.outputs.is_draft != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js ${{ matrix.node-version }}
        if: steps.check_draft.outputs.is_draft != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check_draft.outputs.is_draft != 'true'
        run: pnpm install --frozen-lockfile --engine-strict

      # NOTE: To include this workflow in the branch protection rule status check,
      # skip each step instead of skipping the entire workflow with paths-ignore.
      - name: Check diff
        id: check_diff_type
        if: steps.check_draft.outputs.is_draft != 'true'
        # `z:check-should-run:code-checks` names the paths that neither this
        # workflow nor type-check.yml looks at — `experimental/`, prose, and
        # the style tools' own configuration — and reports
        # `should_run=false` when the diff touches nothing else. The list
        # lives in the root package.json so that the two workflows cannot
        # drift apart.
        #
        # It diffs against origin/main. On a push to main that is a diff
        # against HEAD itself, which comes back empty and reads as "nothing
        # relevant changed" — so every step below skips and the job still
        # reports success. Compare with what main pointed at before the push
        # instead.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run z:check-should-run:code-checks
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run z:check-should-run:code-checks --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi

      - name: Verify installation
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm list

      - name: Build
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ws:build

      - name: Test
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ws:test
