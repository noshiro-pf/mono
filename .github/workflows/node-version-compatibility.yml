name: Node.js Version Compatibility

on:
  # Only main — pull request branches are covered by the `pull_request` events
  # below; see the note in type-check.yml.
  push:
    branches:
      - main

  # `synchronize` fires on every push to the pull request's branch, so these
  # types cover the pull request's whole life — a draft included. `labeled` /
  # `unlabeled` are what let a `[WIP]` label stop and restart the checks; see
  # the note in type-check.yml. No `paths` filter here — see the
  # note in style-check.yml.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

  workflow_dispatch:

# One run per pull request; a push cancels the run still going for the
# previous one. `cancel-in-progress` is an expression rather than `true` so
# that pushes to `main` run to completion — see the note in type-check.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the branch is behind `main`, and whether `[WIP]` is on the pull
  # request — see the notes in type-check.yml.
  branch-up-to-date:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, '[WIP]')
    uses: ./.github/workflows/branch-up-to-date.yml

  test-node-versions:
    needs: branch-up-to-date
    # Skip the whole job while the pull request carries the `[WIP]` label, or
    # while its branch is behind `main` and cannot be merged as it stands —
    # see the notes in type-check.yml. Being a draft no longer skips
    # anything.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.branch-up-to-date.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    # install + ws:build + ws:test across 17 packages, per Node version.
    # The 10 minutes this was set to when the repository held two packages
    # cut two of the three matrix entries off mid-test.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.2', '24.17.0', '26.3.1']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event: these checks assert properties of the branch
          # itself, and the merge ref does not even exist while the pull
          # request has a conflict. On a push event this falls back to the
          # pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch main
        run: git fetch origin main # To allow the diff gate below to get the diff from main

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict

      # NOTE: To include this workflow in the branch protection rule status check,
      # skip each step instead of skipping the entire workflow with paths-ignore.
      - name: Check diff
        id: check_diff_type
        # `z:check-should-run:code-checks` names the paths that neither this
        # workflow nor type-check.yml looks at — `experimental/`, prose, and
        # the style tools' own configuration — and reports
        # `should_run=false` when the diff touches nothing else. The list
        # lives in the root package.json so that the two workflows cannot
        # drift apart.
        #
        # It diffs against origin/main. On a push to main that is a diff
        # against HEAD itself, which comes back empty and reads as "nothing
        # relevant changed" — so every step below skips and the job still
        # reports success. Compare with what main pointed at before the push
        # instead.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run z:check-should-run:code-checks
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run z:check-should-run:code-checks --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi

      - name: Verify installation
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm list

      - name: Build
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ws:build

      - name: Test
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ws:test

  # The one required status check for this workflow: it reports whatever
  # happened above, so that a skipped run cannot read as a passing one. See
  # the note on `type-check-result` in type-check.yml.
  test-node-versions-result:
    needs:
      - branch-up-to-date
      - test-node-versions
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the checks above to have passed
        env:
          SHOULD_RUN: ${{ needs.branch-up-to-date.outputs.should_run }}
          RESULT: ${{ needs.test-node-versions.result }}
        run: |
          if [ "${SHOULD_RUN}" = 'false' ]; then
            echo 'The branch is behind the base branch, so the checks were skipped. They run again once it is updated.'
            exit 0
          fi

          if [ "${RESULT}" = 'success' ]; then
            echo 'The checks passed.'
            exit 0
          fi

          summary="The checks did not pass on this commit (result: ${RESULT}). A \`[WIP]\` label skips them; take the label off to run them."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1
