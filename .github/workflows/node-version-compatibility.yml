name: Node.js Version Compatibility

on:
  # No `push`, not even for `main`. The `main` ruleset accepts changes through
  # pull requests only and requires the branch to be up to date, so the squash
  # commit a merge makes has the same tree as the pull request's head — a tree
  # this workflow has already checked. See the note in type-check.yml, which
  # keeps one job on `push` for a reason of its own.

  # `synchronize` fires on every push to the pull request's branch, so these
  # types cover the pull request's whole life — a draft included. `labeled` /
  # `unlabeled` are what let a `[WIP]` label stop and restart the checks; see
  # the note in type-check.yml. No `paths` filter here — see the
  # note in style-check.yml.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  workflow_dispatch:

# One run per pull request; a push cancels the run still going for the
# previous one. `cancel-in-progress` is an expression rather than `true` so
# that a `workflow_dispatch` run is left alone — see the note in
# type-check.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deny by default; each job grants back exactly what it needs. See the note in
# type-check.yml for why the repository's own default is not good enough here.
permissions: {}

jobs:
  # Whether the branch is behind `main`, whether the diff touches anything
  # this workflow reads, and whether `[WIP]` is on the pull request — see the
  # notes in type-check.yml and check-gates.yml. `code` is the same ignore
  # list type-check.yml gates on, which is why it lives in the root
  # package.json rather than in either workflow.
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, '[WIP]')
    uses: ./.github/workflows/check-gates.yml
    # What check-gates.yml's own job declares. A caller's job-level
    # `permissions` is the ceiling for the workflow it calls — permissions can
    # be reduced along the chain, never elevated — so the top-level `{}` above
    # would otherwise leave the called workflow unable to check out.
    permissions:
      contents: read
      packages: read
    with:
      diff-scope: code

  test-node-versions:
    needs: gates
    # Skip the whole job while the pull request carries the `[WIP]` label,
    # while its branch is behind `main` and cannot be merged as it stands, or
    # when the diff touches nothing any command below reads — see the notes in
    # type-check.yml. Being a draft no longer skips anything.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # install + ws:build + ws:test across 17 packages, per Node version.
    # The 10 minutes this was set to when the repository held two packages
    # cut two of the three matrix entries off mid-test.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # The entries are the *keys* of `targets` in
        # tools/configs/node-support.json, not the versions themselves. The
        # versions move on a schedule — node-support-update.yml refreshes `lts`
        # and `current` weekly — and the names do not, so a refresh is a change
        # to one data file rather than an edit here, and `minimum` stays
        # readable as "the floor `engines.node` promises" instead of as a
        # number nobody can place. `check-node-support` fails when this list
        # and that file's keys disagree.
        target: [minimum, lts, current]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event: these checks assert properties of the branch
          # itself, and the merge ref does not even exist while the pull
          # request has a conflict. On a `workflow_dispatch` run this falls
          # back to the dispatched commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Resolved from the checkout rather than written into the matrix above,
      # so that the versions this job runs and the versions
      # `check-node-support` holds the manifests to are the same three strings.
      # The runner's preinstalled Node reads the file; `setup-node` then
      # replaces it with the one named here.
      - name: Resolve the Node.js version for `${{ matrix.target }}`
        id: node-version
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./tools/configs/node-support.json').targets[process.env.TARGET]")"
          echo "${TARGET} -> Node ${version}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Set up Node.js for `${{ matrix.target }}`
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: 'pnpm'

      # `--engine-strict` is what turns the `minimum` entry from a claim into a
      # check: pnpm refuses the install when any package's `engines.node`
      # excludes the running version, so the floor every published package
      # promises is exercised on the exact version it names.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict

      - name: Verify installation
        run: pnpm list

      - name: Build
        run: pnpm run ws:build

      - name: Test
        run: pnpm run ws:test

  # The one required status check for this workflow: it reports whatever
  # happened above, so that a skipped run cannot read as a passing one. The
  # two clauses after `always()` are the skips that are not failures — a
  # `[WIP]` label, held by `no-wip-label`, and a branch behind the base
  # branch, held by the ruleset — for which this job reports `skipped` rather
  # than red. See the note on `type-check-result` in type-check.yml.
  test-node-versions-result:
    needs:
      - gates
      - test-node-versions
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    # Reads `needs.*.result` and echoes. It touches nothing.
    permissions: {}
    timeout-minutes: 5

    steps:
      - name: Require the checks above to have passed
        env:
          RESULT: ${{ needs.test-node-versions.result }}
        run: |
          if [ "${RESULT}" = 'success' ]; then
            echo 'The checks passed.'
            exit 0
          fi

          summary="The checks did not pass on this commit (result: ${RESULT})."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1
