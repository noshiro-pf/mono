name: Node.js Version Compatibility

# The check workflow shape — triggers, concurrency, `permissions: {}`, the
# gate, the aggregate — is in README.md. What is particular to this one: the
# Node version is the matrix, resolved from `tools/configs/node-support.json`,
# and building on each version is the check, so there is no shared `build`.

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  # No inputs: the queue dispatches each layer it stacks with none (see
  # "Triggers" in README.md and `check:root:dispatch-inputs`).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.event_name == 'push', github.sha, github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    uses: ./.github/workflows/check-gates.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      # What code-check.yml's list ignores, but for the app pages it takes
      # back: nothing in them depends on the Node.js version this matrix
      # varies. tools/configs/gate-ignore-lists.json keeps both lists side by
      # side (see "The ignore lists" in README.md).
      diff-scope: runtime
      result-job: test-node-versions-result / result

  test-node-versions:
    needs: gates
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-ci')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false' &&
      needs.gates.outputs.reused_result == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # install + ws:build + ws:check:test or a shard of it, per job, which has
    # taken under ten minutes. The 10 minutes this was set to when the
    # repository held two packages cut two of the three matrix entries off
    # mid-test.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The entries are the *keys* of `targets` in
        # tools/configs/node-support.json, not the versions themselves. The
        # versions move on a schedule — node-support-update.yml refreshes `lts`
        # and `current` weekly — and the names do not, so a refresh is a change
        # to one data file rather than an edit here, and `minimum` stays
        # readable as "the floor `engines.node` promises" instead of as a
        # number nobody can place. `check-node-support` fails when this list
        # and that file's keys disagree.
        #
        # `current` is deliberately not one of them. `check-node-support` also
        # asserts `volta.node == targets.current`, and `volta.node` is what
        # `node-version-file: 'package.json'` resolves to in every other
        # workflow — so code-check.yml's `ws:check:test:cov` shards already run
        # this very suite on this very version, with coverage on top. A `current` entry
        # here was the same tests on the same Node a second time, and the build
        # in front of them a second time.
        target: [minimum, lts]
        # Three jobs: `minimum` runs `ws:check:test` whole, and `lts`, whose
        # tests take longer, runs it in two shards, each building again. One
        # pull request's jobs across the check workflows are kept at
        # seventeen of the account's twenty runners and all start together
        # after their gates (see the matrix of code-check.yml), so every job
        # is sized to about the longest one: `minimum` whole, about 400
        # seconds (a build of one and a half minutes, four and a half of
        # tests). `lts` whole was about 470 and would be the longest of the
        # pull request; its shards are about 300 each. The shards name the
        # four slowest suites and exclude them, so a new package lands in the
        # second. Each is `--no-bail`, so one package's failure does not hide
        # the rest.
        #
        # The second shard takes four packages at a time
        # (`--workspace-concurrency=4`): most of its suites spend their few
        # seconds starting the test runner on one core, which four cores
        # overlap (about 110 seconds of tests became 60 on four cores). The
        # first stays at one: each of its suites fills the runner on its own,
        # and running them together is what once pushed eslint-config-typed's
        # RuleTester tests past their timeout. So `ws:check:test` is the two
        # shards in a row rather than one run at either setting: about 100
        # and 60 seconds on four cores, where one run at one was about 210,
        # and the heavy suites never overlap.
        command:
          - ws:check:test:shard-1
          - ws:check:test:shard-2
        exclude:
          - target: minimum
        include:
          - target: minimum
            command: ws:check:test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}

      # Resolved from the checkout rather than written into the matrix above,
      # so that the versions this job runs and the versions
      # `check-node-support` holds the manifests to are the same three strings.
      # The runner's preinstalled Node reads the file; `setup-node` then
      # replaces it with the one named here.
      - name: Resolve the Node.js version for `${{ matrix.target }}`
        id: node-version
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./tools/configs/node-support.json').targets[process.env.TARGET]")"
          echo "${TARGET} -> Node ${version}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      # `--engine-strict` is what turns the `minimum` entry from a claim into a
      # check: pnpm refuses the install when any package's `engines.node`
      # excludes the running version, so the floor every published package
      # promises is exercised on the exact version it names.
      - name: Set up pnpm, Node.js for `${{ matrix.target }}` and the dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          engine-strict: true

      - name: Verify installation
        run: pnpm list

      - name: Build
        run: pnpm run ws:build

      - name: Test
        run: pnpm run ${{ matrix.command }}

  # The one required status check for this workflow, reported as
  # `test-node-versions-result / result` — see "The aggregate job" in README.md.
  test-node-versions-result:
    needs:
      - gates
      - test-node-versions
    # Not on a label event while `skip-ci` is on, so that putting the label on
    # supersedes no verdict — "A label event under `skip-ci`" in README.md.
    if: >-
      always() &&
      !((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    uses: ./.github/workflows/check-result.yml
    with:
      needs: ${{ toJSON(needs) }}
