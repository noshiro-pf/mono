name: Node.js Version Compatibility

on:
  push:
    branches-ignore:
      - 'develop'
      - 'develop*'
    paths-ignore:
      - '.gitignore'

  workflow_dispatch:

jobs:
  test-node-versions:
    runs-on: ubuntu-latest
    # install + ws:build + ws:test across 17 packages, per Node version.
    # The 10 minutes this was set to when the repository held two packages
    # cut two of the three matrix entries off mid-test.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.2', '24.17.0', '26.3.1']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch main
        run: git fetch origin main # To allow check-should-run-type-checks to get the diff from main

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict

      # NOTE: To include this workflow in the branch protection rule status check,
      # skip each step instead of skipping the entire workflow with paths-ignore.
      - name: Check diff
        id: check_diff_type
        # `check-should-run-type-checks` diffs against origin/main. On a push
        # to main that is a diff against HEAD itself, which comes back empty
        # and reads as "nothing relevant changed" — so every step below skips,
        # the coverage upload among them, and the job still reports success.
        # Compare with what main pointed at before the push instead.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run z:check-should-run-type-checks
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run z:check-should-run-type-checks --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi

      - name: Verify installation
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm list

      - name: Build
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ws:build

      - name: Test
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ws:test
