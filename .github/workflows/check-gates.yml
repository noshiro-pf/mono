name: Check Gates

# The gate every check workflow calls: is the pull request's branch up to
# date with the base branch, does its diff touch anything the caller reads,
# and has an earlier run already reached a verdict on this tree? The
# design — why the questions are asked here rather than in a job-level `if`,
# what the callers do with the answers, what may go on an ignore list, which
# verdicts are reused — is in README.md, under "The gate: `check-gates.yml`".
# What follows is only what the steps themselves need to say.

on:
  workflow_call:
    inputs:
      diff-scope:
        description: >-
          Which ignore list in the root `package.json` to gate on: `code` for
          code-check.yml and node-version-compatibility.yml, `style` for
          style-check.yml, `strict-lib` for strict-lib-gen.yml. `none` skips
          the diff question altogether, for the one workflow that gates itself
          in shell — the gate then costs a few API calls and no checkout.
        type: string
        required: true
      result-job:
        description: >-
          The id of the caller's aggregate job (`code-check-result`, …), whose
          conclusion in an earlier run on the same tree is what gets reused.
        type: string
        required: true
      diff-when-reused:
        description: >-
          Answer the diff question even when a verdict is reused, for a caller
          with a job that a reused verdict does not skip but an irrelevant
          diff does — `coverage-main` in code-check.yml. Otherwise a reused
          verdict leaves `should_run` empty and saves the checkout.
        type: boolean
        default: false
    outputs:
      branch_up_to_date:
        description: >-
          `false` when the pull request's branch is behind its base branch and
          the caller's checks should be skipped, `true` otherwise. Empty if
          this workflow failed to reach an answer, which the callers read as
          `true`.
        value: ${{ jobs.check.outputs.branch_up_to_date }}
      should_run:
        description: >-
          `false` when the diff touches nothing the caller reads, `true`
          otherwise. Empty for `diff-scope: none`, and empty when the branch
          is behind — the caller skips on `branch_up_to_date` in that case, so
          there is no point paying for the answer — and when a verdict is
          reused, unless `diff-when-reused` is set. Callers read empty as
          `true`.
        value: ${{ jobs.check.outputs.should_run }}
      reused_result:
        description: >-
          `success` or `failure` when an earlier run of the calling workflow
          reached that verdict on this tree — the caller skips its work and
          its aggregate reports this instead. Empty otherwise, including when
          the lookup failed, which the callers read as "run the checks".
        value: ${{ jobs.check.outputs.reused_result }}
      reused_from:
        description: The URL of the aggregate job whose verdict was reused.
        value: ${{ jobs.check.outputs.reused_from }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A few API calls and a read-only checkout. `gh` needs a token to be set
    # at all, hence `github.token`; `actions: read` is what listing the
    # earlier runs and their jobs needs; `packages: read` is what the install
    # needs for the `@noshiro-pf` scope.
    permissions:
      actions: read
      contents: read
      packages: read

    outputs:
      branch_up_to_date: ${{ steps.branch_state.outputs.branch_up_to_date }}
      should_run: ${{ steps.check_diff.outputs.should_run }}
      reused_result: ${{ steps.reuse.outputs.reused_result }}
      reused_from: ${{ steps.reuse.outputs.reused_from }}

    steps:
      # A later run's reuse lookup reads this step's *name* back from this
      # run's jobs list: the one record of what this run's verdict is about
      # that is written when the run happens, rather than read afterwards
      # from a pull request whose base may since have been changed. The
      # workflow files a `pull_request` run executes are those of the head
      # merged into its base, which is the head's tree only when the base is
      # the default branch and the branch is up to date with it — and a run
      # made while behind has no verdict to read. First, so that it is in the
      # list whatever the steps after it do. See "Reusing a verdict" in
      # README.md.
      - name: "Verdict reusable by tree: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref == (github.event.repository.default_branch || 'main') }}"
        run: echo 'Recorded in the step name above, for the reuse lookup of later runs.'

      - name: Check whether the branch is behind the base branch
        id: branch_state
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Every event that reaches here carries the repository, so the
          # fallback is only there because an empty value would turn this gate
          # off without saying so: no base branch would ever match it.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          run_the_checks() {
            echo "${1}"
            echo 'branch_up_to_date=true' >>"${GITHUB_OUTPUT}"
            exit 0
          }

          # `push` and `workflow_dispatch` are exempt, exactly as they are
          # from the `skip-ci` gate: there is no pull request to be behind
          # anything, and asking for the checks by hand from the Actions tab
          # is asking for them regardless of the branch's state.
          if [ "${GITHUB_EVENT_NAME}" != 'pull_request' ]; then
            run_the_checks "Not a pull request event (${GITHUB_EVENT_NAME}): there is no base branch to be behind."
          fi

          # Only the default branch carries the strict policy, so only there
          # does being behind block the merge and guarantee another run. A pull
          # request onto any other branch is checked as it is: skipping it
          # would wait for an update that nothing requires and may never come.
          if [ "${BASE_REF}" != "${DEFAULT_BRANCH}" ]; then
            run_the_checks "The base branch is ${BASE_REF}, not ${DEFAULT_BRANCH}: being behind it blocks nothing, so the checks run."
          fi

          # `behind_by` is what the pull request page turns into "This branch is
          # out-of-date with the base branch": commits reachable from the base
          # branch's tip but not from the head. Compared against the base
          # branch by name, so the answer is about its tip right now rather
          # than about `base.sha`, which is only as fresh as this event; and
          # against the head by SHA, so a fork needs no special case — a pull
          # request's head commit is readable from the base repository, its
          # branch is not.
          if ! behind_by="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${HEAD_SHA}" --jq '.behind_by' 2>&1)"; then
            run_the_checks "Could not compare ${BASE_REF} with ${HEAD_SHA}, so the checks run: ${behind_by}"
          fi

          case "${behind_by}" in
            '' | *[!0-9]*)
              run_the_checks "The compare API answered \"${behind_by}\", which is not a commit count, so the checks run."
              ;;
          esac

          if [ "${behind_by}" -eq 0 ]; then
            run_the_checks "The branch is up to date with ${BASE_REF}."
          fi

          echo 'branch_up_to_date=false' >>"${GITHUB_OUTPUT}"

          summary="The branch is ${behind_by} commit(s) behind ${BASE_REF} — \"out-of-date with the base branch\", which cannot be merged. Update the branch: the run after the update is the one whose result counts."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"

      # Before the checkout, because a reused verdict makes the diff question
      # moot. Which runs are asked, and which verdicts are not reused, is in
      # README.md under "Reusing a verdict".
      - name: Look for a verdict already reached on this tree
        id: reuse
        if: steps.branch_state.outputs.branch_up_to_date != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          RESULT_JOB: ${{ inputs.result-job }}
        run: |
          # Leaves both outputs empty, which the callers read as "run the checks".
          run_the_checks() {
            echo "${1}"
            exit 0
          }

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              if [ "${BASE_REF}" != "${DEFAULT_BRANCH}" ]; then
                run_the_checks "The base branch is ${BASE_REF}, not ${DEFAULT_BRANCH}: no verdict is reused."
              fi
              ;;
            push)
              if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
                run_the_checks "A push to ${GITHUB_REF_NAME}, not ${DEFAULT_BRANCH}: no verdict is reused."
              fi
              ;;
            *)
              run_the_checks "A ${GITHUB_EVENT_NAME} event: the checks run."
              ;;
          esac

          if [ "${GITHUB_RUN_ATTEMPT}" != '1' ]; then
            run_the_checks "This is attempt ${GITHUB_RUN_ATTEMPT} of the run, i.e. a re-run asked for by hand: the checks run for real."
          fi

          if ! TREE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}" --jq '.tree.sha' 2>&1)"; then
            run_the_checks "Could not read the tree of ${HEAD_SHA}, so the checks run: ${TREE_SHA}"
          fi

          case "${TREE_SHA}" in
            '' | *[!0-9a-f]*)
              run_the_checks "The commits API answered \"${TREE_SHA}\" for the tree of ${HEAD_SHA}, which is not a SHA, so the checks run."
              ;;
          esac

          # Read by the `--jq` filter below.
          export TREE_SHA

          # `github.workflow_ref` is the caller's, even inside a called
          # workflow: `<owner>/<repo>/.github/workflows/<file>@<ref>`.
          workflow_path="${GITHUB_WORKFLOW_REF%@*}"
          workflow_file="${workflow_path##*/}"

          # Runs of every event, not only this one's: a pull request's verdict
          # is what a push to main reuses. `head_commit.tree_id` is the tree of
          # each run's head, so matching costs no request per run. Runs still
          # in progress have no verdict, and a cancelled run's red aggregate is
          # not one; `success` / `failure` is also what a run whose every job
          # was skipped concludes, which the job filter below takes care of.
          if ! run_ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[]
              | select(.conclusion == "success" or .conclusion == "failure")
              | select(.head_commit.tree_id == env.TREE_SHA)
              | select(.head_repository.full_name == env.GITHUB_REPOSITORY)
              | .id' 2>&1)"; then
            run_the_checks "Could not list earlier runs of ${workflow_file}, so the checks run: ${run_ids}"
          fi

          verdicts=''
          for run_id in ${run_ids}; do
            if [ "${run_id}" = "${GITHUB_RUN_ID}" ]; then
              continue
            fi

            # Only a run whose gate recorded its verdict as one about the tree
            # (the first step of this job); a run from before that step
            # existed recorded nothing, and is not reused.
            if ! jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
              --jq 'select(any(.jobs[].steps[]?; .name == "Verdict reusable by tree: true"))
                | .jobs[]
                | select(.name == env.RESULT_JOB and (.conclusion == "success" or .conclusion == "failure"))
                | "\(.completed_at)\t\(.conclusion)\t\(.html_url)"' 2>&1)"; then
              run_the_checks "Could not list the jobs of run ${run_id}, so the checks run: ${jobs}"
            fi

            if [ -n "${jobs}" ]; then
              verdicts="${verdicts}${jobs}"$'\n'
            fi
          done

          # ISO 8601 timestamps in UTC sort as strings.
          latest="$(printf '%s' "${verdicts}" | sort -r | head -n 1)"

          if [ -z "${latest}" ]; then
            run_the_checks "No earlier run of ${workflow_file} reached a verdict on tree ${TREE_SHA} (${HEAD_SHA}): the checks run."
          fi

          conclusion="$(printf '%s' "${latest}" | cut -f 2)"
          url="$(printf '%s' "${latest}" | cut -f 3)"

          echo "reused_result=${conclusion}" >>"${GITHUB_OUTPUT}"
          echo "reused_from=${url}" >>"${GITHUB_OUTPUT}"

          summary="${RESULT_JOB} already concluded \`${conclusion}\` on tree ${TREE_SHA}, the tree of ${HEAD_SHA} (${url}); that verdict is reused and the checks do not run again. Use \"Re-run all jobs\" to run them anyway."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"

      # Everything below answers the diff question, and is worth nothing when
      # the caller is going to skip on either answer above — so it is gated on
      # both as well as on the scope, save for a caller that asked for the
      # diff whatever the verdict.
      - name: Checkout
        id: checkout
        if: >-
          inputs.diff-scope != 'none' &&
          steps.branch_state.outputs.branch_up_to_date != 'false' &&
          (steps.reuse.outputs.reused_result == '' || inputs.diff-when-reused)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch main
        if: steps.checkout.outcome == 'success'
        run: git fetch origin main # To allow the diff gate below to get the diff from main

      - name: Install pnpm
        if: steps.checkout.outcome == 'success'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        if: steps.checkout.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.checkout.outcome == 'success'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check diff
        id: check_diff
        if: steps.checkout.outcome == 'success'
        # The script writes `should_run=` to `GITHUB_OUTPUT` itself.
        #
        # It diffs against origin/main. On a push to main that is a diff
        # against HEAD itself, which comes back empty and reads as "nothing
        # relevant changed" — so every caller would skip, and its jobs would
        # report `skipped`, which satisfies a required status check. Compare
        # with what main pointed at before the push instead.
        env:
          BEFORE: ${{ github.event.before }}
          SCOPE: ${{ inputs.diff-scope }}
        run: |
          case "${SCOPE}" in
            code | style | strict-lib) ;;
            *)
              echo "::error::Unknown diff-scope \"${SCOPE}\"; expected code, style, strict-lib or none."
              exit 1
              ;;
          esac

          script="z:check-should-run:${SCOPE}-checks"

          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run "${script}"
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run "${script}" --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi
