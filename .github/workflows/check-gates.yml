name: Check Gates

# The two questions each check workflow has to answer before it is worth
# booting a matrix: is the pull request's branch up to date with the base
# branch, and does its diff touch anything the workflow reads? One job answers
# both, once per workflow run, and the caller turns the answers into
# job-level `if`s — the only thing that skips a job before a runner boots.
#
# ## Being behind the base branch
#
# That is the state the pull request page calls "This branch is out-of-date
# with the base branch". Such a branch cannot be merged: `main`'s ruleset sets
# `strict_required_status_checks_policy`, so the required checks have to pass
# on a head that already contains main's tip, and updating the branch fires
# `synchronize` and runs every check again on the commit that will actually be
# merged. The run happening before that update is a run whose result nothing
# can use.
#
# ## Whether the diff matters
#
# `check-should-run` from `ts-repo-utils`, against one of the ignore lists
# in the root `package.json` — see "CI diff gates" in CLAUDE.md. This used to
# be a step inside every job, which meant each of the 22 matrix runners across
# the three workflows booted, checked out and installed dependencies (~45s
# apiece) before finding out it had nothing to do. Here it costs one runner
# for all of them.
#
# Two things had to be true before it could move:
#
# - The answer needs `pnpm install` — the gate is a program, not a glob match
#   — so it cannot live in a job-level `if`, which GitHub evaluates from the
#   event payload alone. Hence a job that computes it and a caller that reads
#   its output, which is the shape this workflow already had for the branch
#   question.
# - A skipped matrix job produces one check run named after the *job*, never
#   the `code-check (…)` matrix contexts. While those were the required
#   status checks, skipping the job at job level would have left them missing
#   — "Expected", blocking forever. Only since the `*-result` aggregates
#   became the required contexts is a job-level skip safe here.
#
# ## A commit that already has a verdict
#
# Every job the callers run reads the pull request's head commit and nothing
# else — they check out `pull_request.head.sha` — so a second run on the same
# head can only repeat the first one's verdict, pass or fail. Such runs are
# common: any label event (`merge-queued`, `bug`, …), `reopened`, and a
# `skip-ci` taken off a commit that was checked before it went on. So when an
# earlier run of the calling workflow on this head reached a verdict, its
# aggregate job's conclusion is handed back as `reused_result`, the callers
# skip their matrix, and their aggregate reports that conclusion — green or
# red, never skipped, so a reused verdict cannot read as a check that did not
# happen.
#
# What makes "same head" enough is the branch question above: the lookup only
# happens on an up-to-date branch of the default branch, where the commit that
# would be merged has the head's tree, workflow files included. An earlier run
# made while the branch was behind has a skipped aggregate and is not a
# verdict.
#
# Some things are deliberately not reused:
#
# - A run that was cancelled — its aggregate still runs under `always()` and
#   reads red, but it says nothing about the commit.
# - A skipped aggregate (`skip-ci`, behind, nothing relevant in the diff).
# - Anything, when this is a re-run (`run_attempt` > 1) or not a
#   `pull_request` event. "Re-run all jobs" and `workflow_dispatch` are how a
#   person asks for the checks to actually run — to see whether a failure was
#   a flake, say. "Re-run failed jobs" is not enough after a reused failure:
#   it keeps this job's outputs from the first attempt.
#
# Where several earlier runs have a verdict, the one whose aggregate completed
# last wins, so a flake that was re-run to green supersedes the red that a
# later run reused from it.
#
# ## Why a workflow of its own
#
# `workflow_call` rather than the same shell copied into four workflows:
# there is one answer to give and one place to change it. Callers fail open —
# see the note on the `if` in code-check.yml.

on:
  workflow_call:
    inputs:
      diff-scope:
        description: >-
          Which ignore list in the root `package.json` to gate on: `code` for
          code-check.yml and node-version-compatibility.yml, `style` for
          style-check.yml, `strict-lib` for strict-lib-gen.yml. `none` skips
          the diff question altogether, for the one workflow that gates itself
          in shell — the gate then costs one API call and no checkout.
        type: string
        required: true
      result-job:
        description: >-
          The id of the caller's aggregate job (`code-check-result`, …), whose
          conclusion in an earlier run on the same head is what gets reused.
        type: string
        required: true
    outputs:
      branch_up_to_date:
        description: >-
          `false` when the pull request's branch is behind its base branch and
          the caller's checks should be skipped, `true` otherwise. Empty if
          this workflow failed to reach an answer, which the callers read as
          `true`.
        value: ${{ jobs.check.outputs.branch_up_to_date }}
      should_run:
        description: >-
          `false` when the diff touches nothing the caller reads, `true`
          otherwise. Empty for `diff-scope: none`, and empty when the branch
          is behind — the caller skips on `branch_up_to_date` in that case, so
          there is no point paying for the answer. Callers read empty as
          `true`.
        value: ${{ jobs.check.outputs.should_run }}
      reused_result:
        description: >-
          `success` or `failure` when an earlier run of the calling workflow
          reached that verdict on this head commit — the caller skips its
          work and its aggregate reports this instead. Empty otherwise,
          including when the lookup failed, which the callers read as "run
          the checks". `should_run` is left empty when this is set.
        value: ${{ jobs.check.outputs.reused_result }}
      reused_from:
        description: The URL of the aggregate job whose verdict was reused.
        value: ${{ jobs.check.outputs.reused_from }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A few API calls and a read-only checkout. `gh` needs a token to be set
    # at all, hence `github.token`; `actions: read` is what listing the
    # earlier runs and their jobs needs; `packages: read` is what the install
    # needs for the `@noshiro-pf` scope.
    permissions:
      actions: read
      contents: read
      packages: read

    outputs:
      branch_up_to_date: ${{ steps.branch_state.outputs.branch_up_to_date }}
      should_run: ${{ steps.check_diff.outputs.should_run }}
      reused_result: ${{ steps.reuse.outputs.reused_result }}
      reused_from: ${{ steps.reuse.outputs.reused_from }}

    steps:
      - name: Check whether the branch is behind the base branch
        id: branch_state
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Every event that reaches here carries the repository, so the
          # fallback is only there because an empty value would turn this gate
          # off without saying so: no base branch would ever match it.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          run_the_checks() {
            echo "${1}"
            echo 'branch_up_to_date=true' >>"${GITHUB_OUTPUT}"
            exit 0
          }

          # `push` and `workflow_dispatch` are exempt, exactly as they are
          # from the `skip-ci` gate: there is no pull request to be behind
          # anything, and asking for the checks by hand from the Actions tab
          # is asking for them regardless of the branch's state.
          if [ "${GITHUB_EVENT_NAME}" != 'pull_request' ]; then
            run_the_checks "Not a pull request event (${GITHUB_EVENT_NAME}): there is no base branch to be behind."
          fi

          # Only the default branch carries the strict policy, so only there
          # does being behind block the merge and guarantee another run. A pull
          # request onto any other branch is checked as it is: skipping it
          # would wait for an update that nothing requires and may never come.
          if [ "${BASE_REF}" != "${DEFAULT_BRANCH}" ]; then
            run_the_checks "The base branch is ${BASE_REF}, not ${DEFAULT_BRANCH}: being behind it blocks nothing, so the checks run."
          fi

          # `behind_by` is what the pull request page turns into "This branch is
          # out-of-date with the base branch": commits reachable from the base
          # branch's tip but not from the head. Compared against the base
          # branch by name, so the answer is about its tip right now rather
          # than about `base.sha`, which is only as fresh as this event; and
          # against the head by SHA, so a fork needs no special case — a pull
          # request's head commit is readable from the base repository, its
          # branch is not.
          if ! behind_by="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${HEAD_SHA}" --jq '.behind_by' 2>&1)"; then
            run_the_checks "Could not compare ${BASE_REF} with ${HEAD_SHA}, so the checks run: ${behind_by}"
          fi

          case "${behind_by}" in
            '' | *[!0-9]*)
              run_the_checks "The compare API answered \"${behind_by}\", which is not a commit count, so the checks run."
              ;;
          esac

          if [ "${behind_by}" -eq 0 ]; then
            run_the_checks "The branch is up to date with ${BASE_REF}."
          fi

          echo 'branch_up_to_date=false' >>"${GITHUB_OUTPUT}"

          summary="The branch is ${behind_by} commit(s) behind ${BASE_REF} — \"out-of-date with the base branch\", which cannot be merged. Update the branch: the run after the update is the one whose result counts."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"

      # See "A commit that already has a verdict" at the top. Before the
      # checkout, because a reused verdict makes the diff question moot.
      - name: Look for a verdict already reached on this head commit
        id: reuse
        if: steps.branch_state.outputs.branch_up_to_date != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          RESULT_JOB: ${{ inputs.result-job }}
        run: |
          # Leaves both outputs empty, which the callers read as "run the checks".
          run_the_checks() {
            echo "${1}"
            exit 0
          }

          if [ "${GITHUB_EVENT_NAME}" != 'pull_request' ]; then
            run_the_checks "Not a pull request event (${GITHUB_EVENT_NAME}): the checks run."
          fi

          if [ "${GITHUB_RUN_ATTEMPT}" != '1' ]; then
            run_the_checks "This is attempt ${GITHUB_RUN_ATTEMPT} of the run, i.e. a re-run asked for by hand: the checks run for real."
          fi

          # Only against the default branch does being up to date guarantee
          # that the commit to be merged has the head's tree.
          if [ "${BASE_REF}" != "${DEFAULT_BRANCH}" ]; then
            run_the_checks "The base branch is ${BASE_REF}, not ${DEFAULT_BRANCH}: no verdict is reused."
          fi

          # `github.workflow_ref` is the caller's, even inside a called
          # workflow: `<owner>/<repo>/.github/workflows/<file>@<ref>`.
          workflow_path="${GITHUB_WORKFLOW_REF%@*}"
          workflow_file="${workflow_path##*/}"

          # Runs still in progress have no verdict, and a cancelled run's red
          # aggregate is not one; `success` / `failure` is also what a run
          # whose every job was skipped concludes, which the job filter below
          # takes care of.
          if ! run_ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?head_sha=${HEAD_SHA}&status=completed&per_page=20" \
            --jq '.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure") | .id' 2>&1)"; then
            run_the_checks "Could not list earlier runs of ${workflow_file}, so the checks run: ${run_ids}"
          fi

          verdicts=''
          for run_id in ${run_ids}; do
            if [ "${run_id}" = "${GITHUB_RUN_ID}" ]; then
              continue
            fi

            if ! jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == env.RESULT_JOB and (.conclusion == "success" or .conclusion == "failure")) | "\(.completed_at)\t\(.conclusion)\t\(.html_url)"' 2>&1)"; then
              run_the_checks "Could not list the jobs of run ${run_id}, so the checks run: ${jobs}"
            fi

            if [ -n "${jobs}" ]; then
              verdicts="${verdicts}${jobs}"$'\n'
            fi
          done

          # ISO 8601 timestamps in UTC sort as strings.
          latest="$(printf '%s' "${verdicts}" | sort -r | head -n 1)"

          if [ -z "${latest}" ]; then
            run_the_checks "No earlier run of ${workflow_file} reached a verdict on ${HEAD_SHA}: the checks run."
          fi

          conclusion="$(printf '%s' "${latest}" | cut -f 2)"
          url="$(printf '%s' "${latest}" | cut -f 3)"

          echo "reused_result=${conclusion}" >>"${GITHUB_OUTPUT}"
          echo "reused_from=${url}" >>"${GITHUB_OUTPUT}"

          summary="${RESULT_JOB} already concluded \`${conclusion}\` on ${HEAD_SHA} (${url}); that verdict is reused and the checks do not run again. Use \"Re-run all jobs\" to run them anyway."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"

      # Everything below answers the diff question, and is worth nothing when
      # the caller is going to skip on either answer above — so it is gated on
      # both as well as on the scope. A branch behind `main` therefore still
      # costs the four seconds this gate used to cost in total.
      - name: Checkout
        id: checkout
        if: >-
          inputs.diff-scope != 'none' &&
          steps.branch_state.outputs.branch_up_to_date != 'false' &&
          steps.reuse.outputs.reused_result == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event, so that the diff is the one the callers'
          # checks will actually run against.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch main
        if: steps.checkout.outcome == 'success'
        run: git fetch origin main # To allow the diff gate below to get the diff from main

      - name: Install pnpm
        if: steps.checkout.outcome == 'success'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        if: steps.checkout.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.checkout.outcome == 'success'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check diff
        id: check_diff
        if: steps.checkout.outcome == 'success'
        # The script writes `should_run=` to `GITHUB_OUTPUT` itself.
        #
        # It diffs against origin/main. On a push to main that is a diff
        # against HEAD itself, which comes back empty and reads as "nothing
        # relevant changed" — so every caller would skip, and its jobs would
        # report `skipped`, which satisfies a required status check. Compare
        # with what main pointed at before the push instead.
        env:
          BEFORE: ${{ github.event.before }}
          SCOPE: ${{ inputs.diff-scope }}
        run: |
          case "${SCOPE}" in
            code | style | strict-lib) ;;
            *)
              echo "::error::Unknown diff-scope \"${SCOPE}\"; expected code, style, strict-lib or none."
              exit 1
              ;;
          esac

          script="z:check-should-run:${SCOPE}-checks"

          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run "${script}"
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run "${script}" --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi
