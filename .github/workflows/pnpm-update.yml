name: pnpm update

# Runs this repository's own `update-packages` script together with `pnpm
# self-update`, and opens a single bundled pull request that auto-merges once
# CI passes. It runs daily and always rebuilds from main, so the pull request
# follows main rather than accumulating a new one per run.
#
# This replaces Dependabot entirely: the npm dependencies come from
# `update-packages`, and the action pins in `.github/workflows/` come from
# pnpm's own `update.githubActions` (see below). There is no
# .github/dependabot.yml any more.
#
# This is a Changesets monorepo, so the workflow also adds a patch changeset
# for each publishable (non-private) workspace package whose runtime
# (dependencies / peerDependencies / optionalDependencies) changed, mirroring
# the classification that dependabot-changeset.yml used, so the Changesets
# release flow publishes those packages once the PR merges.
#
# What is held back is declared in pnpm-workspace.yaml under `update.ignoreDeps`
# — currently `typescript`, which also covers the `typescript-native` alias
# since pnpm matches the resolved package. `update.githubActions: true` there
# is what lets this touch the workflow files; because it does, the token below
# has to carry the `workflows` permission as well, or the push is rejected the
# moment an action pin under .github/workflows/ moves.
#
# Authenticates with a GitHub App installation token (the same App used by
# release.yml) so that the push triggers the push-based CI workflows
# and the repository owner (a ruleset bypass actor) can auto-merge. The App's
# installation must be granted Workflows: write; the `permission-*` inputs can
# only narrow what the App already holds, never widen it.

on:
  schedule:
    # Daily, 06:07 JST (21:07 UTC the day before). `minimumReleaseAge` holds
    # releases for a week, so most days find nothing and exit without pushing;
    # the days that do find something also pick up whatever landed on main,
    # which is what keeps the open pull request from going stale.
    - cron: '7 21 * * *'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pnpm-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not persist any token in the git config: `pnpm install` below runs
          # dependency lifecycle scripts, and the PAT must not be exposed to them.
          # It is supplied inline only for the final push.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Update pnpm itself
        run: pnpm self-update

      - name: Update dependencies
        run: |
          pnpm run update-packages
          pnpm install --no-frozen-lockfile

      # The published half of `verify-npm-packages` pins exact versions, and
      # this is where they move — a release shows up as a reviewable diff
      # rather than as an unrelated branch starting to fail. `continue-on-error`
      # because the step also runs the checks: a package that is broken on npm
      # should not stop the dependency update, and verify-published-packages.yml
      # reports it on the resulting pull request anyway.
      - name: Refresh the published-package pins
        continue-on-error: true
        run: pnpm run verify:npm-packages:published:update

      # 依存更新が終わってからトークンを発行する。許可済みビルドスクリプトが
      # 動く前に鍵を job へ持ち込まないため。
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          permission-contents: write # ブランチの push
          permission-pull-requests: write # PR の作成と auto-merge の有効化
          # `update.githubActions: true` により .github/workflows/ の action ピンも
          # 更新されるため、これが無いと push が
          # 「refusing to allow a GitHub App to create or update workflow ...」で拒否される。
          permission-workflows: write # workflow ファイルを含むコミットの push

      - name: Open auto-merge PR if anything changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # `git status --porcelain` (not `git diff --quiet`) so untracked files
          # created by the update are detected too.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Dependencies already up to date; nothing to do."
            exit 0
          fi

          # Add a patch changeset for each publishable package whose runtime deps
          # changed, so the Changesets release flow publishes it. (HEAD is still
          # the pre-update baseline here — nothing has been committed yet.)
          export DATESTR="$(date -u +%Y%m%d)"
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const path = require('node:path');
          const RUNTIME = ['dependencies', 'peerDependencies', 'optionalDependencies'];
          const baseline = (file) => {
            try {
              return JSON.parse(cp.execSync(`git show HEAD:${file}`, { encoding: 'utf8' }));
            } catch {
              return {};
            }
          };
          const changed = [];
          const workspaceDirs = ['libs', 'apps'].flatMap((group) =>
            fs.readdirSync(group, { withFileTypes: true })
              .filter((d) => d.isDirectory())
              .map((d) => path.join(group, d.name)),
          );
          for (const dir of workspaceDirs) {
            const file = path.join(dir, 'package.json');
            if (!fs.existsSync(file)) continue;
            const cur = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (typeof cur.name !== 'string' || cur.private === true) continue;
            const base = baseline(file);
            const runtimeChanged = RUNTIME.some(
              (k) => JSON.stringify(cur[k] ?? {}) !== JSON.stringify(base[k] ?? {}),
            );
            if (runtimeChanged) changed.push(cur.name);
          }
          if (changed.length === 0) {
            console.log('No publishable runtime-dependency changes; no changeset added.');
          } else {
            const lines = ['---', ...changed.map((n) => `'${n}': patch`), '---', '', 'Update dependencies', ''];
            fs.writeFileSync(`.changeset/pnpm-update-${process.env.DATESTR}.md`, lines.join('\n'));
            console.log(`Added patch changeset for: ${changed.join(', ')}`);
          }
          NODE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # A fixed branch name, not one carrying the date: every run starts from
          # a fresh checkout of main, so force-pushing here both refreshes the
          # open pull request and rebases it, instead of leaving last week's
          # behind and opening another one.
          branch="chore/pnpm-update"
          git switch -c "$branch"
          git add -A
          git commit -m "chore: update dependencies"

          # Authenticate the push inline so the PAT is never written to git config.
          git push --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"

          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update dependencies" \
              --body "Automated dependency update via \`pnpm run update-packages\` + \`pnpm self-update\`. A patch changeset is added for publishable packages whose runtime dependencies changed. Rebuilt from main on every run, so force-pushes to this branch are expected. Auto-merges once CI passes."
          fi
          gh pr merge --auto --squash "$branch"
