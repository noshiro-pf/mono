name: pnpm update

# Runs this repository's own `update-packages` and `update-actions` scripts
# together with `pnpm self-update`, and opens a single bundled pull request that
# auto-merges once CI passes. It runs daily and always rebuilds from main, so
# the pull request follows main rather than accumulating a new one per run.
#
# This replaces Dependabot entirely: the npm dependencies come from
# `update-packages` (whose skip rules — `update.ignoreDeps`,
# `minimumReleaseAge` — live in pnpm-workspace.yaml), and the action pins in
# `.github/workflows/` come from `update-actions`. There is no
# .github/dependabot.yml.
#
# `update-packages` also carries `--filter '!./strict-lib/v*/output/lib'`, which
# is the one skip that cannot live in pnpm-workspace.yaml. Those twelve
# package.json are generated by `strict-lib:gen:packages`, which writes their
# `ts-type-forge` range as `^<major>.0.0` on purpose so consumers are not pinned
# to the version the library happened to be generated against. `--latest` would
# write the exact current version into all twelve and the next generation would
# put them back, so the skip is by project rather than by dependency —
# `update.ignoreDeps` names a dependency and would stop `ts-type-forge` moving
# everywhere else too.
#
# `update.ignoreDeps` currently holds back `typescript`, which also covers the
# `typescript-native` alias since pnpm matches the resolved package.
#
# This is a Changesets monorepo, so the workflow also adds a patch changeset
# for each publishable (non-private) workspace package whose runtime
# (dependencies / peerDependencies / optionalDependencies) changed, mirroring
# the classification that dependabot-changeset.yml used, so the Changesets
# release flow publishes those packages once the PR merges.
#
# The action pins move in a separate step, and not through pnpm.
# `update.githubActions` is deliberately `false`, so `update-packages` — which
# carries `--latest` — leaves them alone, and `update-actions` runs
# `tools/scripts/cmd/mature-updates.mts actions` rather than
# `pnpm update --include-github-actions`: pnpm resolves action versions from
# `git ls-remote` refs, which carry no publication date, so neither
# `minimumReleaseAge` nor `ignoreDeps` reaches them and a tag hours old was
# taken regardless. The script reads each action's GitHub Releases, moves a pin
# to the newest release of the same major that is older than
# `minimumReleaseAge`, and resolves the tag to its commit — the same SHA pin
# pnpm wrote. A major stays put until a human takes it, as before:
# `changesets/action` v2 is why. It requires Changesets CLI v3 and renamed every
# input, so the major landing unattended broke release.yml on main.
#
# Because that step rewrites files under .github/workflows/, the token below has
# to carry the `workflows` permission, or the push is rejected the moment an
# action pin moves.
#
# Authenticates with a GitHub App installation token (the same App used by
# release.yml) so that the push triggers the push-based CI workflows and the
# repository owner (a ruleset bypass actor) can auto-merge. The App's
# installation must be granted Workflows: write; the `permission-*` inputs can
# only narrow what the App already holds, never widen it.
#
# ## One branch, reused
#
# The branch is `chore/pnpm-update` with no date in it, and every run rebuilds
# it from a fresh checkout of main and force-pushes. A run that lands no update
# therefore does not leave a stale pull request behind for the next one to sit
# beside — there is only ever one open, and it is always rebased onto main.
#
# Reusing the name is what makes the two details below matter; with a new dated
# branch each run neither could bite, because the branch never already existed.

on:
  schedule:
    # Daily, 06:07 JST (21:07 UTC the day before). `minimumReleaseAge` holds
    # releases for a week, so most days find nothing and exit without pushing;
    # the days that do find something also pick up whatever landed on main,
    # which is what keeps the open pull request from going stale.
    - cron: '7 21 * * *'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pnpm-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not persist any token in the git config: `pnpm install` below runs
          # dependency lifecycle scripts, and the PAT must not be exposed to them.
          # It is supplied inline only for the final push.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      # The latest pnpm, majors included — unlike the action pins, which
      # `update-actions` deliberately keeps within `^current`. The difference
      # is what the pull request this job opens can prove: every job in the
      # check matrix installs with the new pnpm, so a major that breaks the
      # tree fails there rather than on `main`. An action major has no such
      # guarantee — it can sit in a workflow no pull request run exercises,
      # which is how `changesets/action` v2 reached `release.yml`.
      #
      # pnpm 12 is why that can be said at all. It rewrote peer resolution and
      # broke `verify-npm-packages/` (#1845), whose premise is a space where a
      # package may reach only what it declares. That space is now one
      # workspace root per project, each declaring the peer ranges of the
      # package under check — what a consumer has to do anyway, and what keeps
      # the next change of that kind from being invisible.
      #
      # Not a bare `pnpm self-update`: that ignores `minimumReleaseAge` by
      # design, and the pnpm command after it does not, so a release younger
      # than the hold failed this job daily until it matured. The script picks
      # the newest pnpm the hold already accepts and hands it to `self-update`;
      # its header has the whole story. It runs on `node` alone — nothing is
      # installed yet at this point, so `tsx` is not an option.
      - name: Update pnpm itself
        run: node ./tools/scripts/cmd/mature-updates.mts pnpm

      # Before the install, not after, and a step of its own — both for the
      # same reason. `pnpm install` below runs the dependency tree's lifecycle
      # scripts, and what this step executes is a file in the working tree
      # (`mature-updates.mts`, through `pnpm run`), which those scripts can
      # rewrite. Running it first means the file this step executes is still
      # the one that was checked out, and the token it carries has not been
      # anywhere near them. See "An inline `run:` block in a privileged job"
      # in CLAUDE.md for the general shape.
      #
      # `node`, not `pnpm run update-actions`, for the same reason the step
      # above invokes the script directly: `pnpm run` verifies the workspace's
      # dependencies first and installs them when they are missing, which is
      # exactly the thing this step has to come before. The script imports
      # `node:*` alone, so Node runs it with no `node_modules` at all. The
      # package.json script stays as the local entry point.
      #
      # `GITHUB_TOKEN` only reads the Releases and Commits APIs here, and lifts
      # the unauthenticated rate limit that the runners' shared IP range
      # otherwise exhausts.
      - name: Update the action pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./tools/scripts/cmd/mature-updates.mts actions

      - name: Update dependencies
        run: |
          pnpm run update-packages
          pnpm install --no-frozen-lockfile

      # The published half of `verify-npm-packages` pins exact versions, and
      # this is where they move — a release shows up as a reviewable diff
      # rather than as an unrelated branch starting to fail. `continue-on-error`
      # because the step also runs the checks: a package that is broken on npm
      # should not stop the dependency update, and verify-published-packages.yml
      # reports it on the resulting pull request anyway.
      - name: Refresh the published-package pins
        continue-on-error: true
        run: pnpm run verify:npm-packages:published:update

      # 依存更新が終わってからトークンを発行する。許可済みビルドスクリプトが
      # 動く前に鍵を job へ持ち込まないため。
      # Before the token, not inside the step that holds it. Reading the
      # manifests and writing a changeset needs no token, and everything that
      # happens in that last step happens with the App's key in the
      # environment — so the less of it there is, the better. Being its own
      # step is also what lets it be a file with a test rather than a `node`
      # heredoc; see the note in the script, and "An inline `run:` block in a
      # privileged job" in CLAUDE.md for why the reverse would not be safe.
      #
      # `HEAD` is still the pre-update commit here: nothing is committed until
      # the step below.
      - name: Add a changeset if a published package's runtime deps moved
        run: pnpm run update-changeset

      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          permission-contents: write # ブランチの push
          permission-pull-requests: write # PR の作成と auto-merge の有効化
          # `update-actions` により .github/workflows/ の action ピンも
          # 更新されるため、これが無いと push が
          # 「refusing to allow a GitHub App to create or update workflow ...」で拒否される。
          permission-workflows: write # workflow ファイルを含むコミットの push

      - name: Open auto-merge PR if anything changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # `git status --porcelain` (not `git diff --quiet`) so untracked files
          # created by the update are detected too.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Dependencies already up to date; nothing to do."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # No hooks. `pnpm install` above ran the dependency tree's lifecycle
          # scripts, and one of them can leave a `.git/hooks/pre-commit` behind
          # — which `git commit` would then run, here, with the App token
          # already in this step's environment. Set for the rest of the step
          # rather than per command, so a `git` added later is covered too.
          git config core.hooksPath /dev/null

          # A fixed branch name, not one carrying the date: every run starts from
          # a fresh checkout of main, so force-pushing here both refreshes the
          # open pull request and rebases it, instead of leaving yesterday's
          # behind and opening another one.
          branch="chore/pnpm-update"
          git switch -c "$branch"
          git add -A
          git commit -m "chore: update dependencies"

          # Authenticate the push inline so the PAT is never written to git config.
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # `--force-with-lease` with no value compares against the
          # remote-tracking ref, and `actions/checkout` configures a fetch
          # refspec for the default branch alone — so this branch has none, and
          # the push is rejected with "stale info" every run after the one that
          # creates it. Naming the expected value restores the protection: an
          # empty value means "expect it not to exist", which is what the first
          # run wants.
          # Two steps rather than a pipeline, so that a failed `ls-remote` stops
          # the job instead of yielding an empty lease and force-pushing anyway
          # — a pipeline would report `cut`'s exit status, which is always 0.
          remote_ref="$(git ls-remote "$remote_url" "refs/heads/${branch}")"
          expected="$(printf '%s' "$remote_ref" | cut -f1)"

          git push --force-with-lease="refs/heads/${branch}:${expected}" \
            "$remote_url" \
            "HEAD:refs/heads/${branch}"

          # By branch name alone `gh pr view` also finds a merged pull request,
          # and the branch is recreated every run — so once the first one
          # merges, this would skip creating the next and then fail trying to
          # auto-merge a closed pull request. Ask for an open one.
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null)" != 'OPEN' ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update dependencies" \
              --body "Automated dependency update via \`pnpm run update-packages\` + \`pnpm run update-actions\` + \`pnpm self-update\`. The latter two go through \`tools/scripts/cmd/mature-updates.mts\`, which holds pnpm itself and the action pins to \`minimumReleaseAge\` the way pnpm holds npm dependencies. Action pins move within their major only, so a major waits for a human. A patch changeset is added for publishable packages whose runtime dependencies changed. Rebuilt from main on every run, so force-pushes to this branch are expected. Auto-merges once CI passes."
          fi
          gh pr merge --auto --squash "$branch"
