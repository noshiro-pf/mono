name: pnpm update

# Runs this repository's own `update-packages`, `update-actions` and
# `update-release-binaries` scripts together with `pnpm self-update`, and opens
# a single bundled pull request that
# auto-merges once CI passes. It runs twice a week and always rebuilds from
# main, so the pull request follows main rather than accumulating a new one per
# run.
#
# This replaces Dependabot entirely: the npm dependencies come from
# `update-packages` (whose skip rules — `update.ignoreDeps`,
# `minimumReleaseAge` — live in pnpm-workspace.yaml), the action pins in
# `.github/workflows/` and `.github/actions/` come from `update-actions`, and
# the release binaries in `tools/configs/release-binaries.json` (actionlint,
# shellcheck) from `update-release-binaries`. There is no
# .github/dependabot.yml.
#
# `update-packages` also carries `--filter '!./strict-lib/v*/output/lib'`, which
# is the one skip that cannot live in pnpm-workspace.yaml. Those twelve
# package.json are generated by `strict-lib:gen:packages`, which writes their
# `ts-type-forge` range as `^<major>.0.0` on purpose so consumers are not pinned
# to the version the library happened to be generated against. `--latest` would
# write the exact current version into all twelve and the next generation would
# put them back, so the skip is by project rather than by dependency —
# `update.ignoreDeps` names a dependency and would stop `ts-type-forge` moving
# everywhere else too.
#
# `update.ignoreDeps` currently holds back `typescript`, which also covers the
# `typescript-native` alias since pnpm matches the resolved package.
#
# This is a Changesets monorepo, so the workflow also adds a patch changeset
# for each publishable (non-private) workspace package whose runtime
# (dependencies / peerDependencies / optionalDependencies) changed, mirroring
# the classification that dependabot-changeset.yml used, so the Changesets
# release flow publishes those packages once the PR merges.
#
# The action pins move in a separate step, and not through pnpm.
# `update.githubActions` is deliberately `false`, so `update-packages` — which
# carries `--latest` — leaves them alone, and `update-actions` runs
# `tools/scripts/cmd/mature-updates.mts actions` rather than
# `pnpm update --include-github-actions`: pnpm resolves action versions from
# `git ls-remote` refs, which carry no publication date, so neither
# `minimumReleaseAge` nor `ignoreDeps` reaches them and a tag hours old was
# taken regardless. The script reads each action's GitHub Releases, moves a pin
# to the newest release of the same major that is older than
# `minimumReleaseAge`, and resolves the tag to its commit — the same SHA pin
# pnpm wrote. A major stays put until a human takes it, as before:
# `changesets/action` v2 is why. It requires Changesets CLI v3 and renamed every
# input, so the major landing unattended broke release.yml on main.
#
# Because that step rewrites files under .github/workflows/, the App token in
# `commit` has to carry the `workflows` permission, or the push is rejected
# the moment an action pin moves. That is also the reason this workflow is
# split into two jobs: the three rules for a job that holds a key, the split,
# the fixed branch name, the lease and the labels are in README.md under
# "Jobs that hold a key", and this file says only what is its own.

on:
  schedule:
    # Twice a week, Monday and Thursday 06:07 JST (21:07 UTC Sunday and
    # Wednesday). This is a review-cost decision and nothing else: running
    # daily opened a pull request on 24 of the 39 days to 2026-09-20, 32 in
    # all, and reviewing one that often is what #1975 asks to stop.
    #
    # What it costs is freshness, because `minimumReleaseAge` and this period
    # add rather than overlap. The hold decides when a release becomes
    # installable — seven days after it is published — and this decides how
    # long after that the run which takes it comes. Three to four days between
    # runs puts the worst case at eleven days, against eight for a daily run.
    # `workflow_dispatch` is how an update is taken before its turn.
    #
    # Two fixed weekdays rather than `*/3`, which counts days of the month and
    # so leaves a one-day gap across every month boundary. Sunday and Wednesday
    # UTC also keep this off node-support-update.yml's day (Monday 20:17 UTC),
    # so the two do not open a pull request each within the hour.
    - cron: '7 21 * * 0,3'

  workflow_dispatch:

# Neither job writes through `GITHUB_TOKEN` — the branch and the pull request
# go through the App token in `commit` — so `contents: read` is the whole of it.
permissions: {}

jobs:
  # Everything that runs the dependency tree's own code, and nothing that holds
  # a key. What crosses to `commit` is a patch, which it applies rather than
  # executes.
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      base_sha: ${{ steps.patch.outputs.base_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `install: false`: the three steps below change pnpm, the action pins
      # and the release-binary pins before anything is installed, and "Update
      # dependencies" installs once they have.
      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup
        with:
          install: false

      # The latest pnpm, majors included — unlike the action pins, which
      # `update-actions` deliberately keeps within `^current`. The difference
      # is what the pull request this job opens can prove: every job in the
      # check matrix installs with the new pnpm, so a major that breaks the
      # tree fails there rather than on `main`. An action major has no such
      # guarantee — it can sit in a workflow no pull request run exercises,
      # which is how `changesets/action` v2 reached `release.yml`.
      #
      # pnpm 12 is why that can be said at all. It rewrote peer resolution and
      # broke `verify-npm-packages/` (#1845), whose premise is a space where a
      # package may reach only what it declares. That space is now one
      # workspace root per project, each declaring the peer ranges of the
      # package under check — what a consumer has to do anyway, and what keeps
      # the next change of that kind from being invisible.
      #
      # Not a bare `pnpm self-update`: that ignores `minimumReleaseAge` by
      # design, and the pnpm command after it does not, so a release younger
      # than the hold failed this job every run until it matured. The script
      # picks the newest pnpm the hold already accepts and hands it to
      # `self-update`; its header has the whole story. It runs on `node` alone
      # — nothing is installed yet at this point, so `tsx` is not an option.
      - name: Update pnpm itself
        run: node ./tools/scripts/cmd/mature-updates.mts pnpm

      # Before the install, and with `node` rather than `pnpm run` (which
      # would install first): the second rule under "Jobs that hold a key".
      # The script imports `node:*` alone, so Node runs it with no
      # `node_modules` at all; the package.json script stays as the local
      # entry point.
      #
      # `GITHUB_TOKEN` only reads the Releases and Commits APIs here, and lifts
      # the unauthenticated rate limit that the runners' shared IP range
      # otherwise exhausts.
      - name: Update the action pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./tools/scripts/cmd/mature-updates.mts actions

      # The same, for the binaries `check:root:actionlint` downloads
      # (actionlint, shellcheck): a version and one SHA-256 per platform in
      # `tools/configs/release-binaries.json`, the digests read from the
      # Releases API. How far it moves on its own is in the script's header.
      - name: Update the release-binary pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./tools/scripts/cmd/mature-updates.mts release-binaries

      - name: Update dependencies
        run: |
          pnpm run update-packages
          pnpm install --no-frozen-lockfile

      # The published half of `verify-npm-packages` pins exact versions, and
      # this is where they move — a release shows up as a reviewable diff
      # rather than as an unrelated branch starting to fail. `continue-on-error`
      # because the step also runs the checks: a package that is broken on npm
      # should not stop the dependency update, and verify-published-packages.yml
      # reports it on the resulting pull request anyway.
      - name: Refresh the published-package pins
        continue-on-error: true
        run: pnpm run verify:npm-packages:published:update

      # Reading the manifests and writing a changeset needs no key and no
      # network, so it belongs here rather than next to the one that has both.
      # Being its own step is also what lets it be a file with a test rather
      # than a `node` heredoc.
      #
      # `HEAD` is still the pre-update commit: nothing is committed in this
      # job at all.
      - name: Add a changeset if a published package's runtime deps moved
        run: pnpm run update-changeset

      # What crosses to `commit`: the update as a patch, and the commit it
      # applies to. Not the working tree — `git apply` writes files, it does
      # not run anything, and a diff cannot carry a `.git/hooks` entry or a
      # `$GITHUB_PATH` line. `--binary` so a lockfile with any non-text change
      # survives; `git add -A` first so files the update created are in it.
      - name: Bundle the update as a patch
        id: patch
        run: |
          echo "base_sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

          git add -A

          # `--cached`, so this is the whole of what `git add -A` just staged —
          # the same set `git status --porcelain` used to gate on, additions
          # and deletions included.
          if git diff --cached --quiet; then
            echo 'Dependencies already up to date; nothing to do.'
            echo 'changed=false' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          git diff --cached --binary >"${RUNNER_TEMP}/pnpm-update.patch"
          echo 'changed=true' >>"${GITHUB_OUTPUT}"

      - name: Upload the patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-update-patch
          path: ${{ runner.temp }}/pnpm-update.patch
          retention-days: 1

  # The key lives here, and nothing from the dependency tree does: `git` and
  # `gh` are on the runner image, and the patch is applied, never executed —
  # and what it applied is held to the paths a dependency update writes before
  # any of it is committed. See the check in the last step.
  commit:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      # The commit `update` started from, not `main`'s tip: the patch was made
      # against it, and `main` may have moved since. A run that lands behind
      # is not a problem — the pull request carries `merge-queued`, so
      # `unblock-prs` rebases it, and the next run rebuilds the branch from
      # `main` regardless.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.base_sha }}
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pnpm-update-patch
          path: ${{ runner.temp }}

      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          permission-contents: write # ブランチの push
          permission-pull-requests: write # PR の作成と auto-merge の有効化
          # `update-actions` により .github/workflows/ の action ピンも
          # 更新されるため、これが無いと push が
          # 「refusing to allow a GitHub App to create or update workflow ...」で拒否される。
          #
          # これが、この job を分けた一番の理由でもある。この鍵は workflow
          # ファイルを push できるので、依存ツリーのコードと同じ job に置くと
          # 「細工した release.yml を push して、そのブランチで動かす」が届く。
          permission-workflows: write # workflow ファイルを含むコミットの push

      - name: Open the auto-merge pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Reads the Releases API in the release-binary check, and nothing
          # else; the job's own `contents: read` is all it needs.
          RELEASES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Applied, not executed. `git apply` refuses paths outside the work
          # tree unless asked otherwise, and a diff has no way to express a
          # `.git/` entry, so what a patch can carry is content — which is
          # why which content is checked below, before it becomes a commit.
          git apply --binary --whitespace=nowarn "${RUNNER_TEMP}/pnpm-update.patch"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Nothing in this job installs anything, so there is no install
          # script to have left a hook behind — but the patch is still
          # something another job produced, and the cost of being sure is one
          # line.
          git config core.hooksPath /dev/null

          branch="chore/pnpm-update"
          git switch -c "$branch"
          git add -A

          # What a dependency update writes, and nothing else. The patch's
          # contents are decided by `update`, where the dependency tree's own
          # code runs, so the set of paths it carries is checked here, in the
          # job that holds the key — `pnpm install` and
          # `verify:npm-packages:published:update` write manifests, the
          # lockfile and the catalog, `update-changeset` writes one changeset,
          # `update-actions` moves the action pins in the workflows and in
          # the composite actions under `.github/actions/` — the two places
          # `mature-updates.mts` reads; a third has to be named in both, or
          # its pins stop moving without a word — and
          # `update-release-binaries` rewrites
          # `tools/configs/release-binaries.json`. A patch reaching
          # beyond that is not a dependency update whatever it is, and this is
          # the last point before it becomes a commit that auto-merges.
          #
          # This does not replace the split into two jobs; it is what the
          # split leaves to be said. What crosses between them is content, and
          # a manifest is content like any other file — CODEOWNERS covers
          # `.github/workflows/`, `.github/CODEOWNERS` and `repo-settings/`
          # and deliberately no more, because owning the manifests would leave
          # every dependency update waiting for a human.
          #
          # Refused rather than filtered out with `git apply --include=`:
          # a patch carrying anything else is itself worth seeing, and
          # dropping those paths quietly would leave the run looking ordinary.
          # `--no-renames` so a rename is two paths and both are read. An
          # unusual path arrives quoted and matches nothing, which fails in
          # the safe direction; so does anything not named below, including a
          # `verify-npm-packages/published/` smoke program left behind by a
          # `smoke/` edit nothing regenerated — that is a `style-check`
          # failure on main, and it reads here as a patch to look at.
          #
          # The list is inline because a `run:` block is the workflow
          # definition GitHub resolved for the event, which nothing on a
          # runner can rewrite, while a file in the working tree is read when
          # it is invoked. Keep it in step with the steps of `update`: a path
          # a new step legitimately writes fails this job until it is named.
          unexpected="$(git diff --cached --name-only --no-renames \
            | grep -Ev '^(pnpm-lock\.yaml|pnpm-workspace\.yaml)$' \
            | grep -Ev '(^|/)package\.json$' \
            | grep -Ev '^\.changeset/[^/]+\.md$' \
            | grep -Ev '^\.github/workflows/[^/]+\.ya?ml$' \
            | grep -Ev '^\.github/actions/(.+/)?action\.ya?ml$' \
            | grep -Ev '^tools/configs/release-binaries\.json$' || true)"

          if [ -n "$unexpected" ]; then
            echo '::error::The patch carries paths a dependency update does not write, so it is not one; refusing to commit it.'
            printf '%s\n' "$unexpected"
            exit 1
          fi

          # The pin file decides which binary every `check:root` downloads and
          # runs, and `update-release-binaries` changes only its `version` and
          # `sha256` values. A repository, an asset name or a path in the
          # archive changing is not a version moving, so the file is compared
          # with those two values taken out, and anything else refuses it.
          # The two values are spliced into a download URL and a path, so
          # every tool's version and every asset's digest has to be there and
          # look like what it is, too (`\A`/`\z`, since jq's `$` also matches
          # before a trailing newline).
          pins='tools/configs/release-binaries.json'
          if ! git diff --cached --quiet -- "$pins"; then
            before="${RUNNER_TEMP}/release-binaries.before.json"
            git show "HEAD:${pins}" >"$before"
            strip='map_values(del(.version) | .assets |= map_values(del(.sha256)))'
            well_formed='[.[] | (.version | type == "string" and test("\\A[0-9]+\\.[0-9]+\\.[0-9]+\\z")), (.assets[] | .sha256 | type == "string" and test("\\A[0-9a-f]{64}\\z"))] | all'
            if [ "$(jq -S "$strip" "$before")" != "$(jq -S "$strip" "$pins")" ] ||
              [ "$(jq "$well_formed" "$pins")" != 'true' ]; then
              echo "::error::The patch changes ${pins} beyond well-formed versions and digests; refusing to commit it."
              exit 1
            fi

            # Well-formed is not yet what `update-release-binaries` writes.
            # Each tool either stays exactly as it was, or moves forward
            # within its line (`releaseLine` in `mature-updates.mts`: the
            # major, or for a `0.x` version the minor, and a `0.0.x` one never
            # moves) to a published, non-prerelease `v<version>` whose assets
            # the Releases API reports with exactly these digests, the release
            # and every asset older than `minimumReleaseAge`. Everything but
            # the two values equals `HEAD` by now, so the names, repositories
            # and asset names read below are `HEAD`'s, and so is the hold: the
            # patch may carry `pnpm-workspace.yaml` too. The hold is read from
            # the top-level key, where this repository sets it; not finding it
            # there refuses the patch rather than checking against no hold.
            hold_minutes="$(git show HEAD:pnpm-workspace.yaml |
              sed -nE 's/^minimumReleaseAge: *([0-9]+)( +#.*)?$/\1/p' | head -n 1)"
            if [ -z "$hold_minutes" ]; then
              echo "::error::pnpm-workspace.yaml has no top-level minimumReleaseAge whose value is a bare number of minutes to hold the release-binary pins to; refusing to commit them."
              exit 1
            fi
            cutoff="$(($(date +%s) - 10#${hold_minutes} * 60))"
            # shellcheck disable=SC2016 # a jq program; its $ are jq variables
            direction='
              def parts: split(".") | map(tonumber);
              def line: if .[0] != 0 then [.[0]] elif .[1] != 0 then [0, .[1]] else . end;
              $before[0][$name] as $b | .[$name] as $a
              | ($b.version | parts) as $bv | ($a.version | parts) as $av
              | if $a.version == $b.version then (if $a == $b then "same" else "digests changed without the version" end)
                elif $av < $bv then "version moved backwards"
                elif ($av | line) != ($bv | line) then "version left its line"
                else "moved\t\($a.repository)\t\($a.version)" end'
            # shellcheck disable=SC2016 # a jq program; its $ are jq variables
            matches='
              def mature: type == "string" and (try (fromdateiso8601 <= $cutoff) catch false);
              $pins[0][$name] as $pin | (.assets // []) as $release_assets
              | .draft == false and .prerelease == false and (.published_at | mature)
                and ([$pin.assets[]
                  | (.name | split("{version}") | join($pin.version)) as $asset
                  | [$release_assets[] | select(.name == $asset)] as $found
                  | ($found | length) == 1
                    and $found[0].digest == "sha256:" + .sha256
                    and ($found[0].updated_at | mature)
                ] | all)'
            while IFS= read -r name; do
              if ! compared="$(jq -r --arg name "$name" --slurpfile before "$before" "$direction" "$pins")"; then
                echo "::error::${pins}: ${name}: could not be compared with HEAD (above); refusing to commit it."
                exit 1
              fi
              IFS=$'\t' read -r verdict repository version <<<"$compared"
              if [ "$verdict" = 'same' ]; then
                continue
              fi
              if [ "$verdict" != 'moved' ]; then
                echo "::error::${pins}: ${name}: ${verdict}; refusing to commit it."
                exit 1
              fi
              if ! release="$(GH_TOKEN="$RELEASES_TOKEN" gh api "repos/${repository}/releases/tags/v${version}")"; then
                echo "::error::${pins}: ${name}: could not read the release v${version} of ${repository} from the Releases API (above); refusing to commit unverified digests."
                exit 1
              fi
              if ! verified="$(jq --arg name "$name" --slurpfile pins "$pins" --argjson cutoff "$cutoff" \
                "$matches" <<<"$release")"; then
                echo "::error::${pins}: ${name}: could not read the Releases API's answer for v${version} of ${repository} (above); refusing to commit unverified digests."
                exit 1
              fi
              if [ "$verified" != 'true' ]; then
                echo "::error::${pins}: ${name}: v${version} of ${repository} is not a published, non-prerelease release older than minimumReleaseAge whose assets have these digests; refusing to commit it."
                exit 1
              fi
            done < <(jq -r 'keys[]' "$before")
          fi

          git commit -m "chore: update dependencies"

          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          remote_ref="$(git ls-remote "$remote_url" "refs/heads/${branch}")"
          expected="$(printf '%s' "$remote_ref" | cut -f1)"

          git push --force-with-lease="refs/heads/${branch}:${expected}" \
            "$remote_url" \
            "HEAD:refs/heads/${branch}"

          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null)" != 'OPEN' ]; then
            # `merge-queued` is what `unblock-prs` reads: without it nothing
            # rebases this branch when main moves under it. It is opened
            # queued because nobody reviews it — auto-merge below is the same
            # statement, made by the same bot in the same breath.
            gh pr create \
              --base main \
              --head "$branch" \
              --label merge-queued \
              --title "chore: update dependencies" \
              --body "Automated dependency update via \`pnpm run update-packages\` + \`pnpm run update-actions\` + \`pnpm run update-release-binaries\` + \`pnpm self-update\`. The latter three go through \`tools/scripts/cmd/mature-updates.mts\`, which holds pnpm itself, the action pins and the release-binary pins (actionlint, shellcheck) to \`minimumReleaseAge\` the way pnpm holds npm dependencies. Action pins move within their major only, and release-binary pins within their major or, for a \`0.x\` version, their minor, so the next one waits for a human. A patch changeset is added for publishable packages whose runtime dependencies changed. Rebuilt from main on every run, so force-pushes to this branch are expected. Auto-merges once CI passes."
          fi
          gh pr merge --auto --squash "$branch"
