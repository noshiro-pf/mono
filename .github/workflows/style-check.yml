name: Style Check

# The check workflow shape — triggers, concurrency, `permissions: {}`, the
# gate, the aggregate — is in README.md. What is particular to this one: the
# `style` ignore list, and a matrix of formatters and generators whose check
# is that the tree is clean afterwards.

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.event_name == 'push', github.sha, github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    uses: ./.github/workflows/check-gates.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      # `style`, a much narrower ignore list than `code`: `experimental/` and
      # nothing else — see "The ignore lists" in README.md.
      diff-scope: style
      result-job: style-check-result / result

  style-check:
    needs: gates
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-ci')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false' &&
      needs.gates.outputs.reused_result == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 25, matching code-check.yml: `ws:doc`, the longest entry, was measured at
    # 9m31s and 9m44s under a 10-minute cap — see "The work" in README.md.
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        command:
          - fix:fmt:full
          # oxfmt owns `strict-lib/`; Prettier ignores it. The repository-clean
          # step after this one is what makes the check an idempotence check.
          - strict-lib:fix:fmt
          - check:md
          - check:cspell
          # The checks whose inputs are documents: halfwidth parentheses
          # around Japanese text, the shape of `.markdownlint-cli2.mjs`, and
          # the READMEs whose code fences no sample backs. They are here and
          # not in `check:root` because `check:root` is a `code-check.yml`
          # entry, whose ignore list drops `**.md` and `.markdownlint-cli2.mjs`
          # — so a diff touching only those would skip the very checks that
          # read them. None of the three needs `dist/`.
          - check:prose
          - ws:doc
          - ws:check:ext
          # `docs/package-dependencies.md` is generated from every
          # `package.json`, so it goes stale whenever one changes and whenever a
          # rebase drops a row from it. Regenerating it here and letting the
          # repository-clean step below compare is the only thing that notices.
          - gen:deps-graph
          # Every LICENSE file is a copy of the root one, written from it here
          # and compared by the repository-clean step below — so a tool that
          # reformats one, or a hand that mistypes one, is a failure rather
          # than a package that ships a license nobody read. The generator
          # also refuses to run at all unless the root file still hashes to
          # the canonical Apache-2.0 text, which is the only way a typo in the
          # source gets caught rather than propagated. Its `--verify-upstream`
          # is deliberately not here: it fetches apache.org, and a check that
          # fetches is a check that fails when the fetch does.
          - gen:license-files
          # Every committed generated source: the `index.mts` barrels, the
          # ESLint rule types, ts-data-forge's branded numbers, ts-type-forge's
          # `global.mts` / `entry-point.mts`, the synstate re-export shims, the
          # samples embedded into READMEs and `@example` blocks. Each package's
          # `gen` names its own generators in order, and the repository-clean
          # step below is what notices when one has gone stale.
          #
          # `build` used to regenerate all of it on every run, which put three
          # of the five minutes a full build took into every job that builds.
          - ws:gen

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      # ws:doc and ws:gen load each package's sources, which import workspace
      # siblings and resolve through their `exports` map to dist/. Nothing is
      # built yet on a clean checkout, so these two need the packages emitted
      # first. The other matrix entries do not touch dist/, so they skip the
      # build — which is why this workflow has no `build` job the way
      # code-check.yml does.
      #
      # `ws:check:ext` used to be on this list and is not: `check-ext.mts`
      # globs file names under `src/` and `scripts/` and resolves nothing, so
      # the build it was paying for did nothing for it.
      - name: Build all packages
        if: matrix.command == 'ws:doc' || matrix.command == 'ws:gen'
        run: pnpm run ws:build

      - name: Run "${{ matrix.command }}"
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        run: pnpm run z:assert-repo-is-clean

  # The one required status check for this workflow, reported as
  # `style-check-result / result` — see "The aggregate job" in README.md.
  style-check-result:
    needs:
      - gates
      - style-check
    if: always()
    uses: ./.github/workflows/check-result.yml
    with:
      needs: ${{ toJSON(needs) }}
