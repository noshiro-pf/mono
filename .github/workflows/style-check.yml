name: Style Check

# The check workflow shape — triggers, concurrency, `permissions: {}`, the
# gate, the aggregate — is in README.md. What is particular to this one: the
# `style` ignore list, and a matrix of formatters and generators whose check
# is that the tree is clean afterwards.

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  workflow_dispatch:
    # See "Triggers" in README.md: a queue judges each layer it stacks on its
    # own commit, against the layer below.
    inputs:
      diff-parent:
        description: Diff the commit against its parent, as a queue layer is judged.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.event_name == 'push', github.sha, github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    uses: ./.github/workflows/check-gates.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      # `style`, a much narrower ignore list than `code`: `experimental/` and
      # nothing else — see "The ignore lists" in README.md.
      diff-scope: style
      result-job: style-check-result / result

  style-check:
    needs: gates
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-ci')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false' &&
      needs.gates.outputs.reused_result == ''
    # The command alone, as the check is named, so that `build` does not join
    # the context name unblock-prs reads (`.github/unblock-prs.json`).
    name: style-check (${{ matrix.command }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 15, matching code-check.yml; see "The work" in README.md.
    timeout-minutes: 15

    # The commit the `check:prose` guards that read a change compare the tree
    # with (`tools/scripts/lib/diff-base.mts`): `next-major` reads each
    # package's version there, as a version pull request is the one tree that
    # raises a version past its base, and `markdown-wrap` reads only the
    # paragraphs the change touched. On `main` it is the commit before the
    # push; a queue layer (`diff-parent`) compares with its parent, and any
    # other manual run compares the tree with itself.
    env:
      PROSE_DIFF_BASE: ${{ case(github.event_name == 'pull_request', github.event.pull_request.base.sha, github.event_name == 'push', github.event.before, inputs.diff-parent, 'HEAD^', github.sha) }}

    strategy:
      fail-fast: false
      matrix:
        # Two entries of about six minutes each, so that one pull request's
        # jobs across the check workflows stay at seventeen of the account's
        # twenty concurrent runners (see the matrix of code-check.yml), each
        # a `run-s --continue-on-error` bundle, so every part of it reports
        # even when an earlier one fails. As ten entries, most of these were a
        # minute of setup for seconds of work.
        #
        # `z:ci:style-check:checks-and-generators` builds the packages the
        # others link to and runs, in this order, the checks, on the tree as
        # committed, as each ran in its own job (`check:prose` diffs it
        # against the base, and a formatter's rewrite would read as lines the
        # change touched), then the generators, each compared against the
        # tree as committed:
        #
        # - `check:prose`: the checks whose inputs are documents. They are here
        #   and not in `check:root` because `check:root` is a
        #   `code-check.yml` entry, whose ignore list drops `**.md` and
        #   `.markdownlint-cli2.mjs` — so a diff touching only those would
        #   skip the very checks that read them. None needs `dist/`.
        # - `check:md`, which also applies the fixes markdownlint can make
        #   (`.markdownlint-cli2.mjs` sets `fix: true`), `check:cspell` and
        #   `ws:check:ext`.
        # - `strict-lib:fix:fmt`: oxfmt owns `strict-lib/`; Prettier ignores
        #   it.
        # - `gen:deps-graph`: `docs/package-dependencies.md` is generated from
        #   every `package.json`, so it goes stale whenever one changes and
        #   whenever a rebase drops a row from it.
        # - `gen:license-files`: every LICENSE file is a copy of the root one,
        #   written from it here, so a tool that reformats one, or a hand that
        #   mistypes one, is a failure rather than a package that ships a
        #   license nobody read. The generator also refuses to run at all
        #   unless the root file still hashes to the canonical Apache-2.0
        #   text, which is the only way a typo in the source gets caught
        #   rather than propagated. Its `--verify-upstream` is deliberately
        #   not here: it fetches apache.org, and a check that fetches is a
        #   check that fails when the fetch does.
        # - `ws:gen`, every committed generated source: the `index.mts`
        #   barrels, the ESLint rule types, ts-data-forge's branded numbers,
        #   ts-type-forge's `global.mts` / `entry-point.mts`, the synstate
        #   re-export shims, the samples embedded into READMEs and `@example`
        #   blocks. Each package's `gen` names its own generators in order.
        #   `build` used to regenerate all of it on every run, which put three
        #   of the five minutes a full build took into every job that builds.
        #   `ws:gen` and `ws:doc` run the packages concurrently, in dependency
        #   order, unlike the `ws:check:test*` scripts: most of each package's
        #   share is starting `tsx` and Prettier, a single thread apiece, where
        #   a package's test runner already fills every core by itself.
        #
        # `z:ci:style-check:format-and-doc` builds every package and runs
        # `fix:fmt:full`, Prettier over the repository, then `ws:doc`, which
        # reads each package's own `dist/`. Prettier is apart from the
        # generators, so it cannot tidy a stale generated file back into
        # place before the generator's output is compared.
        #
        # `z:ci-job`'s clean-tree check is what turns the formatters and
        # generators into checks. It names the entry that wrote, which is a
        # whole bundle, so the paths it lists say which part wrote: in
        # the first entry, `strict-lib/` is oxfmt's,
        # `docs/package-dependencies.md` the dependency graph's, a `LICENSE`
        # the license copier's, a Markdown file markdownlint's, anything else
        # (`index.mts`, rule types, an embedded sample) `ws:gen`'s; in the
        # second, a package's documentation is `ws:doc`'s and anything else
        # Prettier's.
        #
        # Each entry builds what it reads. ws:doc and ws:gen load each
        # package's sources, which import workspace siblings and resolve
        # through their `exports` map to dist/, which a clean checkout does
        # not have. ws:gen reads no package's own dist/, only its siblings', so
        # its bundle builds just the packages another member links to
        # (`ws:build:deps`); ws:doc also reads each package's own dist/, so its
        # bundle builds everything. The rest of a bundle does not read dist/,
        # and a build writes only untracked output, so it runs on the tree as
        # committed all the same. `ws:check:ext` globs file names and resolves
        # nothing, so it needs no build.
        include:
          - command: z:ci:style-check:checks-and-generators
            build: ws:build:deps
          - command: z:ci:style-check:format-and-doc
            build: ws:build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      # The checkout is one commit deep; `git show` and `git diff` need the
      # base as well.
      - name: Fetch the base the `check:prose` guards compare with
        if: matrix.command == 'z:ci:style-check:checks-and-generators'
        run: |
          if [ "${PROSE_DIFF_BASE}" = 'HEAD^' ]; then
            git fetch --no-tags --depth=2 origin "${GITHUB_SHA}"
          else
            git fetch --no-tags --depth=1 origin "${PROSE_DIFF_BASE}"
          fi

      # The build, the command and the clean-tree check, as `check-all` runs
      # them too: a step that changed the tree fails the job and is named
      # ("The work" in README.md).
      - name: Run "${{ matrix.command }}" after "${{ matrix.build }}"
        id: command
        run: pnpm run z:ci-job --build ${{ matrix.build }} --command ${{ matrix.command }}

      # Says in the job summary which of this entry's commands check-changed
      # would have run for the diff ("When a check fails" in README.md). It
      # reports; the job has failed already. Not after a failed setup, nor
      # after a failed build (`z:ci-job` says so in `build-failed`), when the
      # command never ran. Last, and capped, so that it cannot
      # spend the job's time limit before the steps above.
      - name: Say which of "${{ matrix.command }}"'s commands check-changed would have run
        if: >-
          failure() && github.event_name == 'pull_request' &&
          steps.command.outcome == 'failure' &&
          steps.command.outputs.build-failed != 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GAP_BASE: ${{ github.event.pull_request.base.sha }}
          GAP_JOB: ${{ matrix.command }}
        run: |
          git fetch --no-tags --depth=1 origin "${GAP_BASE}"
          pnpm run --silent z:check-changed-gap --job "${GAP_JOB}" --base "${GAP_BASE}" >> "${GITHUB_STEP_SUMMARY}"

  # The one required status check for this workflow, reported as
  # `style-check-result / result` — see "The aggregate job" in README.md.
  style-check-result:
    needs:
      - gates
      - style-check
    # Not on a label event while `skip-ci` is on, so that putting the label on
    # supersedes no verdict — "A label event under `skip-ci`" in README.md.
    if: >-
      always() &&
      !((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    uses: ./.github/workflows/check-result.yml
    with:
      needs: ${{ toJSON(needs) }}
