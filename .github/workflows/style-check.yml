name: Style Check

on:
  # No `push`, not even for `main`. The `main` ruleset accepts changes through
  # pull requests only and requires the branch to be up to date, so the squash
  # commit a merge makes has the same tree as the pull request's head — a tree
  # this workflow has already checked. See the note in type-check.yml, which
  # keeps one job on `push` for a reason of its own.

  # `synchronize` fires on every push to the pull request's branch, so these
  # types cover the pull request's whole life — a draft included. `labeled` /
  # `unlabeled` are what let a `[WIP]` label stop and restart the checks; see
  # the note in type-check.yml.
  #
  # No `paths` filter here. Every job in this matrix is a required status
  # check, and a workflow that a path filter skips never reports one — so a
  # pull request changing only the filtered files would wait on checks that
  # never arrive. Paths that do not concern this workflow are skipped a step
  # at a time by the `Check diff` gate below, the same way type-check.yml
  # does it.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# One run per pull request; a push cancels the run still going for the
# previous one. `cancel-in-progress` is an expression rather than `true` so
# that a `workflow_dispatch` run is left alone — see the note in
# type-check.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the branch is behind `main`, whether the diff touches anything
  # this workflow reads, and whether `[WIP]` is on the pull request — see the
  # notes in type-check.yml and check-gates.yml.
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, '[WIP]')
    uses: ./.github/workflows/check-gates.yml
    with:
      # `style`, a much narrower ignore list than `code`: `experimental/` and
      # nothing else. Every entry in this matrix can be affected by a change
      # the code list ignores — three of them check markdown, `ws:doc`
      # regenerates the package READMEs, and `ws:check:ext` globs *every* file
      # under the directories it is given — so `code` would skip this workflow
      # exactly when it should fail. See "CI diff gates" in CLAUDE.md.
      diff-scope: style

  style-check:
    needs: gates
    # Skip the whole job while the pull request carries the `[WIP]` label,
    # while its branch is behind `main` and cannot be merged as it stands, or
    # when the diff touches nothing any command below reads — see the notes in
    # type-check.yml. Being a draft no longer skips anything.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    # 25, matching type-check.yml, whose matrix builds the repository the same
    # way this one does. It was 10, and `ws:doc` — the longest entry, because
    # it regenerates every package README on top of that build — was measured
    # at 9m31s and 9m44s across branches, under thirty seconds of headroom. A
    # `pnpm/action-setup` step that took three minutes instead of its usual
    # few seconds was enough to spend it: the build finished and the runner
    # cancelled the job in the same second, before `ws:doc` ran at all. What
    # the cap is for is a command that hangs, not a slow runner, and every
    # entry here has finished well inside 10 minutes of its own.
    timeout-minutes: 25

    strategy:
      # The matrix entries are independent checks. Letting one cancel the
      # others hides their results, and the aggregate below reports the
      # cancelled ones as a failure, so the pull request is blocked on an
      # unrelated failure with nothing to read.
      fail-fast: false
      matrix:
        command:
          - fmt:full
          # oxfmt owns `strict-lib/`; Prettier ignores it. The repository-clean
          # step after this one is what makes the check an idempotence check.
          - strict-lib:fmt
          - md
          - cspell
          - ws:doc
          - ws:check:ext
          # `docs/package-dependencies.md` is generated from every
          # `package.json`, so it goes stale whenever one changes and whenever a
          # rebase drops a row from it. Regenerating it here and letting the
          # repository-clean step below compare is the only thing that notices.
          - docs:deps
          # The generated `index.mts` barrels. Nothing else notices when one
          # goes stale — or when `gi` overwrites a hand-written index file,
          # which is what `--preserve` in each package's `gi:src` now stops.
          - ws:gi

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event: these checks assert properties of the branch
          # itself, and the merge ref does not even exist while the pull
          # request has a conflict. On a `workflow_dispatch` run this falls
          # back to the dispatched commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ws:doc and ws:check:ext load each package's sources, which import
      # workspace siblings and resolve through their `exports` map to dist/.
      # Nothing is built yet on a clean checkout, so these two need the
      # packages emitted first. The other matrix entries do not touch dist/,
      # so they skip the build.
      - name: Build all packages
        if: matrix.command == 'ws:doc' || matrix.command == 'ws:check:ext'
        run: pnpm run ws:build

      - name: Run "${{ matrix.command }}"
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        run: pnpm run z:assert-repo-is-clean

  # The one required status check for this workflow: it reports whatever
  # happened above, so that a skipped run cannot read as a passing one. The
  # two clauses after `always()` are the skips that are not failures — a
  # `[WIP]` label, held by `no-wip-label`, and a branch behind the base
  # branch, held by the ruleset — for which this job reports `skipped` rather
  # than red. See the note on `type-check-result` in type-check.yml.
  style-check-result:
    needs:
      - gates
      - style-check
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the checks above to have passed
        env:
          RESULT: ${{ needs.style-check.result }}
        run: |
          if [ "${RESULT}" = 'success' ]; then
            echo 'The checks passed.'
            exit 0
          fi

          summary="The checks did not pass on this commit (result: ${RESULT})."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1
