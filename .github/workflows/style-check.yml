name: Style Check

on:
  # Only main — pull request branches are covered by the `pull_request` events
  # below; see the note in type-check.yml.
  push:
    branches:
      - main

  # `synchronize` fires on every push to the pull request's branch, so these
  # types cover the pull request's whole life — a draft included. `labeled` /
  # `unlabeled` are what let a `[WIP]` label stop and restart the checks; see
  # the note in type-check.yml.
  #
  # No `paths` filter here. Every job in this matrix is a required status
  # check, and a workflow that a path filter skips never reports one — so a
  # pull request changing only the filtered files would wait on checks that
  # never arrive. Paths that do not concern this workflow are skipped a step
  # at a time by the `Check diff` gate below, the same way type-check.yml
  # does it.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# One run per pull request; a push cancels the run still going for the
# previous one. `cancel-in-progress` is an expression rather than `true` so
# that pushes to `main` run to completion — see the note in type-check.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the branch is behind `main`, and whether `[WIP]` is on the pull
  # request — see the notes in type-check.yml.
  branch-up-to-date:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, '[WIP]')
    uses: ./.github/workflows/branch-up-to-date.yml

  style-check:
    needs: branch-up-to-date
    # Skip the whole job while the pull request carries the `[WIP]` label, or
    # while its branch is behind `main` and cannot be merged as it stands —
    # see the notes in type-check.yml. Being a draft no longer skips
    # anything.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.branch-up-to-date.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # The matrix entries are independent checks. Letting one cancel the
      # others hides their results and, since most of them are required
      # status checks, blocks the pull request on an unrelated failure.
      fail-fast: false
      matrix:
        command:
          - fmt:full
          # oxfmt owns `strict-lib/`; Prettier ignores it. The repository-clean
          # step after this one is what makes the check an idempotence check.
          - strict-lib:fmt
          - md
          - cspell
          - ws:doc
          - ws:check:ext
          # `docs/package-dependencies.md` is generated from every
          # `package.json`, so it goes stale whenever one changes and whenever a
          # rebase drops a row from it. Regenerating it here and letting the
          # repository-clean step below compare is the only thing that notices.
          - docs:deps
          # The generated `index.mts` barrels. Nothing else notices when one
          # goes stale — or when `gi` overwrites a hand-written index file,
          # which is what `--preserve` in each package's `gi:src` now stops.
          - ws:gi

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event: these checks assert properties of the branch
          # itself, and the merge ref does not even exist while the pull
          # request has a conflict. On a push event this falls back to the
          # pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch main
        run: git fetch origin main

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: To include this workflow in the branch protection rule status
      # check, skip each step instead of skipping the entire workflow with
      # paths-ignore.
      - name: Check diff
        id: check_diff_style
        # A much narrower list than type-check.yml's: `experimental/` and
        # nothing else. Every entry in this matrix can be affected by a
        # change the code-check gate ignores — three of them check markdown,
        # `ws:doc` regenerates the package READMEs, and `ws:check:ext` globs
        # *every* file under the directories it is given (`.md` is accepted
        # under `libs/ts-data-forge/scripts` and a failure under any `src`) —
        # so that gate would skip this exactly when it should fail.
        # `experimental/` is different in kind: it is excluded from
        # Prettier's, cspell's and markdownlint's globs and is outside the
        # pnpm workspace, so no command here reads a byte of it.
        #
        # On a push to main, diffing against origin/main is a diff against
        # HEAD itself, which comes back empty and reads as "nothing relevant
        # changed" — so every step below would skip and the job would still
        # report success. Compare with what main pointed at before the push
        # instead.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run z:check-should-run:style-checks
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run z:check-should-run:style-checks --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi

      # `run: exit 0` ends the step, not the job — every step below has to
      # carry the condition itself, as type-check.yml's do.
      #
      # ws:doc and ws:check:ext load each package's sources, which import
      # workspace siblings and resolve through their `exports` map to dist/.
      # Nothing is built yet on a clean checkout, so these two need the
      # packages emitted first. The other matrix entries do not touch dist/,
      # so they skip the build.
      - name: Build all packages
        if: steps.check_diff_style.outputs.should_run == 'true' && (matrix.command == 'ws:doc' || matrix.command == 'ws:check:ext')
        run: pnpm run ws:build

      - name: Run "${{ matrix.command }}"
        if: steps.check_diff_style.outputs.should_run == 'true'
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        if: steps.check_diff_style.outputs.should_run == 'true'
        run: pnpm run z:assert-repo-is-clean

  # The one required status check for this workflow: it reports whatever
  # happened above, so that a skipped run cannot read as a passing one. See
  # the note on `type-check-result` in type-check.yml.
  style-check-result:
    needs:
      - branch-up-to-date
      - style-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the checks above to have passed
        env:
          SHOULD_RUN: ${{ needs.branch-up-to-date.outputs.should_run }}
          RESULT: ${{ needs.style-check.result }}
        run: |
          if [ "${SHOULD_RUN}" = 'false' ]; then
            echo 'The branch is behind the base branch, so the checks were skipped. They run again once it is updated.'
            exit 0
          fi

          if [ "${RESULT}" = 'success' ]; then
            echo 'The checks passed.'
            exit 0
          fi

          summary="The checks did not pass on this commit (result: ${RESULT}). A \`[WIP]\` label skips them; take the label off to run them."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1
