name: Style Check

on:
  push:
    branches-ignore:
      - 'develop'
      - 'develop*'
    paths-ignore:
      - '**.png'
      - '**.jpg'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  style-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # The matrix entries are independent checks. Letting one cancel the
      # others hides their results and, since most of them are required
      # status checks, blocks the pull request on an unrelated failure.
      fail-fast: false
      matrix:
        command:
          - fmt:full
          - md
          - cspell
          - ws:doc
          - ws:check:ext
          - knip
          - lint:published-deps

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch main
        run: git fetch origin main

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ws:doc and ws:check:ext load each package's sources, and knip executes
      # each vitest config; all of them import workspace siblings, which
      # resolve through their `exports` map to dist/. Nothing is built yet on a
      # clean checkout, so these need the packages emitted first. The other
      # matrix entries do not touch dist/, so they skip the build.
      - name: Build all packages
        if: matrix.command == 'ws:doc' || matrix.command == 'ws:check:ext' || matrix.command == 'knip'
        run: pnpm run ws:build

      - name: Run "${{ matrix.command }}"
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        run: pnpm run z:assert-repo-is-clean
