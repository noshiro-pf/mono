name: Style Check

on:
  push:
    branches-ignore:
      # `archive/**` holds frozen snapshots of retired work. They are never
      # merged back, so every check on them is wasted CI.
      - 'archive/**'
    # No `paths-ignore` here. Every job in this matrix is a required status
    # check, and a workflow that a path filter skips never reports one — so a
    # pull request changing only the filtered files waits on checks that will
    # never arrive. Paths that do not concern this workflow are skipped a step
    # at a time by the `Check diff` gate below, the same way type-check.yml
    # does it.

  # `Check for a draft pull request` below skips the work while the pull
  # request is a draft, and the job still reports — so without this trigger the
  # required checks would sit green on a branch nothing has checked, and
  # marking the pull request ready for review, which is not a push, would not
  # re-run them. This is what runs them for real.
  pull_request:
    types:
      - ready_for_review

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  style-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # The matrix entries are independent checks. Letting one cancel the
      # others hides their results and, since most of them are required
      # status checks, blocks the pull request on an unrelated failure.
      fail-fast: false
      matrix:
        command:
          - fmt:full
          - md
          - cspell
          - ws:doc
          - ws:check:ext

    steps:
      # A draft pull request is work in progress, so everything below is
      # skipped until it is marked ready for review. A `push` event carries no
      # pull request context — the branch is all it knows — so ask the API
      # whether the open pull request for that branch is a draft.
      #
      # This runs first, before the checkout: every other step hangs off it, so
      # a push to a draft costs one API call rather than an install and a
      # build. The job itself still runs and still reports, for the same reason
      # nothing here uses `paths-ignore` — these are required status checks,
      # and a job that never reports leaves the pull request waiting on a check
      # that will never arrive.
      - name: Check for a draft pull request
        id: check_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # `workflow_dispatch` is someone asking for the checks explicitly,
          # and `pull_request` only fires here on `ready_for_review`, which is
          # the moment the draft stopped being one.
          if [ "${EVENT_NAME}" != 'push' ] || [ "${GITHUB_REF_NAME}" = 'main' ]; then
            exit 0
          fi

          # Every open pull request whose head is this branch has to be a
          # draft. `none` — no pull request yet — runs the checks: the branch
          # may never get one, and nothing would re-run them if it did, since
          # opening a pull request is not a push.
          jq_filter='if length == 0 then "none" elif all(.[]; .isDraft) then "true" else "false" end'

          # Fail open. A pull request that cannot be read is not a draft as far
          # as this gate is concerned; running the checks anyway is the
          # harmless half of being wrong.
          if ! is_draft="$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --head "${GITHUB_REF_NAME}" --state open --json isDraft \
            --jq "${jq_filter}")"; then
            echo 'Could not read the pull requests for this branch; running the checks.'
            exit 0
          fi

          if [ "${is_draft}" = 'true' ]; then
            echo 'is_draft=true' >>"${GITHUB_OUTPUT}"
            echo 'This branch has a draft pull request; skipping. Mark it ready for review to run the checks.'
          fi

      - name: Checkout
        if: steps.check_draft.outputs.is_draft != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event, so a `ready_for_review` run checks exactly
          # what a push to this branch would have.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch main
        if: steps.check_draft.outputs.is_draft != 'true'
        run: git fetch origin main

      - name: Install pnpm
        if: steps.check_draft.outputs.is_draft != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        if: steps.check_draft.outputs.is_draft != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check_draft.outputs.is_draft != 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: To include this workflow in the branch protection rule status
      # check, skip each step instead of skipping the entire workflow with
      # paths-ignore.
      - name: Check diff
        id: check_diff_style
        if: steps.check_draft.outputs.is_draft != 'true'
        # A much narrower list than type-check.yml's: `experimental/` and
        # nothing else. Every entry in this matrix can be affected by a
        # change the code-check gate ignores — three of them check markdown,
        # `ws:doc` regenerates the package READMEs, and `ws:check:ext` globs
        # *every* file under the directories it is given (`.md` is accepted
        # under `libs/ts-data-forge/scripts` and a failure under any `src`) —
        # so that gate would skip this exactly when it should fail.
        # `experimental/` is different in kind: it is excluded from
        # Prettier's, cspell's and markdownlint's globs and is outside the
        # pnpm workspace, so no command here reads a byte of it.
        #
        # On a push to main, diffing against origin/main is a diff against
        # HEAD itself, which comes back empty and reads as "nothing relevant
        # changed" — so every step below would skip and the job would still
        # report success. Compare with what main pointed at before the push
        # instead.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run z:check-should-run:style-checks
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run z:check-should-run:style-checks --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi

      # `run: exit 0` ends the step, not the job — every step below has to
      # carry the condition itself, as type-check.yml's do.
      #
      # ws:doc and ws:check:ext load each package's sources, which import
      # workspace siblings and resolve through their `exports` map to dist/.
      # Nothing is built yet on a clean checkout, so these two need the
      # packages emitted first. The other matrix entries do not touch dist/,
      # so they skip the build.
      - name: Build all packages
        if: steps.check_diff_style.outputs.should_run == 'true' && (matrix.command == 'ws:doc' || matrix.command == 'ws:check:ext')
        run: pnpm run ws:build

      - name: Run "${{ matrix.command }}"
        if: steps.check_diff_style.outputs.should_run == 'true'
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        if: steps.check_diff_style.outputs.should_run == 'true'
        run: pnpm run z:assert-repo-is-clean
