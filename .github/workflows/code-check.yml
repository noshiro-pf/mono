# cspell:ignore vitest

name: Code Check

# The check workflow shape — triggers, concurrency, `permissions: {}`, the
# gate, the aggregate — is in README.md. What is particular to this one: a
# `build` job that serves `dist/` to the matrix, and a `coverage-main` job
# that uploads coverage on a push to `main` when the matrix does not run.

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.event_name == 'push', github.sha, github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    uses: ./.github/workflows/check-gates.yml
    permissions:
      actions: read
      contents: read
    with:
      diff-scope: code
      result-job: code-check-result / result
      # `coverage-main` runs on a reused verdict and skips on an irrelevant
      # diff, so on a push the diff question is asked either way.
      diff-when-reused: ${{ github.event_name == 'push' }}

  # `ws:build` once, for every entry of the matrix below to unpack — see "The
  # `dist/` artifact" in README.md.
  #
  # Each of those entries needs `dist/`: a package's `build` only type-checks
  # what it publishes, so tests, scripts, configs and lint configs all reach
  # their workspace siblings through the `exports` map, which resolves there.
  # Each entry used to run the build for itself — fourteen runs of the same
  # 34-second command producing the same 27 directories, about eight
  # runner-minutes a pull request. What that trades is wall clock: the matrix
  # waits on one build and this job costs its own checkout and install, so the
  # critical path grows by roughly a minute while the runner time falls by
  # six. Splitting the matrix to spare the entries that do not read `dist/`
  # would be two matrices to keep in step, which is a worse trade than the
  # wait.
  build:
    needs: gates
    # This is where the gate lives: the matrix below waits on this job, so
    # everything that skips the checks skips them by skipping this. The
    # clauses are the caller shape from README.md.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-ci')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false' &&
      needs.gates.outputs.reused_result == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The artifact has to be the build of the commit the matrix checks.
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Build all packages
        run: pnpm run ws:build

      - name: Pack the build output
        run: |
          set -euo pipefail
          find libs apps tools languages -maxdepth 3 -type d -name dist \
            -not -path '*/node_modules/*' -print0 |
            tar --null --files-from - -czf "${RUNNER_TEMP}/dist.tar.gz"
          ls -lh "${RUNNER_TEMP}/dist.tar.gz"

      - name: Upload the build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist.tar.gz
          retention-days: 1

  code-check:
    needs:
      - gates
      - build
    # The gate is `build`'s, above, and asking whether that job succeeded asks
    # all of it at once. Every state that skips the checks skips `build`, and a
    # job that did not build is a job this matrix has nothing to download from.
    # Restating the six clauses here would be two conditions that have to stay
    # identical, with nothing to report the day they stop being.
    #
    # `!cancelled()` still earns its place. Without it this job would be
    # skipped whenever *any* job it needs did not succeed — including `gates`,
    # which is meant to fail open. `build` carries its own `!cancelled()`, so a
    # gate that failed to answer still builds; this clause is what lets the
    # matrix follow it.
    if: >-
      !cancelled() &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        command:
          - check:root
          # `strict-lib/` is a directory, not a workspace member, so the `ws:*`
          # entries never reach its generator or scripts.
          - strict-lib:check:types
          - strict-lib:check:lint
          - ws:check:types
          # What the build emitted, type-checked by package name through the
          # `exports` map — the way a consumer reaches it. Part of `build`
          # until it was moved out, so that the twelve other entries here,
          # which only need `dist/`, stop paying for it.
          - ws:check:dist
          - ws:fix:lint
          # The Sumi lint check of the dogfood packages (`check:sumi` scripts).
          - ws:check:sumi
          - ws:check:test:browser
          - ws:check:test:cov
          - ws:check:e2e
          - fix:codemod:full
          - check:knip
          - check:published-deps
          - verify:npm-packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      # `ws:check:test:cov` needs a browser too: the synstate adapters' hooks only
      # run in one, so their coverage would otherwise be reported as zero.
      # `ws:check:e2e` drives one, which is the whole point of it.
      - name: Install Playwright Browsers
        if: matrix.command == 'ws:check:test:browser' || matrix.command == 'ws:check:test:cov' || matrix.command == 'ws:check:e2e'
        run: pnpm exec playwright install chromium

      - name: Download the build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: ${{ runner.temp }}

      - name: Unpack the build output
        run: tar -xzf "${RUNNER_TEMP}/dist.tar.gz"

      # The browser tests used to be wrapped in a two-attempt retry, because
      # one file at a time would fail to load. The cause was Vite optimizing a
      # dependency mid-run and reloading the page; naming those dependencies in
      # each package's `optimizeDepsInclude` removed it, so a failure here is
      # now a failure rather than something to try again.
      - name: Run "${{ matrix.command }}"
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        run: pnpm run z:assert-repo-is-clean

      - name: Upload coverage reports to Codecov
        if: matrix.command == 'ws:check:test:cov'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0

  # What a push to main runs when the matrix above reused a verdict: its
  # `ws:check:test:cov` entry and nothing else, so that Codecov has a report
  # on the base commit to compare a pull request's against. The upload is the
  # point of this job, so a verdict cannot stand in for it. When the matrix
  # does run on a push — no verdict matched, or the gate failed to answer —
  # its own `ws:check:test:cov` entry uploads, and this job stays out of it.
  #
  # A job of its own rather than a step condition inside the matrix job,
  # because a matrix entry that boots a runner and skips every step still
  # reports a green check run named after a command that did not run. The
  # steps are the matrix job's, repeated, less the `dist/` artifact; keep the
  # two in step.
  #
  # Gated on the diff exactly as the matrix is — `gates` compares against
  # `github.event.before` on main, and answers that even for a reused verdict
  # (`diff-when-reused`) — so a merge that touched nothing the tests read
  # uploads nothing.
  coverage-main:
    needs: gates
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.gates.outputs.reused_result != '' &&
      needs.gates.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Build all packages
        run: pnpm run ws:build

      - name: Run "ws:check:test:cov"
        run: pnpm run ws:check:test:cov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0

  # The one required status check for this workflow, reported as
  # `code-check-result / result` — see "The aggregate job" in README.md.
  code-check-result:
    needs:
      - gates
      - build
      - code-check
    if: always()
    uses: ./.github/workflows/check-result.yml
    with:
      needs: ${{ toJSON(needs) }}
