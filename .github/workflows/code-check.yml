# cspell:ignore vitest temurin

name: Code Check

# The check workflow shape — triggers, concurrency, `permissions: {}`, the
# gate, the aggregate — is in README.md. What is particular to this one: a
# `build` job that serves `dist/` to the matrix, and a `coverage-main` job
# that uploads coverage on a push to `main` when the matrix does not run.

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.event_name == 'push', github.sha, github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    uses: ./.github/workflows/check-gates.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      diff-scope: code
      result-job: code-check-result / result
      # `coverage-main` runs on a reused verdict and skips on an irrelevant
      # diff, so on a push the diff question is asked either way.
      diff-when-reused: ${{ github.event_name == 'push' }}

  # `ws:build` once, for every entry of the matrix below to unpack — see "The
  # `dist/` artifact" in README.md.
  #
  # Each of those entries needs `dist/`: a package's `build` only type-checks
  # what it publishes, so tests, scripts, configs and lint configs all reach
  # their workspace siblings through the `exports` map, which resolves there.
  # Each entry used to run the build for itself — fourteen runs of the same
  # 34-second command producing the same 27 directories, about eight
  # runner-minutes a pull request. What that trades is wall clock: the matrix
  # waits on one build and this job costs its own checkout and install, so the
  # critical path grows by roughly a minute while the runner time falls by
  # six. Splitting the matrix to spare the entries that do not read `dist/`
  # would be two matrices to keep in step, which is a worse trade than the
  # wait.
  build:
    needs: gates
    # This is where the gate lives: the matrix below waits on this job, so
    # everything that skips the checks skips them by skipping this. The
    # clauses are the caller shape from README.md.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-ci')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false' &&
      needs.gates.outputs.reused_result == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The artifact has to be the build of the commit the matrix checks.
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Build all packages
        run: pnpm run ws:build

      - name: Pack the build output
        run: |
          set -euo pipefail
          find libs apps tools languages -maxdepth 3 -type d -name dist \
            -not -path '*/node_modules/*' -print0 |
            tar --null --files-from - -czf "${RUNNER_TEMP}/dist.tar.gz"
          ls -lh "${RUNNER_TEMP}/dist.tar.gz"

      - name: Upload the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist.tar.gz
          retention-days: 1

  code-check:
    needs:
      - gates
      - build
    # The gate is `build`'s, above, and asking whether that job succeeded asks
    # all of it at once. Every state that skips the checks skips `build`, and a
    # job that did not build is a job this matrix has nothing to download from.
    # Restating the six clauses here would be two conditions that have to stay
    # identical, with nothing to report the day they stop being.
    #
    # `!cancelled()` still earns its place. Without it this job would be
    # skipped whenever *any* job it needs did not succeed — including `gates`,
    # which is meant to fail open. `build` carries its own `!cancelled()`, so a
    # gate that failed to answer still builds; this clause is what lets the
    # matrix follow it.
    if: >-
      !cancelled() &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # Nine entries, sized to the account's twenty concurrent runners
        # rather than to the shortest wall clock per entry: one pull request's
        # jobs across the check workflows are kept at sixteen or fewer, so
        # that it does not queue behind itself. When this matrix starts, after
        # `build`, the same pull request holds the other workflows' jobs
        # (style-check's two, node-version-compatibility's two, strict-lib-gen,
        # the benchmark), so nine here make fifteen. With sixteen entries here
        # and six to eight jobs there, three to six entries waited about a
        # hundred seconds for a runner on every run measured, on the critical
        # path. Each entry also pays about forty seconds of setup. So entries
        # are packed to about the length of the longest single one (a lint
        # half, about five minutes of work), and each bundle is a
        # `run-s --continue-on-error` script so that every part of it reports
        # even when an earlier one fails. An entry is added on its own only
        # when it outgrows that. The `fix:*` entries stay alone: unblock-prs
        # auto-fixes them by their check names (`.github/unblock-prs.json`).
        command:
          # `check:root` (the root guards) and six checks of under forty
          # seconds each: `check:knip`, `check:published-deps`,
          # `strict-lib:check:types`, `strict-lib:check:lint`
          # (`strict-lib/`'s own scripts, which no `ws:*` entry reaches),
          # `ws:check:dist` (what the build emitted, type-checked by package
          # name through the `exports` map) and `ws:check:sumi` (the Sumi
          # lint of the dogfood packages).
          - z:ci:code-check:quick
          # `ws:check:types` outside `strict-lib/`, with `--no-sort` (about a
          # minute: no type check waits on another package's, as siblings
          # resolve to `dist/`), then the browser tests, one package at a
          # time. The strict-lib harnesses' type checks, nine tenths of
          # `ws:check:types`, run in strict-lib-gen.yml beside its generator,
          # whose diff gate covers every file they read.
          - z:ci:code-check:types-and-browser
          # `ws:fix:lint` in two halves, `apps/` and the rest, each with
          # `--no-sort`: in one job it was the second-longest entry, and pnpm's
          # topological order kept it at one package in flight for minutes
          # while the packages everything depends on were linted. No lint
          # waits on another package's — siblings resolve to `dist/`.
          - ws:fix:lint:apps
          - ws:fix:lint:non-apps
          # `ws:check:test:cov` in two shards, because one package at a time
          # (`--workspace-concurrency=1`) made it the longest entry by minutes.
          # The first names the four ESLint plugin suites, about half of it;
          # the second is everything else by excluding them, so a new package
          # lands there. Each shard uploads its own reports and Codecov merges
          # them (`codecov.yml`).
          - ws:check:test:cov:shard-1
          - ws:check:test:cov:shard-2
          # Every app's `check:e2e`, one app at a time, `--no-bail` so that one
          # app's failure does not hide the rest. It was two shards, by
          # `task-manager` and the rest, at under three minutes each; together
          # they take about as long as a lint half.
          - ws:check:e2e
          # The Firebase emulator suites, which need Java: the end-to-end tests
          # that run against the emulators, and the Firestore rules tests of
          # life-plan-simulator and task-manager, so that a pull request
          # breaking `firestore.rules` fails before it merges
          # (`deploy-firestore.yml` deploys whatever reaches `main`). Then
          # `verify:npm-packages`, which installs what the packages publish.
          - z:ci:code-check:firebase-and-verify
          - fix:codemod:full

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      # `ws:check:test:cov` needs a browser too: the synstate adapters' hooks only
      # run in one, so their coverage would otherwise be reported as zero.
      # `ws:check:e2e` and the emulator end-to-end tests drive one, which is the
      # whole point of them. A bundle names its own entry here, by what it
      # runs, as it does for Java below.
      # `--only-shell`: every launch here is headless, which Playwright runs on
      # `chromium-headless-shell`, so the full Chromium build would be
      # downloaded for nothing. Only the extensions' `pack:crx` and `smoke`
      # need it, and CI runs neither.
      - name: Install Playwright Browsers
        if: startsWith(matrix.command, 'ws:check:test:browser') || startsWith(matrix.command, 'ws:check:test:cov') || startsWith(matrix.command, 'ws:check:e2e') || matrix.command == 'z:ci:code-check:types-and-browser' || matrix.command == 'z:ci:code-check:firebase-and-verify'
        run: pnpm exec playwright install --only-shell chromium

      # Firestore and Pub/Sub need Java 21 or later. firebase-tools is already
      # a catalog-pinned dependency of each app; no Firebase login is needed.
      - name: Set up Java for the Firebase emulators
        if: matrix.command == 'z:ci:code-check:firebase-and-verify'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The release archives `check:root:actionlint` downloads and verifies
      # (`tools/scripts/lib/release-binaries.mts`), kept for the next run on
      # the same branch, which then does not ask GitHub Releases again. A new
      # pull request starts without them: a cache is saved on success only,
      # and `main` rarely runs this matrix (see "Reusing a verdict" in
      # README.md). The key is the pin file, so a moved pin starts a new
      # cache; the script checks every archive against its pinned digest
      # whether it came from here or from the network, so a cache can make it
      # fail, never pass.
      - name: Restore the release-binary archives
        if: matrix.command == 'z:ci:code-check:quick'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules/.cache/release-binaries/archives
          key: release-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/configs/release-binaries.json') }}

      - name: Download the build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}

      - name: Unpack the build output
        run: tar -xzf "${RUNNER_TEMP}/dist.tar.gz"

      # The browser tests used to be wrapped in a two-attempt retry, because
      # one file at a time would fail to load. The cause was Vite optimizing a
      # dependency mid-run and reloading the page; naming those dependencies in
      # each package's `optimizeDepsInclude` removed it, so a failure here is
      # now a failure rather than something to try again.
      - name: Run "${{ matrix.command }}"
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        run: pnpm run z:assert-repo-is-clean

      - name: Upload coverage reports to Codecov
        if: startsWith(matrix.command, 'ws:check:test:cov')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

  # What a push to main runs when the matrix above reused a verdict: its
  # `ws:check:test:cov` shards, as the one command they split, and nothing
  # else, so that Codecov has a report on the base commit to compare a pull
  # request's against. The upload is the point of this job, so a verdict
  # cannot stand in for it. When the matrix does run on a push — no verdict
  # matched, or the gate failed to answer — its own shards upload, and this
  # job stays out of it.
  #
  # A job of its own rather than a step condition inside the matrix job,
  # because a matrix entry that boots a runner and skips every step still
  # reports a green check run named after a command that did not run. The
  # steps are the matrix job's, repeated, less the `dist/` artifact; keep the
  # two in step.
  #
  # Gated on the diff exactly as the matrix is — `gates` compares against
  # `github.event.before` on main, and answers that even for a reused verdict
  # (`diff-when-reused`) — so a merge that touched nothing the tests read
  # uploads nothing.
  coverage-main:
    needs: gates
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.gates.outputs.reused_result != '' &&
      needs.gates.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --only-shell chromium

      - name: Build all packages
        run: pnpm run ws:build

      - name: Run "ws:check:test:cov"
        run: pnpm run ws:check:test:cov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

  # The one required status check for this workflow, reported as
  # `code-check-result / result` — see "The aggregate job" in README.md.
  code-check-result:
    needs:
      - gates
      - build
      - code-check
    # Not on a label event while `skip-ci` is on, so that putting the label on
    # supersedes no verdict — "A label event under `skip-ci`" in README.md.
    if: >-
      always() &&
      !((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    uses: ./.github/workflows/check-result.yml
    with:
      needs: ${{ toJSON(needs) }}
