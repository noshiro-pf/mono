# cspell:ignore vitest temurin

name: Code Check

# The check workflow shape — triggers, concurrency, `permissions: {}`, the
# gate, the aggregate — is in README.md. What is particular to this one: a
# matrix whose entries each build what they read, and a `coverage-main` job
# that uploads coverage on a push to `main` when the matrix does not run.

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.event_name == 'push', github.sha, github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    uses: ./.github/workflows/check-gates.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      diff-scope: code
      result-job: code-check-result / result
      # `coverage-main` runs on a reused verdict and skips on an irrelevant
      # diff, so on a push the diff question is asked either way.
      diff-when-reused: ${{ github.event_name == 'push' }}

  # No `build` job: each entry builds what it reads, right after `gates`. One
  # `ws:build` handed to the matrix as an artifact cost the critical path
  # about three minutes (the gate, then the build job's own setup, then each
  # entry's setup and download) while ten of the account's runners stood idle
  # waiting for it; the runner time it saved is not what is short on a public
  # repository, the twenty concurrent runners are. `ws:build:deps` (about 45
  # seconds) is what every check behind `assert-deps-built --workspace` needs;
  # the entries that read a package's own `dist/` (`ws:check:dist` and
  # `verify:npm-packages`, and synstate-docs' end-to-end suite, which runs
  # against its production build) run the whole `ws:build`, and that build
  # failing is this workflow's build check. See "The `dist/` artifact" in
  # README.md.
  code-check:
    needs: gates
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-ci')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false' &&
      needs.gates.outputs.reused_result == ''
    # The command alone, as the check is named, so that the properties below
    # do not join the context name unblock-prs and the rulesets read.
    name: code-check (${{ matrix.command }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # Ten entries, packed so that each takes six to six and a half minutes
        # from its start to its end, setup and build included. One pull
        # request's jobs across the check workflows start together after
        # their gates and are kept at seventeen — ten here, style-check's two,
        # node-version-compatibility's three, strict-lib-gen's two — of the
        # account's twenty runners, which leaves three for what a merge to
        # `main` runs at the same time; the benchmark's job, a minute when its
        # baseline hits, is the one more. Above twenty a job waits for a
        # runner, and which one waits is GitHub's choice. So an entry is as
        # long as the longest job any of them has to be (minimum Node's whole
        # `ws:check:test`, about 400 seconds), short checks ride along with a
        # longer one, and a bundle is a `run-s --continue-on-error` script so
        # that every part of it reports even when an earlier one fails. The
        # `fix:*` entries stay alone: unblock-prs auto-fixes them by their
        # check names (`.github/unblock-prs.json`).
        #
        # Each entry says what it needs beside its command: `build`, the
        # script that builds what it reads; `browser`, Playwright's headless
        # Chromium; `java`, the Firebase emulators' runtime; `coverage`, that
        # it uploads coverage reports.
        include:
          # `ws:fix:lint` in two halves, `apps/` and the rest, each with
          # `--no-sort`: pnpm's topological order kept one package in flight
          # for minutes while the packages everything depends on were linted.
          # No lint waits on another package's — siblings resolve to `dist/`.
          # Each half is about 285 seconds of work.
          - command: ws:fix:lint:apps
            build: ws:build:deps
          - command: ws:fix:lint:non-apps
            build: ws:build:deps

          - command: fix:codemod:full
            build: ws:build:deps

          # The root guards, about 175 seconds.
          - command: check:root
            build: ws:build:deps

          # `ws:check:test:cov` in two shards, one package at a time. The
          # first names the four ESLint plugin suites, about half of it; the
          # second is everything else by excluding them, so a new package
          # lands there. Each shard uploads its own reports and Codecov merges
          # them (`codecov.yml`). The first rides with the emulator end-to-end
          # tests; the second with `ws:check:types` outside `strict-lib/`
          # (about a minute: the strict-lib harnesses run in
          # strict-lib-gen.yml) and the Firestore rules tests of
          # life-plan-simulator and task-manager, so that a pull request
          # breaking `firestore.rules` fails before it merges
          # (`deploy-firestore.yml` deploys whatever reaches `main`).
          - command: z:ci:code-check:coverage-1-and-emulators
            build: ws:build:deps
            browser: true
            java: true
            coverage: true
          - command: z:ci:code-check:coverage-2-types-and-rules
            build: ws:build:deps
            browser: true
            java: true
            coverage: true

          # `ws:check:e2e` in two shards, one app at a time: `task-manager`,
          # about half of it, and every other app by excluding it, so a new
          # suite lands there. The first rides with five checks of under
          # forty seconds each: `check:knip`, `check:published-deps`,
          # `strict-lib:check:types`, `strict-lib:check:lint`
          # (`strict-lib/`'s own scripts, which no `ws:*` entry reaches) and
          # `ws:check:sumi` (the Sumi lint of the dogfood packages).
          - command: z:ci:code-check:e2e-1-and-quick
            build: ws:build:deps
            browser: true
          # The whole `ws:build`: synstate-docs' suite runs against its
          # production build, served by `preview` alone in CI
          # (`tools/configs/playwright-config.mts`), and `ws:build:deps` builds
          # no app.
          - command: ws:check:e2e:shard-2
            build: ws:build
            browser: true

          - command: ws:check:test:browser
            build: ws:build:deps
            browser: true

          # What reads the packages' own `dist/`: `ws:check:dist` (what the
          # build emitted, type-checked by package name through the `exports`
          # map) and `verify:npm-packages`, which installs what the packages
          # publish.
          - command: z:ci:code-check:dist-and-verify
            build: ws:build

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      # `ws:check:test:cov` needs a browser too: the synstate adapters' hooks
      # only run in one, so their coverage would otherwise be reported as zero.
      # The end-to-end tests drive one, which is the whole point of them.
      # `--only-shell`: every launch here is headless, which Playwright runs on
      # `chromium-headless-shell`, so the full Chromium build would be
      # downloaded for nothing. Only the extensions' `pack:crx` and `smoke`
      # need it, and CI runs neither.
      - name: Install Playwright Browsers
        if: matrix.browser
        run: pnpm exec playwright install --only-shell chromium

      # Firestore and Pub/Sub need Java 21 or later. firebase-tools is already
      # a catalog-pinned dependency of each app; no Firebase login is needed.
      - name: Set up Java for the Firebase emulators
        if: matrix.java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The release archives `check:root:actionlint` downloads and verifies
      # (`tools/scripts/lib/release-binaries.mts`), kept for the next run on
      # the same branch, which then does not ask GitHub Releases again. A new
      # pull request starts without them: a cache is saved on success only,
      # and `main` rarely runs this matrix (see "Reusing a verdict" in
      # README.md). The key is the pin file, so a moved pin starts a new
      # cache; the script checks every archive against its pinned digest
      # whether it came from here or from the network, so a cache can make it
      # fail, never pass.
      - name: Restore the release-binary archives
        if: matrix.command == 'check:root'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules/.cache/release-binaries/archives
          key: release-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/configs/release-binaries.json') }}

      - name: Build what "${{ matrix.command }}" reads
        run: pnpm run ${{ matrix.build }}

      # The browser tests used to be wrapped in a two-attempt retry, because
      # one file at a time would fail to load. The cause was Vite optimizing a
      # dependency mid-run and reloading the page; naming those dependencies in
      # each package's `optimizeDepsInclude` removed it, so a failure here is
      # now a failure rather than something to try again.
      - name: Run "${{ matrix.command }}"
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        run: pnpm run z:assert-repo-is-clean

      # Whatever the rest of the bundle concluded: a coverage shard shares its
      # job with checks that have nothing to do with coverage, and Codecov
      # comments only once both shards have uploaded (`codecov.yml`). A shard
      # whose own tests failed uploads what it wrote, on a pull request that
      # is red anyway; the copy kept for `main` below is taken only from a
      # successful run.
      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && matrix.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

      # The same reports again, for `coverage-main` to upload when this tree
      # reaches `main` instead of running the shards a second time. Only the
      # files Codecov reads: each package's `lcov.info`, already rewritten to
      # repository paths by `coverage:normalize-paths`, without the HTML
      # report beside it. Kept for a week, longer than the reuse lookup
      # reaches back (see "Reusing a verdict" in README.md).
      - name: Keep the coverage reports for main
        if: matrix.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ strategy.job-index }}
          path: |
            libs/*/coverage/lcov.info
            apps/*/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  # What a push to main runs when the matrix above reused a verdict, so that
  # Codecov has a report on the base commit to compare a pull request's
  # against. The upload is the point of this job, so a verdict cannot stand in
  # for it. When the matrix does run on a push — no verdict matched, or the
  # gate failed to answer — its own shards upload, and this job stays out of
  # it.
  #
  # What it uploads is the reports the pull request's run made of this same
  # tree (`coverage-*`, kept by the matrix above), so a merge costs a download
  # and an upload rather than a build and every coverage shard in a row. Only
  # a successful run is taken, because a failed shard kept no reports and the
  # rest would be a partial picture. Where no run of this tree holds them, the
  # shards run here, as one command: the steps below the lookup are the matrix
  # job's, repeated, with the whole `ws:build`; keep the two in step. See
  # "Reusing what a pull request produced" in README.md.
  #
  # A job of its own rather than a step condition inside the matrix job,
  # because a matrix entry that boots a runner and skips every step still
  # reports a green check run named after a command that did not run.
  #
  # Gated on the diff exactly as the matrix is — `gates` compares against
  # `github.event.before` on main, and answers that even for a reused verdict
  # (`diff-when-reused`) — so a merge that touched nothing the tests read
  # uploads nothing.
  coverage-main:
    needs: gates
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.gates.outputs.reused_result != '' &&
      needs.gates.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    # `actions: read` to find and download the reports of an earlier run.
    permissions:
      actions: read
      contents: read
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the coverage reports of this tree
        id: reported
        uses: ./.github/actions/find-run-of-tree
        with:
          workflow: code-check.yml
          artifact-pattern: '^coverage-[0-9]+$'
          conclusion: success

      - name: Take those reports
        id: taken
        if: steps.reported.outputs.run-id != ''
        # A download that fails runs the shards here instead.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          run-id: ${{ steps.reported.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Set up pnpm, Node.js and the dependencies
        if: steps.taken.outcome != 'success'
        uses: ./.github/actions/setup

      - name: Install Playwright Browsers
        if: steps.taken.outcome != 'success'
        run: pnpm exec playwright install --only-shell chromium

      - name: Build all packages
        if: steps.taken.outcome != 'success'
        run: pnpm run ws:build

      - name: Run "ws:check:test:cov"
        if: steps.taken.outcome != 'success'
        run: pnpm run ws:check:test:cov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

  # The one required status check for this workflow, reported as
  # `code-check-result / result` — see "The aggregate job" in README.md.
  code-check-result:
    needs:
      - gates
      - code-check
    # Not on a label event while `skip-ci` is on, so that putting the label on
    # supersedes no verdict — "A label event under `skip-ci`" in README.md.
    if: >-
      always() &&
      !((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    uses: ./.github/workflows/check-result.yml
    with:
      needs: ${{ toJSON(needs) }}
