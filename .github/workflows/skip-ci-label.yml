name: Skip CI Label

# Writes the `no-skip-ci-label` commit status — the one thing that holds a
# pull request carrying `skip-ci` — on every head commit. Why it is a commit
# status rather than a job's check run, why it is written on every event, and
# what it holds together with the `*-result` aggregates is in README.md under
# "`skip-ci` and `no-skip-ci-label`"; `pull_request_target` and what it asks
# of this job is under "`pull_request_target`" there.
#
# No `push` trigger: the required checks are evaluated when a pull request
# merges, and the `main` ruleset accepts no other way onto the branch.
#
# No `branches:` filter, deliberately. The required checks are `main`'s, but a
# pull request whose base is anything else still needs this status written:
# a head commit without it reads "Expected — waiting for status to be
# reported", which blocks forever.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

# Cancelling the older run matters more here than saving its few seconds: a
# `labeled` run still writing `pending` after the `unlabeled` run wrote
# `success` would leave the pull request blocked with no label on it. The
# newer event's run is the one whose answer is current.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  statuses: write

jobs:
  # Deliberately not named `no-skip-ci-label`: this job's own check run and the
  # status it writes would then share a name, and which of the two the
  # ruleset reads is not something to find out on a merge.
  skip-ci-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # No checkout, and nothing executed from the tree: only this `run:`
      # block, which the event resolved from the base branch.
      - name: Write the `no-skip-ci-label` status for the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          # The pull request's own head, not the merge commit GitHub
          # synthesises for the event: the required checks are read on the
          # head.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${LABELLED}" = 'true' ]; then
            state='pending'
            description='The skip-ci label is on. Take it off to run the checks and unblock the merge.'
            summary='The `skip-ci` label is on this pull request, so the checks were skipped and `no-skip-ci-label` is left `pending`, which holds the merge. Take the label off: removing it fires `unlabeled`, runs the checks, and writes `success` here.'
          else
            state='success'
            description='No skip-ci label.'
            summary='No `skip-ci` label on this pull request: `no-skip-ci-label` is `success` and holds nothing.'
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            --field state="${state}" \
            --field context='no-skip-ci-label' \
            --field description="${description}" \
            --field target_url="${RUN_URL}" \
            >/dev/null

          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
