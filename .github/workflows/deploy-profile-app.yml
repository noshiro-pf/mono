# This is a basic workflow to help you get started with Actions

name: Deploy my-profile-app

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  # push:
  #   branches: [develop]
  #   paths:
  #     - .github/workflows/deploy_portfolio_app.yml
  #     - config/tsconfig/**
  #     - pnpm-lock.yaml
  #     - packages/utils/**
  #     - packages/apps/my-portfolio-app-preact/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  buildAndDeploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # Set up GitHub Actions caching for Wireit.
      # - uses: google/wireit@setup-github-actions-caching/v1.0.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: build dependencies
        run: pnpm --filter "@noshiro/my-portfolio-app-preact..." run build

      - name: lint
        run: pnpm --filter "@noshiro/my-portfolio-app-preact" run lint

      - name: test
        run: pnpm --filter "@noshiro/my-portfolio-app-preact" run test

      - name: deploy
        run: pnpm --filter "@noshiro/my-portfolio-app-preact" run fb:deploy
        env:
          PROJECT_ID: release
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
