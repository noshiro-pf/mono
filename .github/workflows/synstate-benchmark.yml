name: SynState Benchmark

# A `paths` filter, unlike every check workflow here (see "Triggers" in
# README.md for why those carry none). This workflow reports no required
# status check: a benchmark on a shared runner is a measurement, not a
# verdict, and gating a merge on it would gate it on the runner's mood. So a
# path filter is exactly right here, and it keeps every unrelated pull request
# from spending five minutes measuring what it did not touch.
on:
  push:
    branches:
      - main
    paths:
      - 'libs/synstate/src/**'
      # A release bumps the version, which is part of the baseline key.
      - 'libs/synstate/package.json'
      - 'libs/synstate/samples/docs-site/benchmark/**'
      - 'apps/synstate-docs/scripts/benchmark/**'
      - 'apps/synstate-docs/src/data/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/synstate-benchmark.yml'

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'libs/synstate/src/**'
      - 'libs/synstate/package.json'
      - 'libs/synstate/samples/docs-site/benchmark/**'
      - 'apps/synstate-docs/scripts/benchmark/**'
      - 'apps/synstate-docs/src/data/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/synstate-benchmark.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  benchmark:
    # Pinned, not `ubuntu-latest`. Comparability is the entire point: these
    # numbers are published, and a table measured on one image beside a table
    # measured on the next is the confusion this workflow exists to end. When
    # this moves, every baseline cache key moves with it — the image is part of
    # the key below — so the tables are re-measured rather than silently mixed.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Four scenarios, and the cascaded diamond alone spends three 5-second
    # timeouts on RxJS. Measured locally at about 2m30s for all four, plus
    # install and build.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      # The key is the set of versions being compared, because that is what a
      # benchmark result is a fact about. Re-measuring on every push would put
      # a diff of noise in the tables on every pull request, which is what
      # `libraries` in the key prevents; measuring once per version set and
      # reusing it is what keeps the published tables still.
      #
      # The image and the Node version are spelled out rather than folded into
      # the digest, so that a glance at the cache name says which runner a
      # baseline came from.
      - name: Compute the baseline cache key
        id: key
        run: |
          set -euo pipefail
          libs="$(pnpm --filter @synstate/docs run --silent z:benchmark:version-key)"
          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          echo "value=synstate-benchmark-v1-ubuntu-24.04-node${node_major}-${libs}" >>"${GITHUB_OUTPUT}"
          echo "Baseline key: synstate-benchmark-v1-ubuntu-24.04-node${node_major}-${libs}"

      # Restore only. A cache written on a pull request branch is visible to
      # that branch alone, so a baseline has to come from `main` to be worth
      # anything; the save step below is therefore gated on `main`.
      - name: Restore the baseline for these versions
        id: baseline
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: baseline
          key: ${{ steps.key.outputs.value }}

      # `Measure` overwrites them, and they are what is judged below.
      - name: Keep the committed tables
        run: cp -R apps/synstate-docs/src/data committed

      - name: Build
        run: pnpm run ws:build

      - name: Measure
        run: pnpm --filter @synstate/docs run benchmark

      # What the measurement would change if it were committed. On `main` with
      # no baseline yet, this is the diff to commit; on a pull request it is
      # information, and nothing here commits anything.
      - name: Show what the measurement changes
        run: |
          set -euo pipefail
          {
            echo '### The measurement against the committed tables'
            echo
            echo '```diff'
            git --no-pager diff --stat -- apps/synstate-docs/src/data || true
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Compare with the baseline
        if: steps.baseline.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          pnpm --filter @synstate/docs run --silent z:benchmark:compare \
            "$(pwd)/baseline" \
            "$(pwd)/apps/synstate-docs/src/data" \
            >>"${GITHUB_STEP_SUMMARY}"

      - name: Say that there was no baseline
        if: steps.baseline.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          {
            echo '### No baseline for these library versions'
            echo
            echo 'Nothing has been measured on this runner image for this set of'
            echo 'versions yet, so there is nothing to compare against. A run on'
            echo '`main` establishes it.'
          } >>"${GITHUB_STEP_SUMMARY}"

      # The results are the artifact whether or not they become the baseline:
      # on a pull request they are what the author can download and commit if
      # the change is meant to move the published tables.
      - name: Upload the measurement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synstate-benchmark-${{ github.run_id }}
          path: apps/synstate-docs/src/data
          if-no-files-found: error

      # Only from `main`, and only when there was no baseline: a cache entry is
      # immutable, so this writes the first measurement for a version set and
      # never overwrites it. That immutability is the feature — the baseline a
      # pull request is compared against does not drift under it.
      - name: Save this as the baseline
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          steps.baseline.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf baseline
          cp -R apps/synstate-docs/src/data baseline

      - name: Store the baseline
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          steps.baseline.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: baseline
          key: ${{ steps.key.outputs.value }}

      # The published tables are judged against the measurement CI keeps for
      # these versions: the cached baseline, or on `main` with none yet the one
      # just taken and stored. Not byte for byte, and not in milliseconds:
      # `check-drift.mts` divides out the runner instance and calls drift only
      # a change of a library relative to the others beyond what unchanged
      # code moves by between runs. So a dependency bump that moves nothing
      # keeps the published tables, and one that does moves them.
      - name: Judge the committed tables
        id: committed
        if: >-
          steps.baseline.outputs.cache-hit == 'true' ||
          (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        run: |
          set -euo pipefail
          reference="$(pwd)/${{ case(steps.baseline.outputs.cache-hit == 'true', 'baseline', 'apps/synstate-docs/src/data') }}"
          echo "reference=${reference}" >>"${GITHUB_OUTPUT}"
          pnpm --filter @synstate/docs run --silent z:benchmark:check-drift \
            "${reference}" \
            "$(pwd)/committed" \
            >>"${GITHUB_STEP_SUMMARY}"

      # Information for a pull request that changes SynState itself: whether
      # this branch moved it by more than noise against the baseline.
      - name: Judge this branch's measurement
        id: branch
        if: >-
          github.event_name == 'pull_request' &&
          steps.baseline.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          pnpm --filter @synstate/docs run --silent z:benchmark:check-drift \
            "$(pwd)/apps/synstate-docs/src/data" \
            "$(pwd)/baseline" \
            >>"${GITHUB_STEP_SUMMARY}"

      - name: Warn that this branch moved the numbers
        if: steps.branch.outputs.drifted == 'true'
        run: echo '::warning title=Benchmark moved::This branch moved a library beyond run-to-run noise against the baseline. The job summary has the table.'

      # What to commit when the tables have drifted: the reference itself, so
      # that the next run judges the tables equal to it.
      - name: Upload the tables to commit
        if: steps.committed.outputs.drifted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synstate-benchmark-to-commit-${{ github.run_id }}
          path: ${{ steps.committed.outputs.reference }}
          if-no-files-found: error

      # Red only on `main`. A pull request that bumps a compared library has no
      # baseline to commit until it merges and `main` measures one, so failing
      # it would hold every dependency update on a commit it cannot make; it
      # gets a warning instead. A red run on `main` is the signal that the
      # published tables no longer describe these versions. Committing the
      # artifact is the fix; re-running `benchmark` locally is not, because a
      # local machine is not the pinned runner.
      - name: Fail when the published tables have drifted
        if: steps.committed.outputs.drifted == 'true'
        run: |
          set -euo pipefail
          message='The committed tables in apps/synstate-docs/src/data have drifted from the CI measurement for these library versions. Replace them with the files of the synstate-benchmark-to-commit-${{ github.run_id }} artifact, then run pnpm --filter @synstate/docs run gen:benchmark-doc and pnpm run fmt, and commit the result.'
          if [ "${GITHUB_EVENT_NAME}" = 'pull_request' ]; then
            echo "::warning title=Benchmark tables drifted::${message}"
          else
            echo "::error title=Benchmark tables drifted::${message}"
            exit 1
          fi
