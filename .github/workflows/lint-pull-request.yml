# cspell:ignore PCRE FFEF gsub

name: Lint Pull Request

# Three checks on the pull request itself rather than on its tree: the title,
# the commit messages, and the commit count. Each job's name is its required
# context. `pull_request_target`, and why nothing here checks the branch out,
# is in README.md under "`pull_request_target`"; the `skip-ci` condition on
# each job is under "`skip-ci` and `no-skip-ci-label`" there.

on:
  pull_request_target:
    branches:
      - 'main'
      # `archive/**` holds frozen snapshots of retired work. They are never
      # merged back, so every check on them is wasted CI. `main` above already
      # excludes them; the negation states the intent explicitly so that
      # widening the filter later does not quietly pull them back in.
      - '!archive/**'
    types:
      - opened
      # Title, body or base branch — the one check workflow that reads
      # `edited`, because the title is its input. A body edit re-runs every
      # job as well, and has to: a job skipped on "the title did not change"
      # would report `skipped` for a required context and supersede a red
      # title check with a satisfied one.
      - edited
      - synchronize
      - labeled
      - unlabeled

# The title is edited and the branch pushed to in bursts; only the last state
# is worth a run.
concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request_target', github.event.pull_request.number, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  pull-requests: read

env:
  # What "write it in English" is enforced as: no Japanese. Both jobs below
  # match against this one pattern — CJK symbols and punctuation, kana, the
  # CJK ideographs and their compatibility block, and the fullwidth forms.
  #
  # It is deliberately not "ASCII only". Commit subjects here carry em dashes,
  # curly quotes and the occasional accented name, none of which are a
  # language, and a check that rejected them would be worked around rather
  # than followed.
  #
  # PCRE, for `grep -P`; `LC_ALL` is set on each step so that `\x{…}` is read
  # as a code point rather than a byte.
  JAPANESE_PATTERN: '[\x{3000}-\x{303F}\x{3040}-\x{30FF}\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}\x{FF00}-\x{FFEF}]'
  LC_ALL: C.UTF-8

jobs:
  # Only `pull_request_target` reaches this workflow, so the `skip-ci`
  # condition has no other event to exempt.
  semantic-pull-request:
    name: Validate PR title
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The title is what a squash merge puts on `main`:
      # `squash_merge_commit_title` is `PR_TITLE` in
      # `repo-settings/repository-settings/settings.json`. So the language rule
      # for commit messages is a rule about this string, and it is checked here
      # rather than against the branch — the branch's own subjects are squashed
      # into the body, which the job below covers.
      #
      # The whole title, not just the subject the action above validates: a
      # scope can hold Japanese too.
      - name: Check that the title is written in English
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "${PR_TITLE}" | grep -Pq "${JAPANESE_PATTERN}"; then
            echo 'The title is written in English.'
            exit 0
          fi

          summary="The pull request title must be written in English, and this one is not: ${PR_TITLE}"
          echo "::error::${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1

  commit-messages:
    name: Validate commit messages
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Read through the API rather than from a checkout. Nothing here
      # executes anything from the pull request — `gh` fetches the commit
      # list, `grep` reads it.
      #
      # A squash merge concatenates these into the commit body
      # (`squash_merge_commit_message` is `COMMIT_MESSAGES`), so they land on
      # `main` as surely as the title does.
      - name: Check that every commit message is written in English
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # One line per commit, so that a multi-line message cannot report a
          # match without saying which commit it came from. The endpoint caps
          # at 250 commits, which `--paginate` walks a page at a time.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | "\(.sha[0:7]) \(.commit.message | gsub("\n"; " / "))"' >commit-messages.txt

          if ! offending="$(grep -P "${JAPANESE_PATTERN}" commit-messages.txt)"; then
            echo 'Every commit message is written in English.'
            exit 0
          fi

          summary="Every commit message must be written in English. These are not:"
          echo "::error::${summary}"
          printf '%s\n%s\n' "${summary}" "${offending}"
          {
            echo "${summary}"
            echo
            echo '```text'
            echo "${offending}"
            echo '```'
            echo
            echo 'Rewrite them with `git rebase -i` (or `git commit --amend` for the last one) and force-push.'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1

  commit-count:
    name: Validate commit count
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A squash merge writes the branch's subjects into the body of the one
      # commit it puts on `main` (`squash_merge_commit_message` is
      # `COMMIT_MESSAGES`), so a branch of several commits lands as a list of
      # whatever it was written in while the work was in progress. `main`'s
      # history is unchangeable, which makes this the last point at which that
      # message can be decided: one commit, whose message is the one the
      # repository keeps.
      #
      # Read through the API, as the job above does. `.commits` on the pull
      # request itself is the total — the commit list endpoint caps at 250,
      # and a count is all this needs.
      #
      # A pull request based on another one (the chain CLAUDE.md describes)
      # counts its parent's commit too, and so reads as more than one until
      # the parent merges and it is rebased. That is `unblock-prs`'s order
      # already: it rebases before taking `skip-ci` off, and while the label
      # is on this job does not run.
      - name: Check that the branch is a single commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          count="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.commits')"

          if [ "${count}" -eq 1 ]; then
            echo 'The branch is a single commit.'
            exit 0
          fi

          summary="A pull request is squashed into a single commit before it is merged, and this one has ${count}."
          echo "::error::${summary}"
          echo "${summary}"
          {
            echo "${summary}"
            echo
            echo 'Squash them into one whose message is what `main` should keep:'
            echo
            echo '```bash'
            echo 'git fetch origin main'
            echo 'git reset --soft "$(git merge-base HEAD origin/main)"'
            echo 'git commit'
            echo '```'
            echo
            echo 'then force-push.'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1
