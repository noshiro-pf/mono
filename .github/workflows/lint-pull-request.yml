# cspell:ignore PCRE FFEF gsub

name: Lint Pull Request

# Three checks on the pull request itself rather than on its tree: the title,
# the commit messages and the commit count, one required context between them,
# `lint-pull-request-result / result`. The code owners' approval is
# `code-owners.yml`. `pull_request_target`, and why nothing here checks the
# branch out, is in README.md under "`pull_request_target`". How `skip-ci`
# holds the three is above the jobs below.

on:
  pull_request_target:
    branches:
      - 'main'
      # `archive/**` holds frozen snapshots of retired work. They are never
      # merged back, so every check on them is wasted CI. `main` above already
      # excludes them; the negation states the intent explicitly so that
      # widening the filter later does not quietly pull them back in.
      - '!archive/**'
    types:
      - opened
      # Title, body or base branch; the title is what this workflow reads it
      # for. Under `skip-ci` an edit that leaves the title alone judges nothing
      # (see above the jobs); otherwise every edit re-runs all three.
      - edited
      - synchronize
      - labeled
      - unlabeled

# The title is edited and the branch pushed to in bursts; only the last state
# is worth a run, and a newer run cancels the older one. The older run's
# aggregate, `always()`, still reports red on the head it was judging, until a
# judging run on that head replaces it; after a push that head is no longer the
# pull request's. Under `skip-ci`, an event that judges nothing (a label, a
# push, or an edit that leaves the title alone) runs in a group of its own, one
# per run, so that it never cancels or replaces a run that judges (the `opened`
# run `open-pr`'s labels arrive seconds after, a title edit's, or the
# `unlabeled` run `unblock-prs` starts while the run for its push may still be
# on its way) and no other run cancels it: cancelled before its jobs' `if` was
# read, it would leave them `cancelled` rather than `skipped`, and its aggregate
# red.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ case(github.event_name == 'pull_request_target', github.event.pull_request.number, github.ref) }}${{
      case(
        contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
        !(github.event.action == 'opened' ||
          (github.event.action == 'edited' && github.event.changes.title != '')),
        format('-idle-{0}', github.run_id),
        '') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  pull-requests: read

env:
  # What "write it in English" is enforced as: no Japanese. Both jobs below
  # match against this one pattern — CJK symbols and punctuation, kana, the
  # CJK ideographs and their compatibility block, and the fullwidth forms.
  #
  # It is deliberately not "ASCII only". Commit subjects here carry em dashes,
  # curly quotes and the occasional accented name, none of which are a
  # language, and a check that rejected them would be worked around rather
  # than followed.
  #
  # PCRE, for `grep -P`; `LC_ALL` is set on each step so that `\x{…}` is read
  # as a code point rather than a byte.
  JAPANESE_PATTERN: '[\x{3000}-\x{303F}\x{3040}-\x{30FF}\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}\x{FF00}-\x{FFEF}]'
  LC_ALL: C.UTF-8

jobs:
  # The title, the commit messages and the commit count are judged by one
  # required context, `lint-pull-request-result / result`, which calls
  # `check-result.yml` as the check workflows do, so that `skip-ci` holds
  # these three the way it holds those.
  #
  # Under `skip-ci`, the three jobs and their caller skip on the events that
  # bring no new title, and the aggregate reports nothing. Taking the label
  # off runs them, and `unblock-prs` does that after it has restacked the
  # branch. Never reporting `skipped` is the point: a skipped aggregate would
  # satisfy the required context while `no-skip-ci-label` may still say
  # `success`.
  #
  # - `labeled` / `unlabeled`: the last verdict stands, as in the check
  #   workflows ("A label event under `skip-ci`" in README.md).
  # - `synchronize`: the new head has no verdict, which holds it.
  # - `edited` without a title change: a body edit changes nothing judged
  #   here, and a base change is the case this exists for. When the layer
  #   below merges, GitHub moves this pull request onto `main` while its
  #   branch still holds that layer's own commit, which the commit count would
  #   read as a second one until the restack. The workflow reads only pull
  #   requests into `main`, and a layer's head was pushed while it was based
  #   on the layer below, so that head has no verdict, which holds it.
  #
  # A title edit runs the three under `skip-ci` too, so that a title edited in
  # the seconds after the label went on is judged rather than left on the
  # verdict given to the old one. On a layer moved onto `main` and not yet
  # restacked, that verdict is the commit count's red until the restack.
  #
  # A new check joins the aggregate's `needs` and takes the anchor as its
  # `if`.
  semantic-pull-request:
    name: Validate PR title
    # The events that judge, named once: the other two jobs take this by its
    # anchor and the aggregate skips when they do. The concurrency group at
    # the top writes its negation under `skip-ci` by hand, since a YAML anchor
    # cannot reach into an expression;
    # `pnpm run check:root:lint-pull-request-groups` keeps the two fitting.
    if: &judges >-
      !contains(github.event.pull_request.labels.*.name, 'skip-ci') ||
      github.event.action == 'opened' ||
      (github.event.action == 'edited' && github.event.changes.title != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The title is what a squash merge puts on `main`:
      # `squash_merge_commit_title` is `PR_TITLE` in
      # `repo-settings/repository-settings/settings.json`. So the language rule
      # for commit messages is a rule about this string, and it is checked here
      # rather than against the branch — the branch's own subjects are squashed
      # into the body, which the job below covers.
      #
      # The whole title, not just the subject the action above validates: a
      # scope can hold Japanese too.
      - name: Check that the title is written in English
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "${PR_TITLE}" | grep -Pq "${JAPANESE_PATTERN}"; then
            echo 'The title is written in English.'
            exit 0
          fi

          summary="The pull request title must be written in English, and this one is not: ${PR_TITLE}"
          echo "::error::${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1

  commit-messages:
    name: Validate commit messages
    if: *judges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Read through the API rather than from a checkout. Nothing here
      # executes anything from the pull request — `gh` fetches the commit
      # list, `grep` reads it.
      #
      # A squash merge concatenates these into the commit body
      # (`squash_merge_commit_message` is `COMMIT_MESSAGES`), so they land on
      # `main` as surely as the title does.
      - name: Check that every commit message is written in English
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # One line per commit, so that a multi-line message cannot report a
          # match without saying which commit it came from. The endpoint caps
          # at 250 commits, which `--paginate` walks a page at a time.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | "\(.sha[0:7]) \(.commit.message | gsub("\n"; " / "))"' >commit-messages.txt

          if ! offending="$(grep -P "${JAPANESE_PATTERN}" commit-messages.txt)"; then
            echo 'Every commit message is written in English.'
            exit 0
          fi

          summary="Every commit message must be written in English. These are not:"
          echo "::error::${summary}"
          printf '%s\n%s\n' "${summary}" "${offending}"
          # shellcheck disable=SC2016 # literal backticks, not command substitution
          {
            echo "${summary}"
            echo
            echo '```text'
            echo "${offending}"
            echo '```'
            echo
            echo 'Rewrite them with `git rebase -i` (or `git commit --amend` for the last one) and force-push.'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1

  commit-count:
    name: Validate commit count
    if: *judges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A squash merge writes the branch's subjects into the body of the one
      # commit it puts on `main` (`squash_merge_commit_message` is
      # `COMMIT_MESSAGES`), so a branch of several commits lands as a list of
      # whatever it was written in while the work was in progress. `main`'s
      # history is unchangeable, which makes this the last point at which that
      # message can be decided: one commit, whose message is the one the
      # repository keeps.
      #
      # Read through the API, as the job above does. `.commits` on the pull
      # request itself is the total — the commit list endpoint caps at 250,
      # and a count is all this needs.
      #
      # A stacked pull request (CLAUDE.md, "Commits and pull requests") is
      # based on the layer below, so `.commits` is its own commit, and this
      # workflow, filtered to `main`, does not run on it at all. When the layer
      # below merges, GitHub moves its base to `main`, and until it is rebased
      # (unless GitHub rebased it in that move) it still carries the original
      # commit of the layer that was squashed into `main`, so the count would
      # read 2. Under `skip-ci` this job does not run on that move (see above
      # the jobs); without the label it does, and is red until `unblock-prs`
      # or `auto-rebase` restacks the branch.
      - name: Check that the branch is a single commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          count="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.commits')"

          if [ "${count}" -eq 1 ]; then
            echo 'The branch is a single commit.'
            exit 0
          fi

          summary="A pull request is squashed into a single commit before it is merged, and this one has ${count}."
          echo "::error::${summary}"
          echo "${summary}"
          # shellcheck disable=SC2016 # literal backticks and $(…), not substitutions
          {
            echo "${summary}"
            echo
            echo 'Squash them into one whose message is what `main` should keep:'
            echo
            echo '```bash'
            echo 'git fetch origin main'
            echo 'git reset --soft "$(git merge-base HEAD origin/main)"'
            echo 'git commit'
            echo '```'
            echo
            echo 'then force-push.'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1

  # The one required context of the three jobs above.
  lint-pull-request-result:
    needs:
      - semantic-pull-request
      - commit-messages
      - commit-count
    # Skipped with the jobs, by their shared condition, and only then: a
    # failed or cancelled job still gets a verdict. Every need takes
    # `&judges` alone; one with a condition of its own would skip this job
    # with it and leave the head with no verdict.
    #
    # `check-result.yml` skips on `skip-ci` only for `pull_request`, never for
    # this workflow's `pull_request_target`: a run that judges under the label
    # must report its verdict, not `skipped`.
    if: always() && !contains(needs.*.result, 'skipped')
    uses: ./.github/workflows/check-result.yml
    with:
      needs: ${{ toJSON(needs) }}
