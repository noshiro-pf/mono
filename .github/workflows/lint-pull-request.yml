name: Lint Pull Request

on:
  pull_request_target:
    branches:
      - 'main'
      # `archive/**` holds frozen snapshots of retired work. They are never
      # merged back, so every check on them is wasted CI — the same reason
      # the check workflows run only for pull requests and pushes to main.
      # `main` above already excludes them; the negation states the intent
      # explicitly so that widening the filter later does not quietly pull
      # them back in.
      - '!archive/**'
    types:
      - opened
      - edited
      - synchronize

  # `Validate PR title` is a required status check, and the merge queue
  # demands every required check on its merge-group commit —
  # `pull_request_target` never fires there, so without this trigger every
  # queue entry would sit until the check timed out. There is nothing to
  # validate on a merge group (the title was checked on the pull request,
  # and the squash commit title is taken from it), so the job just reports
  # success — see the step conditions below.
  merge_group:
    types:
      - checks_requested

permissions:
  pull-requests: read

jobs:
  semantic-pull-request:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nothing to validate on a merge group
        if: github.event_name == 'merge_group'
        run: echo 'The title was validated on the pull request; the queue only needs this check to report here.'

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
