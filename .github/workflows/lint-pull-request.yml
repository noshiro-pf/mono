name: Lint Pull Request

on:
  pull_request_target:
    branches:
      - 'main'
      # `archive/**` holds frozen snapshots of retired work. They are never
      # merged back, so every check on them is wasted CI — the same reason
      # the check workflows run only for pull requests and pushes to main.
      # `main` above already excludes them; the negation states the intent
      # explicitly so that widening the filter later does not quietly pull
      # them back in.
      - '!archive/**'
    types:
      - opened
      - edited
      - synchronize

# The title is edited and the branch pushed to in bursts; only the last state
# is worth a run — see the note in type-check.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  pull-requests: read

jobs:
  semantic-pull-request:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
