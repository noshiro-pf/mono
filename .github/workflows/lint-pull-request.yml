# cspell:ignore PCRE FFEF gsub

name: Lint Pull Request

# Four checks on the pull request itself rather than on its tree: the title,
# the commit messages, the commit count, and the code owners' approval. Each
# job's name is its required context. `pull_request_target`, and why nothing
# here checks the branch out,
# is in README.md under "`pull_request_target`"; why these jobs run under
# `skip-ci` when every other check skips is under "`skip-ci` and
# `no-skip-ci-label`" there.

on:
  pull_request_target:
    branches:
      - 'main'
      # `archive/**` holds frozen snapshots of retired work. They are never
      # merged back, so every check on them is wasted CI. `main` above already
      # excludes them; the negation states the intent explicitly so that
      # widening the filter later does not quietly pull them back in.
      - '!archive/**'
    types:
      - opened
      # Title, body or base branch — the one check workflow that reads
      # `edited`, because the title is its input. A body edit re-runs every
      # job as well, and has to: a job skipped on "the title did not change"
      # would report `skipped` for a required context and supersede a red
      # title check with a satisfied one.
      - edited
      - synchronize
      - labeled
      - unlabeled

# The title is edited and the branch pushed to in bursts; only the last state
# is worth a run.
concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request_target', github.event.pull_request.number, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read
  pull-requests: read

env:
  # What "write it in English" is enforced as: no Japanese. Both jobs below
  # match against this one pattern — CJK symbols and punctuation, kana, the
  # CJK ideographs and their compatibility block, and the fullwidth forms.
  #
  # It is deliberately not "ASCII only". Commit subjects here carry em dashes,
  # curly quotes and the occasional accented name, none of which are a
  # language, and a check that rejected them would be worked around rather
  # than followed.
  #
  # PCRE, for `grep -P`; `LC_ALL` is set on each step so that `\x{…}` is read
  # as a code point rather than a byte.
  JAPANESE_PATTERN: '[\x{3000}-\x{303F}\x{3040}-\x{30FF}\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}\x{FF00}-\x{FFEF}]'
  LC_ALL: C.UTF-8

jobs:
  # No `skip-ci` condition, unlike every other check. Each job here is its own
  # required context, and a job skipped by its `if` reports `skipped` under
  # that name, which supersedes the verdict it had: putting `skip-ci` on a
  # pull request whose title check was red would satisfy that check in the
  # seconds before `no-skip-ci-label` turns `pending`. The aggregates in the
  # check workflows avoid this by skipping their caller instead, which these
  # jobs, having no caller, cannot. They read the API for seconds, so running
  # them always costs next to nothing and always reports a real verdict.
  #
  # A fifth check goes into an aggregate rather than beside these: move the
  # first three jobs behind one `lint-pull-request-result` that calls
  # `check-result.yml` the way the check workflows do, and make that one
  # required context. Each job added here is otherwise one more context in
  # `repo-settings/rulesets/main.json`, which takes `repo-settings:apply` by
  # hand before it holds anything. `code-owners` stays a context of its own
  # either way: `.github/CODEOWNERS` names it as the check that enforces the
  # file, and the merge queue tells its failure from the others' by that name.
  semantic-pull-request:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The title is what a squash merge puts on `main`:
      # `squash_merge_commit_title` is `PR_TITLE` in
      # `repo-settings/repository-settings/settings.json`. So the language rule
      # for commit messages is a rule about this string, and it is checked here
      # rather than against the branch — the branch's own subjects are squashed
      # into the body, which the job below covers.
      #
      # The whole title, not just the subject the action above validates: a
      # scope can hold Japanese too.
      - name: Check that the title is written in English
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "${PR_TITLE}" | grep -Pq "${JAPANESE_PATTERN}"; then
            echo 'The title is written in English.'
            exit 0
          fi

          summary="The pull request title must be written in English, and this one is not: ${PR_TITLE}"
          echo "::error::${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1

  commit-messages:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Read through the API rather than from a checkout. Nothing here
      # executes anything from the pull request — `gh` fetches the commit
      # list, `grep` reads it.
      #
      # A squash merge concatenates these into the commit body
      # (`squash_merge_commit_message` is `COMMIT_MESSAGES`), so they land on
      # `main` as surely as the title does.
      - name: Check that every commit message is written in English
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # One line per commit, so that a multi-line message cannot report a
          # match without saying which commit it came from. The endpoint caps
          # at 250 commits, which `--paginate` walks a page at a time.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | "\(.sha[0:7]) \(.commit.message | gsub("\n"; " / "))"' >commit-messages.txt

          if ! offending="$(grep -P "${JAPANESE_PATTERN}" commit-messages.txt)"; then
            echo 'Every commit message is written in English.'
            exit 0
          fi

          summary="Every commit message must be written in English. These are not:"
          echo "::error::${summary}"
          printf '%s\n%s\n' "${summary}" "${offending}"
          # shellcheck disable=SC2016 # literal backticks, not command substitution
          {
            echo "${summary}"
            echo
            echo '```text'
            echo "${offending}"
            echo '```'
            echo
            echo 'Rewrite them with `git rebase -i` (or `git commit --amend` for the last one) and force-push.'
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1

  commit-count:
    name: Validate commit count
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A squash merge writes the branch's subjects into the body of the one
      # commit it puts on `main` (`squash_merge_commit_message` is
      # `COMMIT_MESSAGES`), so a branch of several commits lands as a list of
      # whatever it was written in while the work was in progress. `main`'s
      # history is unchangeable, which makes this the last point at which that
      # message can be decided: one commit, whose message is the one the
      # repository keeps.
      #
      # Read through the API, as the job above does. `.commits` on the pull
      # request itself is the total — the commit list endpoint caps at 250 —
      # and a count is all a branch of one commit needs; a longer one is read
      # commit by commit below.
      #
      # A stacked pull request (CLAUDE.md, "Commits and pull requests") is
      # based on the layer below, so `.commits` is its own commit, and this
      # workflow, filtered to `main`, does not run on it at all. When the layer
      # below merges, GitHub deletes its branch and moves this one's base to
      # `main` (an `edited` event), and until `unblock-prs` or `auto-rebase`
      # restacks it the branch still carries the layer's own commit, which
      # `main` holds only as its squash: the count reads 2. Every stacked
      # merge used to turn this context red, and notify, for the minutes
      # until that restack.
      #
      # So a commit that is the head of another pull request, merged into
      # `main`, is not counted: it is the layer below, not this
      # branch's work, and the restack drops it. Only that exact case is
      # excused, on a branch of at most 20 commits. A commit merely contained
      # in a merged pull request, the head of one still open, and the head of
      # one merged into some other branch (a layer armed by mistake and merged
      # into the layer below it) count as before, and the excuse never makes
      # the count pass on its own: what is left must still be one commit.
      #
      # It does not ask which branch this one was moved off, only that the
      # commit is such a head: the REST timeline does not say what a base
      # change was between, and the `edited` payload says it only on that one
      # event, not on the label events that re-run this job later. Nor is
      # such a head ever merged by the queue: its squash is on `main` and
      # not on this branch, so the branch is behind, and `unblock-prs`
      # rebases a branch that is behind before it arms auto-merge, dropping
      # the commit (`--onto` from the merged head after a move, a plain
      # rebase's patch match otherwise); the ruleset's up-to-date rule
      # (`repo-settings/README.md`) keeps anyone else from merging it behind.
      # Squashed by bypass before then, the merged layer's subject would land
      # in the body.
      #
      # The pull request association is written when a commit is pushed to a
      # pull request, long before the merge, and `merged_at` is the merged
      # pull request's own record, set before GitHub deletes its branch and
      # so before the move that fires this run.
      - name: Check that the branch is a single commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! read -r count head_sha < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '"\(.commits) \(.head.sha)"') ||
            ! [[ "${count}" =~ ^[0-9]+$ ]]; then
            summary='Could not read how many commits the branch has; re-run the job.'
            echo "::error::${summary}"
            echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          if [ "${count}" -eq 1 ]; then
            echo 'The branch is a single commit.'
            exit 0
          fi

          # A restack leaves a handful of commits, so a branch of more than 20
          # fails below without a scan. Up to that, every commit is looked up,
          # one call each, even past the second of the branch's own, so that
          # the summary can say how many it has and every merged head it
          # carries. If any read fails, the list is not as long as the count
          # above, or the head read with that count is not the one this run is
          # for, nothing is excused and the summary asks for a re-run rather
          # than a squash, which could fold an unread merged layer in: a failed
          # or lagging read is rare, and a re-run settles it where a guess
          # either way could be wrong. (A run older than the latest push stays
          # red on its own head, which is no longer the pull request's; the
          # newer push's run decides.)
          #
          # A merged pull request's head stays associated with it after the
          # squash merge, though the commit itself never reaches `main`, so
          # the lookup below finds the layer in the very case it is for.
          own=0
          merged_layers=''
          last_layer=''
          unread=false
          if [ "${count}" -ge 2 ] && [ "${count}" -le 20 ]; then
            if ! commits="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" --jq '.[].sha')"; then
              echo "::warning::Could not read the branch's commits."
              unread=true
              commits=''
            elif [ "${head_sha}" != "${HEAD_SHA}" ] || [ "$(wc -l <<<"${commits}")" -ne "${count}" ] || ! grep -qxF "${HEAD_SHA}" <<<"${commits}"; then
              echo "::warning::The pull request reads as ${count} commits up to ${head_sha:0:7}, which does not match its commit list or ${HEAD_SHA:0:7}, the head this run is for."
              unread=true
              commits=''
            fi
            while read -r sha; do
              if [ -z "${sha}" ]; then
                continue
              fi
              # The pull request into `main` (the only base this workflow runs
              # on), other than this one, that merged with exactly this commit
              # as its head, if any.
              if ! layer="$(
                SHA="${sha}" gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls?per_page=100" \
                  --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .number != (env.PR_NUMBER | tonumber) and .head.sha == env.SHA) | .number] | first // empty' \
                  </dev/null
              )"; then
                echo "::warning::Could not read the pull requests of ${sha:0:7}."
                unread=true
                break
              fi
              if [ -n "${layer}" ]; then
                merged_layers="${merged_layers:+${merged_layers}, }#${layer} (${sha:0:7})"
                last_layer="${sha}"
              else
                own=$((own + 1))
              fi
            done <<<"${commits}"

            if [ "${unread}" = false ] && [ -n "${merged_layers}" ] && [ "${own}" -eq 1 ]; then
              notice="The branch is one commit of its own. It also carries what merged below it, as the head of ${merged_layers}, which the restack drops."
              echo "::notice::${notice}"
              echo "${notice}" >>"${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          summary="A pull request is squashed into a single commit before it is merged, and this one has ${count}."
          if [ "${unread}" = true ]; then
            summary="${summary} Its commits could not all be read, or the reads lagged a push, so none was excused as a merged layer below it: re-run the job before squashing anything."
          elif [ -n "${merged_layers}" ]; then
            summary="${summary} ${own} of them are its own; the rest merged below it, as the head of ${merged_layers}, and are not counted."
          fi
          echo "::error::${summary}"
          echo "${summary}"
          if [ "${unread}" = true ]; then
            echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          # shellcheck disable=SC2016 # literal backticks and $(…), not substitutions
          {
            echo "${summary}"
            echo
            if [ -n "${merged_layers}" ]; then
              echo 'Restack it first, cutting at the merged head its own commits sit on (as a rule the last one listed; `git log` shows it), or their changes join the squash:'
              echo
              echo '```bash'
              echo 'git fetch origin main'
              echo "git rebase --onto origin/main ${last_layer}"
              echo '```'
              echo
            fi
            if [ -n "${merged_layers}" ] && [ "${own}" -eq 0 ]; then
              echo 'Nothing is left of its own after that: close the pull request rather than squash.'
            else
              echo 'Squash them into one whose message is what `main` should keep:'
              echo
              echo '```bash'
              echo 'git fetch origin main'
              echo 'git reset --soft "$(git merge-base HEAD origin/main)"'
              echo 'git commit'
              echo '```'
              echo
              echo 'then force-push.'
            fi
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1

  # `.github/CODEOWNERS`, enforced here rather than by the ruleset's
  # `require_code_owner_review`: every changed path it gives owners needs its
  # author, and everyone who pushed to its branch, to be among them, or one of
  # them to have approved the head. The
  # ruleset's rule cannot tell the author apart — GitHub does not let an author
  # approve their own pull request — so under it the owner's own pull requests
  # merged only by a ruleset bypass, while what the file guards against is
  # someone else's: a bot's (`pnpm-update.yml` opens one queued, to auto-merge)
  # or a fork's. Why each path is listed is in the file.
  #
  # The file is read as the base branch has it, so a pull request cannot
  # rewrite the rules it is judged by. `pr-report-core` (`code-owners.mts`)
  # works out the same wait for the merge queue and the Pull Requests Manager,
  # from the `enforced-by:` line at the file's head, which names this job.
  #
  # An approval given after this ran does not re-run it: no event this
  # workflow can take carries a review (`pull_request_review` runs the pull
  # request's own copy of the workflow, which would let it judge itself).
  # `unblock-prs` re-runs the failed jobs of a queued pull request that has
  # since been approved; anything else is re-run by hand.
  code-owners:
    name: Validate code owners
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The file, the changed files and the reviews from the API, as the jobs
      # above read the commits: nothing from the pull request is checked out or
      # run. A rename counts from both ends, since moving a workflow away
      # changes what runs as surely as editing it.
      - name: Check that an owner wrote or approved every owned path
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          # How long to wait before reading the branch's pushes again.
          PUSHES_RETRY_SECONDS: '6'
        run: |
          fail() {
            echo "::error::${1}"
            printf '%s\n' "${1}" >>"${GITHUB_STEP_SUMMARY}"
            if [ -n "${2:-}" ]; then
              printf '%s' "${2}"
              {
                echo
                echo '```text'
                printf '%s' "${2}"
                echo '```'
              } >>"${GITHUB_STEP_SUMMARY}"
            fi
            exit 1
          }

          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/.github/CODEOWNERS?ref=${BASE_SHA}" --jq '.content' >codeowners.b64; then
            fail "Cannot read .github/CODEOWNERS at the base, ${BASE_SHA}."
          fi
          base64 -d codeowners.b64 >codeowners.txt

          # One rule per line: the pattern, then its owners as lower-case
          # logins. Only the shapes the file's header allows are read; any
          # other line makes the file unreadable here, which fails rather than
          # leaving its paths unowned.
          patterns=()
          owners=()
          unreadable=''
          # `|| [ -n … ]`: a last line with no newline after it is still a rule.
          while IFS= read -r line || [ -n "${line}" ]; do
            line="${line%%#*}"
            read -r -a fields <<<"${line}"
            [ "${#fields[@]}" -gt 0 ] || continue
            pattern="${fields[0]}"
            case "${pattern}" in
              /*[*?[\\!]* | /) unreadable="${unreadable}${line}"$'\n'; continue ;;
              /*) ;;
              *) unreadable="${unreadable}${line}"$'\n'; continue ;;
            esac
            list=''
            for owner in "${fields[@]:1}"; do
              case "${owner}" in
                @*/* | @ | [!@]*) unreadable="${unreadable}${line}"$'\n'; continue 2 ;;
              esac
              list="${list} ${owner#@}"
            done
            patterns+=("${pattern#/}")
            owners+=("$(printf '%s' "${list# }" | tr '[:upper:]' '[:lower:]')")
          done <codeowners.txt

          if [ -n "${unreadable}" ]; then
            # shellcheck disable=SC2016 # literal backticks, not command substitution
            fail '.github/CODEOWNERS has lines this check cannot read: a pattern must start with `/` and hold no wildcard, and an owner must be one `@login`.' "${unreadable}"
          fi

          # The owners of a path: those of the last pattern that matches it. A
          # pattern ending in `/` owns what is under it; any other owns itself
          # and what is under it, as `pr-report-core` reads it.
          owners_of() {
            local i match=''
            for i in "${!patterns[@]}"; do
              case "${patterns[i]}" in
                */) case "${1}" in "${patterns[i]}"*) match="${owners[i]}" ;; esac ;;
                *) case "${1}" in "${patterns[i]}" | "${patterns[i]}"/*) match="${owners[i]}" ;; esac ;;
              esac
            done
            printf '%s' "${match}"
          }

          # One line per changed file: its name, then a tab and its old name if
          # it was renamed. `@tsv` escapes a tab, a newline or a backslash in a
          # name, so that a line is exactly one file and the count below cannot
          # be padded by a name holding newlines. An escaped name still matches
          # what it did: no pattern this reads holds any of the three.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | [.filename, (.previous_filename // empty)] | @tsv' >changed-files.txt

          # The endpoint lists at most 3,000 files. Fewer than the pull request
          # changed would leave the rest unread, so that fails rather than
          # passes, and so does a count the payload did not carry.
          listed="$(wc -l <changed-files.txt)"
          case "${CHANGED_FILES}" in
            '' | *[!0-9]*)
              fail "The event carries no count of changed files (\"${CHANGED_FILES}\"), so whether the ${listed} listed are all of them cannot be told."
              ;;
          esac
          if [ "${listed}" -lt "${CHANGED_FILES}" ]; then
            fail "The pull request changes ${CHANGED_FILES} files and the API listed ${listed}, so whether an owned path is among them cannot be told."
          fi

          # Who approves: each reviewer's latest review that is not a comment,
          # as GitHub counts it, and as `pr-report-core` reads it. A push that
          # changes the diff dismisses an approval (the ruleset's
          # `dismiss_stale_reviews_on_push`), so one still standing is of what
          # the head holds; a rebase that changes nothing keeps it.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            --jq '.[] | select(.state != "COMMENTED" and .state != "PENDING") | [((.user.login // "") | ascii_downcase), .state] | join("\t")' >reviews.txt
          approved=' '
          while IFS=$'\t' read -r login state; do
            approved="${approved// "${login}" / }"
            if [ "${state}" = 'APPROVED' ]; then
              approved="${approved}${login} "
            fi
          done <reviews.txt

          author="$(printf '%s' "${AUTHOR}" | tr '[:upper:]' '[:lower:]')"

          # Who wrote the head: the author and everyone who pushed to the
          # branch. The author stands for a path they own only where every
          # writer owns it too; otherwise a commit another writer pushed to the
          # owner's branch would pass as the owner's — and one pushed and then
          # rewritten away still counts, since nothing here can tell what the
          # rewrite kept. Read from the repository's activity, which names each
          # push's actor (the timeline does not): every push since the branch
          # was last created, chained `before` to `after`, ending at the head.
          # One page is read, newest first, and replayed oldest first from the
          # last creation in it, as `readPushers` in `unblock-prs` reads it for
          # `pushersOf` in `pr-report-core`. Anything short of that leaves the
          # writers untold, and the author stands for nothing: a gap, an actor
          # missing, a creation older than that page or than the activity
          # GitHub keeps, or a fork's branch, whose pushes are not this
          # repository's. A push is recorded as it
          # lands, which can trail this event, so a chain short of the head is
          # read again a few times. Read once, and only for a path the author
          # owns that no owner has approved: nothing else depends on it.
          writers=''
          writers_read=false
          read_writers() {
            writers_read=true
            [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ] || return 0
            local attempt type before after actor chain pushers
            for attempt in 1 2 3 4 5; do
              if gh api -X GET "repos/${GITHUB_REPOSITORY}/activity" \
                -f ref="refs/heads/${HEAD_REF}" -f direction=desc -f per_page=100 \
                --jq 'reverse | .[] | [.activity_type, .before, .after, ((.actor.login // "") | ascii_downcase)] | @tsv' \
                </dev/null >activity.txt; then
                chain=''
                pushers=''
                while IFS=$'\t' read -r type before after actor; do
                  case "${type}" in
                    branch_creation)
                      if [ -n "${actor}" ]; then
                        chain="${after}" pushers="${actor}"
                      else
                        chain='untold' pushers=''
                      fi
                      ;;
                    branch_deletion) chain='' pushers='' ;;
                    push | force_push)
                      if [ -n "${chain}" ] && [ "${before}" = "${chain}" ] && [ -n "${actor}" ]; then
                        chain="${after}" pushers="${pushers} ${actor}"
                      else
                        chain='untold'
                      fi
                      ;;
                  esac
                done <activity.txt
                if [ -n "${pushers}" ] && [ "${chain}" = "${HEAD_SHA}" ]; then
                  writers="$(printf '%s %s' "${author}" "${pushers}" | tr -s ' ' '\n' | sort -u | tr '\n' ' ')"
                  writers="${writers# }"
                  return 0
                fi
              fi
              if [ "${attempt}" -lt 5 ]; then
                sleep "${PUSHES_RETRY_SECONDS}"
              fi
            done
          }

          waiting=''
          while IFS=$'\t' read -r name old_name; do
            for file in "${name}" "${old_name}"; do
              [ -n "${file}" ] || continue
              file_owners="$(owners_of "${file}")"
              [ -n "${file_owners}" ] || continue
              for owner in ${file_owners}; do
                case "${approved}" in *" ${owner} "*) continue 2 ;; esac
              done
              case " ${file_owners} " in
                *" ${author} "*)
                  [ "${writers_read}" = true ] || read_writers
                  if [ -n "${writers}" ]; then
                    every_writer_owns=true
                    for writer in ${writers}; do
                      case " ${file_owners} " in *" ${writer} "*) ;; *) every_writer_owns=false ;; esac
                    done
                    [ "${every_writer_owns}" = false ] || continue
                  fi
                  ;;
              esac
              waiting="${waiting}${file} (@${file_owners// / @})"$'\n'
            done
          done <changed-files.txt

          if [ -z "${waiting}" ]; then
            echo "Every owned path is approved by an owner, or owned by ${AUTHOR} and everyone who pushed to the branch."
            exit 0
          fi

          if [ "${writers_read}" = false ]; then
            pushed_by=''
          elif [ -n "${writers}" ]; then
            pushed_by=" ${AUTHOR} stands for a path they own only where everyone who pushed to the branch owns it too: it was written by ${writers% } (a push counts even once rewritten away)."
          else
            pushed_by=" ${AUTHOR} stands for a path they own only where everyone who pushed to the branch owns it too, and who did cannot be told."
          fi
          fail "No owner has approved these.${pushed_by} An owner's approval, then a re-run of this job, lets it merge:" "$(printf '%s' "${waiting}" | sort -u)"$'\n'
