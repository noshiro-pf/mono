name: Run Checks

# `/run-checks` commented on a pull request dispatches the five check
# workflows for its branch, draft or not. Those workflows skip draft pull
# requests at the job level but exempt `workflow_dispatch` — asking for the
# checks by hand is asking for them regardless of the pull request's state —
# and this makes that exemption reachable from the pull request page: one full
# CI result mid-draft, without marking the pull request ready for review.
#
# Two things follow from `issue_comment` being a default-branch event:
#
# - The copy of THIS file on main is what runs; edits to it take effect only
#   once merged.
# - The dispatched runs still execute each check workflow from the pull
#   request's branch, exactly as `workflow_dispatch` from the Actions tab
#   would.
#
# The dispatched runs attach their check runs to the branch's head commit, so
# they show up in the pull request's checks section. Marking the pull request
# ready for review afterwards re-runs everything via `ready_for_review`; a
# commit that had a manual run lists both runs, the same accepted duplication
# as toggling draft and ready.

on:
  issue_comment:
    types:
      - created

jobs:
  dispatch:
    # Pull request comments only (an issue has no branch to run on), the
    # command itself, and a commenter who could have dispatched the workflows
    # by hand. `author_association` arrives in the payload, so a comment that
    # does not match costs no runner and no API call.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/run-checks') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write # `gh workflow run`
      pull-requests: read # `gh pr view`
      issues: write # the acknowledging reaction on the comment

    steps:
      - name: Dispatch the check workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          pr="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --json state,isCrossRepository,headRefName)"

          state="$(jq -r '.state' <<<"${pr}")"
          if [ "${state}" != 'OPEN' ]; then
            echo "The pull request is ${state}; nothing to run."
            exit 0
          fi

          # A fork's branch is not in this repository, so there is nothing
          # here to dispatch on. Say so on the pull request rather than
          # failing: the commenter cannot fix it from that side.
          if [ "$(jq -r '.isCrossRepository' <<<"${pr}")" = 'true' ]; then
            gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body '`/run-checks` cannot dispatch onto a fork branch; push the branch to this repository instead.'
            exit 0
          fi

          branch="$(jq -r '.headRefName' <<<"${pr}")"

          for wf in \
            type-check.yml \
            style-check.yml \
            node-version-compatibility.yml \
            verify-published-packages.yml \
            backup-repository-settings.yml; do
            gh workflow run "${wf}" --repo "${GITHUB_REPOSITORY}" --ref "${branch}"
          done

          # The runs attach to the head commit within a few seconds, so the
          # pull request's checks section is the real feedback; the reaction
          # just confirms the command was seen.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            --field content=rocket
