name: Deploy Firestore rules

# Deploys the Firestore security rules and indexes of the apps in `TARGETS`
# when a push to main changes them. Their frontends are on GitHub Pages, which
# deploy-pages.yml publishes on the same push, so the rules go out alongside
# the code that relies on them, after their tests, rather than with the next
# version bump.
#
# `TARGETS` names each app and its Firebase project explicitly. The other
# `firebase.json` files in `apps/` belong to event-schedule-app, which
# deploy-event-schedule-app.yml deploys with its Hosting and Functions, to an
# app with real users whose deploys are still made by hand, or only redirect an
# old Hosting URL to Pages and are deployed once. Adding an app here deploys nothing until its
# rules next change; dispatch the workflow for it once.
#
# The rules tests (`check:test:rules`) of the apps to deploy run first, in a
# job that holds no key, and an app whose tests fail, or did not run, is not
# deployed. code-check.yml runs them on pull requests too, but nothing makes a
# push to main wait for that: a bypass merge, or a push whose checks are still
# running, would otherwise deploy rules that fail them. Such an app is deployed
# again when its rules next change; a fix elsewhere (the tests, a library the
# tests build) changes nothing the plan job compares, so dispatch the workflow
# for it once the fix has merged.
#
# The key is a Workload Identity Federation credential for a service account
# that may only replace rules and indexes. The provider admits this workflow
# on main only in the `firebase-deploy` environment, and only a token naming
# that environment may act as the service account; the setup is in
# docs/firestore-deploy.md.

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      app:
        description: The app whose rules and indexes to deploy as they are on the branch
        type: choice
        options:
          - algo-app
          - life-plan-simulator
          - task-manager

permissions: {}

env:
  # The `.firebaserc` of each app has to name the same project; the deploy job
  # checks. The `workflow_dispatch` options above list the same apps.
  # `rulesTests` says the app has a `check:test:rules` script, which the
  # test-rules job then has to pass; it is declared rather than looked up so
  # that a renamed script fails the job instead of deploying untested rules.
  TARGETS: >-
    [
      { "app": "algo-app", "project": "algo-app-45270", "rulesTests": false },
      { "app": "life-plan-simulator", "project": "life-plan-simulator-9eab3", "rulesTests": true },
      { "app": "task-manager", "project": "task-manager-app-d0cae", "rulesTests": true }
    ]

jobs:
  plan:
    name: Pick the apps to deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      targets: ${{ steps.pick.outputs.targets }}

    steps:
      # Only the history is read; no file in the tree is.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: .github/workflows

      # Compares the files themselves, not `version`: a library release bumps
      # every dependent app's version without touching its rules.
      - name: Pick the apps whose rules or indexes changed
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          APP: ${{ inputs.app }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            targets="$(jq -c --arg app "$APP" '[.[] | select(.app == $app)]' <<<"$TARGETS")"
            if [[ "$targets" == '[]' ]]; then
              echo "::error::${APP} is not in TARGETS."
              exit 1
            fi
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            # No previous commit to compare against: deploy everything.
            targets="$(jq -c '.' <<<"$TARGETS")"
          else
            git fetch --no-tags --depth=1 --filter=blob:none origin "$BEFORE"
            changed=()
            for app in $(jq -r '.[].app' <<<"$TARGETS"); do
              dir="apps/${app}"
              # 1 is "differs"; anything else is git failing, not a change.
              status=0
              git diff --quiet "$BEFORE" "$SHA" -- \
                "${dir}/firebase.json" \
                "${dir}/.firebaserc" \
                "${dir}/firestore.rules" \
                "${dir}/firestore.indexes.json" || status=$?
              case "$status" in
                0) ;;
                1) changed+=("$app") ;;
                *) exit "$status" ;;
              esac
            done
            targets="$(jq -c --args '[.[] | select(.app | IN($ARGS.positional[]))]' "${changed[@]}" <<<"$TARGETS")"
          fi

          echo "Deploying: ${targets}"
          echo "targets=${targets}" >>"${GITHUB_OUTPUT}"

  # Holds no key: it installs and builds the workspace and runs its code, which
  # is what the job split in .github/workflows/README.md keeps away from the
  # deploy job. Its output is the names of the apps whose tests passed, or that
  # have none (algo-app). Each deploy job reads it only to stand down when its
  # app is missing, so one app's failing tests hold back that app alone, and
  # what this job writes can only narrow the plan, never add to it. The job
  # still fails, to show it.
  test-rules:
    name: Test the rules
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      passed: ${{ steps.test.outputs.passed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # A run for apps with no rules tests installs and builds nothing.
      - name: Find the apps with rules tests
        id: find
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          set -euo pipefail
          # `rulesTests` has to be a boolean that agrees with the app's
          # `package.json`, so that neither a missing key nor a new script
          # leaves an app untested.
          for app in $(jq -r '.[].app' <<<"$TARGETS"); do
            declared="$(jq -r --arg app "$app" '.[] | select(.app == $app) | .rulesTests | if type == "boolean" then . else "missing" end' <<<"$TARGETS")"
            present="$(jq -r '.scripts["check:test:rules"] != null' "apps/${app}/package.json")"
            if [[ "$declared" != "$present" ]]; then
              echo "::error::TARGETS declares rulesTests ${declared} for ${app}, but its package.json has check:test:rules: ${present}."
              exit 1
            fi
            if [[ "$declared" == 'false' ]]; then
              echo "::notice::${app} has no rules tests to run."
            fi
          done
          tested="$(jq -r '[.[] | select(.rulesTests) | .app] | join(" ")' <<<"$TARGETS")"
          echo "Tested: ${tested}"
          echo "tested=${tested}" >>"${GITHUB_OUTPUT}"

      - name: Set up pnpm, Node.js and the dependencies
        if: steps.find.outputs.tested != ''
        uses: $/.github/actions/setup

      # The Firestore emulator needs Java 21 or later. firebase-tools is a
      # catalog-pinned dependency of each app; no Firebase login is needed.
      - name: Set up Java for the Firestore emulator
        if: steps.find.outputs.tested != ''
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The tests resolve the workspace libraries from their `dist/`.
      - name: Build the workspace libraries
        if: steps.find.outputs.tested != ''
        run: pnpm run ws:build:deps

      # Exits 0 whatever the tests do, so that its output reaches the deploy
      # jobs; the next step fails the job when any app failed.
      - name: Run the rules tests
        id: test
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          TESTED: ${{ steps.find.outputs.tested }}
        run: |
          set -euo pipefail
          read -r -a tested <<<"$TESTED"
          failed=()
          for app in "${tested[@]}"; do
            if ! pnpm --dir "apps/${app}" run check:test:rules; then
              echo "::error::The rules tests of ${app} failed; it is not deployed."
              failed+=("$app")
            fi
          done
          passed="$(jq -c --args '[.[].app | select(IN($ARGS.positional[]) | not)]' "${failed[@]}" <<<"$TARGETS")"
          echo "Passed: ${passed}"
          echo "passed=${passed}" >>"${GITHUB_OUTPUT}"
          echo "failed=${failed[*]}" >>"${GITHUB_OUTPUT}"

      - name: Fail when any app's rules tests failed
        if: steps.test.outputs.failed != ''
        env:
          FAILED: ${{ steps.test.outputs.failed }}
        run: |
          echo "::error::Not deployed: ${FAILED}. A fix that does not change the rules files deploys nothing; dispatch the workflow for each app once it has merged."
          exit 1

  deploy:
    name: Deploy ${{ matrix.app }}
    needs:
      - plan
      - test-rules
    # `!cancelled()`, because the test job fails when any app's tests failed
    # and the others still deploy; the first step below stands down for an app
    # that did not pass.
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}

    # One deploy per project at a time, and never cancelled halfway. Jobs enter
    # the group in the order the jobs they need finish, not the order of the
    # pushes, so a job can start after a newer push's job has deployed; the
    # first step below makes that job stand down rather than deploy older rules.
    concurrency:
      group: deploy-firestore-${{ matrix.project }}
      cancel-in-progress: false

    # Limited to main. The Workload Identity provider also requires this name
    # in the token, so a run without it gets no credential.
    environment:
      name: firebase-deploy
      url: https://console.firebase.google.com/project/${{ matrix.project }}/firestore/rules

    permissions:
      contents: read
      id-token: write # to exchange for the service account's credential

    # A rules deploy builds nothing, so the job installs the one app with its
    # install scripts off and runs nothing from what that brings but
    # firebase-tools, the tool that uses the key. Its version, and that of
    # everything it depends on, comes from `pnpm-lock.yaml` (the `catalog:`
    # entry), held to `minimumReleaseAge` and moved by pnpm-update.yml.
    steps:
      # The test job's output is read as data, and only to stand down. It is
      # empty when that job failed before the tests ran, and then no app
      # deploys.
      - name: Check that the rules tests passed
        id: tested
        env:
          APP: ${{ matrix.app }}
          PASSED: ${{ needs.test-rules.outputs.passed }}
        run: |
          set -euo pipefail
          if jq -e --arg app "$APP" 'type == "array" and index($app) != null' <<<"${PASSED:-null}" >/dev/null 2>&1; then
            echo 'passed=true' >>"${GITHUB_OUTPUT}"
          else
            echo "::warning::${APP} is not deployed: its rules tests did not pass in this run. Dispatch the workflow for it once the fix has merged."
            echo 'passed=false' >>"${GITHUB_OUTPUT}"
          fi

      - name: Checkout
        if: steps.tested.outputs.passed == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # If main has moved on and changed this app's files since this run's
      # commit, a later run has this app in its matrix and deploys the newer
      # files once they pass their tests, before or after this job. Deploying
      # here could only put the older ones back.
      - name: Check that main has not changed the files since
        id: current
        if: steps.tested.outputs.passed == 'true'
        env:
          DIR: apps/${{ matrix.app }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          status=0
          git diff --quiet "$SHA" FETCH_HEAD -- \
            "${DIR}/firebase.json" \
            "${DIR}/.firebaserc" \
            "${DIR}/firestore.rules" \
            "${DIR}/firestore.indexes.json" || status=$?
          case "$status" in
            0) echo 'current=true' >>"${GITHUB_OUTPUT}" ;;
            1)
              echo "::notice::main has changed ${DIR} since ${SHA}; the run for that change deploys it if its rules tests pass, and if they fail, dispatch the workflow for it once the fix has merged."
              echo 'current=false' >>"${GITHUB_OUTPUT}"
              ;;
            *) exit "$status" ;;
          esac

      # `install: false`: the step below installs the one app, not the
      # workspace.
      - name: Set up pnpm and Node.js
        if: steps.current.outputs.current == 'true'
        uses: $/.github/actions/setup
        with:
          install: false

      - name: Install firebase-tools
        if: steps.current.outputs.current == 'true'
        env:
          DIR: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --filter "./${DIR}"
          "${DIR}/node_modules/.bin/firebase" --version

      # `firebase deploy` runs any `predeploy` / `postdeploy` command the
      # config names, which would run the tree with the key in hand.
      - name: Check the Firebase config
        if: steps.current.outputs.current == 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          default="$(jq -r '.projects.default' .firebaserc)"
          if [[ "$default" != "$PROJECT" ]]; then
            echo "::error::.firebaserc names ${default}, but TARGETS names ${PROJECT}."
            exit 1
          fi
          if jq -e '[.. | objects | keys[]] | any(. == "predeploy" or . == "postdeploy")' firebase.json >/dev/null; then
            echo '::error::firebase.json names a predeploy or postdeploy hook.'
            exit 1
          fi

      # The two variables hold the values docs/firestore-deploy.md sets up. An
      # empty one would otherwise surface as the auth action's own complaint
      # about its inputs.
      - name: Check the Google Cloud variables
        if: steps.current.outputs.current == 'true'
        env:
          PROVIDER: ${{ vars.FIREBASE_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "$PROVIDER" || -z "$SERVICE_ACCOUNT" ]]; then
            echo '::error::FIREBASE_DEPLOY_WORKLOAD_IDENTITY_PROVIDER and FIREBASE_DEPLOY_SERVICE_ACCOUNT have to be set; see docs/firestore-deploy.md.'
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: steps.current.outputs.current == 'true'
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.FIREBASE_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      # Without `--force`, indexes deployed by hand and missing from
      # `firestore.indexes.json` are reported and kept, not deleted.
      - name: Deploy the rules and indexes
        if: steps.current.outputs.current == 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          PROJECT: ${{ matrix.project }}
        # The binary itself, not `pnpm exec`: pnpm installs the whole workspace,
        # install scripts included, before running anything when it finds
        # `node_modules` incomplete, which a filtered install leaves it.
        run: ./node_modules/.bin/firebase deploy --only firestore --project "$PROJECT" --non-interactive
