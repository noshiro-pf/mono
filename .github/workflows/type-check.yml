name: Type Check

on:
  push:
    branches-ignore:
      # `archive/**` holds frozen snapshots of retired work. They are never
      # merged back, so every check on them is wasted CI.
      - 'archive/**'

  # `Check for a draft pull request` below skips the work while the pull
  # request is a draft, and the job still reports — so without this trigger the
  # required checks would sit green on a branch nothing has checked, and
  # marking the pull request ready for review, which is not a push, would not
  # re-run them. This is what runs them for real.
  pull_request:
    types:
      - ready_for_review

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # The matrix entries are independent checks. Letting one cancel the
      # others hides their results and, since most of them are required
      # status checks, blocks the pull request on an unrelated failure.
      fail-fast: false
      matrix:
        command:
          - check:root
          - ws:type-check
          - ws:lint:fix
          - ws:test:browser
          - ws:test:cov
          - codemod:full
          - knip
          - lint:published-deps
          - verify:npm-packages

    steps:
      # A draft pull request is work in progress, so everything below is
      # skipped until it is marked ready for review. A `push` event carries no
      # pull request context — the branch is all it knows — so ask the API
      # whether the open pull request for that branch is a draft.
      #
      # This runs first, before the checkout: every other step hangs off it, so
      # a push to a draft costs one API call rather than an install and a
      # build. The job itself still runs and still reports, for the same reason
      # nothing here uses `paths-ignore` — these are required status checks,
      # and a job that never reports leaves the pull request waiting on a check
      # that will never arrive.
      - name: Check for a draft pull request
        id: check_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # `workflow_dispatch` is someone asking for the checks explicitly,
          # and `pull_request` only fires here on `ready_for_review`, which is
          # the moment the draft stopped being one.
          if [ "${EVENT_NAME}" != 'push' ] || [ "${GITHUB_REF_NAME}" = 'main' ]; then
            exit 0
          fi

          # Every open pull request whose head is this branch has to be a
          # draft. `none` — no pull request yet — runs the checks: the branch
          # may never get one, and nothing would re-run them if it did, since
          # opening a pull request is not a push.
          jq_filter='if length == 0 then "none" elif all(.[]; .isDraft) then "true" else "false" end'

          # Fail open. A pull request that cannot be read is not a draft as far
          # as this gate is concerned; running the checks anyway is the
          # harmless half of being wrong.
          if ! is_draft="$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --head "${GITHUB_REF_NAME}" --state open --json isDraft \
            --jq "${jq_filter}")"; then
            echo 'Could not read the pull requests for this branch; running the checks.'
            exit 0
          fi

          if [ "${is_draft}" = 'true' ]; then
            echo 'is_draft=true' >>"${GITHUB_OUTPUT}"
            echo 'This branch has a draft pull request; skipping. Mark it ready for review to run the checks.'
          fi

      - name: Checkout
        if: steps.check_draft.outputs.is_draft != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event, so a `ready_for_review` run checks exactly
          # what a push to this branch would have.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch main
        if: steps.check_draft.outputs.is_draft != 'true'
        run: git fetch origin main # To allow the diff gate below to get the diff from main

      - name: Install pnpm
        if: steps.check_draft.outputs.is_draft != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        if: steps.check_draft.outputs.is_draft != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check_draft.outputs.is_draft != 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: To include this workflow in the branch protection rule status check,
      # skip each step instead of skipping the entire workflow with paths-ignore.
      - name: Check diff
        id: check_diff_type
        if: steps.check_draft.outputs.is_draft != 'true'
        # `z:check-should-run:code-checks` names the paths that no check in
        # this workflow looks at — `experimental/`, prose, and the style
        # tools' own configuration — and reports `should_run=false` when the
        # diff touches nothing else. The list lives in the root package.json
        # so that this workflow and node-version-compatibility.yml cannot
        # drift apart. Anything a check here *does* look at — a source file,
        # a lockfile, a workflow — is absent from that list, so it runs.
        #
        # It diffs against origin/main. On a push to main that is a diff
        # against HEAD itself, which comes back empty and reads as "nothing
        # relevant changed" — so every step below skips, the coverage upload
        # among them, and the job still reports success. Compare with what
        # main pointed at before the push instead.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run z:check-should-run:code-checks
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run z:check-should-run:code-checks --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi

      # `run: exit 0` ends the step, not the job — every step below has to
      # carry the condition itself. See node-version-compatibility.yml, which
      # has always done it this way.
      # `ws:test:cov` needs a browser too: the synstate adapters' hooks only
      # run in one, so their coverage would otherwise be reported as zero.
      - name: Install Playwright Browsers
        if: steps.check_diff_type.outputs.should_run == 'true' && (matrix.command == 'ws:test:browser' || matrix.command == 'ws:test:cov')
        run: pnpm exec playwright install chromium

      - name: Build all packages
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ws:build

      # The browser tests used to be wrapped in a two-attempt retry, because
      # one file at a time would fail to load. The cause was Vite optimizing a
      # dependency mid-run and reloading the page; naming those dependencies in
      # each package's `optimizeDepsInclude` removed it, so a failure here is
      # now a failure rather than something to try again.
      - name: Run "${{ matrix.command }}"
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run z:assert-repo-is-clean

      - name: Upload coverage reports to Codecov
        if: steps.check_diff_type.outputs.should_run == 'true' && matrix.command == 'ws:test:cov'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
