name: Type Check

on:
  push:
    branches-ignore:
      # `archive/**` holds frozen snapshots of retired work. They are never
      # merged back, so every check on them is wasted CI.
      - 'archive/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # The matrix entries are independent checks. Letting one cancel the
      # others hides their results and, since most of them are required
      # status checks, blocks the pull request on an unrelated failure.
      fail-fast: false
      matrix:
        command:
          - check:root
          - ws:type-check
          - ws:lint:fix
          - ws:test:browser
          - ws:test:cov
          - codemod:full
          - knip
          - lint:published-deps
          - verify:npm-packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch main
        run: git fetch origin main # To allow check-should-run-type-checks to get the diff from main

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: To include this workflow in the branch protection rule status check,
      # skip each step instead of skipping the entire workflow with paths-ignore.
      - name: Check diff
        id: check_diff_type
        # `check-should-run-type-checks` diffs against origin/main. On a push
        # to main that is a diff against HEAD itself, which comes back empty
        # and reads as "nothing relevant changed" — so every step below skips,
        # the coverage upload among them, and the job still reports success.
        # Compare with what main pointed at before the push instead.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run z:check-should-run-type-checks
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run z:check-should-run-type-checks --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi

      # `run: exit 0` ends the step, not the job — every step below has to
      # carry the condition itself. See node-version-compatibility.yml, which
      # has always done it this way.
      - name: Install Playwright Browsers
        if: steps.check_diff_type.outputs.should_run == 'true' && matrix.command == 'ws:test:browser'
        run: pnpm exec playwright install chromium

      - name: Build all packages
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ws:build

      - name: Run "${{ matrix.command }}"
        if: steps.check_diff_type.outputs.should_run == 'true' && matrix.command != 'ws:test:browser'
        run: pnpm run ${{ matrix.command }}

      # Source - https://stackoverflow.com/a/71583518
      - name: Run 'ws:test:browser' with retry
        if: steps.check_diff_type.outputs.should_run == 'true' && matrix.command == 'ws:test:browser'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run z:assert-repo-is-clean

      - name: Upload coverage reports to Codecov
        if: steps.check_diff_type.outputs.should_run == 'true' && matrix.command == 'ws:test:cov'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
