name: Type Check

on:
  # Only main. Pull request branches are covered by the `pull_request` events
  # below — running both event kinds would list every check twice on the pull
  # request. The merge queue tested the exact commit that lands, so this run
  # is a belt-and-braces re-check of main's actual state; it is also what
  # uploads coverage for main and what anchors `github.event.before` for the
  # next push's diff gate. (The `main` ruleset allows no other way onto the
  # branch, so a push to main and a queue merge are the same event.)
  push:
    branches:
      - main

  # `synchronize` fires on every push to the pull request's branch, so these
  # four types cover the pull request's whole life. While it is a draft the
  # job-level `if` below skips the run; `ready_for_review` is what runs the
  # checks for real once it stops being one. No `paths` filter here, for the
  # same reason the steps are gated one at a time — see the `Check diff` step.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # The merge queue's runs. The queue builds a `gh-readonly-queue/main/*`
  # commit — main's tip plus the queued pull requests, combined with the
  # squash method — and every required check has to pass on it before it is
  # pushed to main. A workflow without this trigger never reports there, and
  # the queue entry would time out waiting.
  merge_group:
    types:
      - checks_requested

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  type-check:
    # A draft pull request is work in progress: skip the whole job, before a
    # runner is even booted — a job-level `if` is evaluated by GitHub itself,
    # and the draft flag arrives in the event payload, so this costs nothing.
    # The skipped conclusion would satisfy a required status check, but a
    # draft cannot be merged or queued anyway, and marking it ready for review
    # fires the `ready_for_review` run above, whose checks take over.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # The matrix entries are independent checks. Letting one cancel the
      # others hides their results and, since most of them are required
      # status checks, blocks the pull request on an unrelated failure.
      fail-fast: false
      matrix:
        command:
          - check:root
          # `strict-lib/` is a directory, not a workspace member, so the `ws:*`
          # entries never reach its generator or scripts.
          - strict-lib:type-check
          - strict-lib:lint
          - ws:type-check
          - ws:lint:fix
          - ws:test:browser
          - ws:test:cov
          - codemod:full
          - knip
          - lint:published-deps
          - verify:npm-packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event: these checks assert properties of the branch
          # itself, and the merge ref does not even exist while the pull
          # request has a conflict. On a push or `merge_group` event this
          # falls back to `github.sha` — the pushed commit, or the queue's
          # merge-group commit, which is exactly what has to be checked there.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch main
        run: git fetch origin main # To allow the diff gate below to get the diff from main

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: To include this workflow in the branch protection rule status check,
      # skip each step instead of skipping the entire workflow with paths-ignore.
      - name: Check diff
        id: check_diff_type
        # `z:check-should-run:code-checks` names the paths that no check in
        # this workflow looks at — `experimental/`, prose, and the style
        # tools' own configuration — and reports `should_run=false` when the
        # diff touches nothing else. The list lives in the root package.json
        # so that this workflow and node-version-compatibility.yml cannot
        # drift apart. Anything a check here *does* look at — a source file,
        # a lockfile, a workflow — is absent from that list, so it runs.
        #
        # It diffs against origin/main. On a merge-group ref, whose parent is
        # main's tip, that is the union of the queued pull requests' changes —
        # the right thing to gate the group's checks on. On a push to main it
        # is a diff against HEAD itself, which comes back empty and reads as
        # "nothing relevant changed" — so every step below skips, the coverage
        # upload among them, and the job still reports success. Compare with
        # what main pointed at before the push instead.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run z:check-should-run:code-checks
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run z:check-should-run:code-checks --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi

      # `run: exit 0` ends the step, not the job — every step below has to
      # carry the condition itself. See node-version-compatibility.yml, which
      # has always done it this way.
      # `ws:test:cov` needs a browser too: the synstate adapters' hooks only
      # run in one, so their coverage would otherwise be reported as zero.
      - name: Install Playwright Browsers
        if: steps.check_diff_type.outputs.should_run == 'true' && (matrix.command == 'ws:test:browser' || matrix.command == 'ws:test:cov')
        run: pnpm exec playwright install chromium

      - name: Build all packages
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ws:build

      # The browser tests used to be wrapped in a two-attempt retry, because
      # one file at a time would fail to load. The cause was Vite optimizing a
      # dependency mid-run and reloading the page; naming those dependencies in
      # each package's `optimizeDepsInclude` removed it, so a failure here is
      # now a failure rather than something to try again.
      - name: Run "${{ matrix.command }}"
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run z:assert-repo-is-clean

      - name: Upload coverage reports to Codecov
        if: steps.check_diff_type.outputs.should_run == 'true' && matrix.command == 'ws:test:cov'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
