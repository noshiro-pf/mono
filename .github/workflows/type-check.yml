name: Type Check

on:
  # Only main. Pull request branches are covered by the `pull_request` events
  # below — running both event kinds would list every check twice on the pull
  # request. What this run adds is a check on what actually landed: a squash
  # merge makes a new commit that no pull request run has seen. (The `main`
  # ruleset allows no other way onto the branch, so a push to main and a merge
  # are the same event.)
  push:
    branches:
      - main

  # `synchronize` fires on every push to the pull request's branch, so these
  # types cover the pull request's whole life — a draft included. A draft is
  # checked like anything else: work in progress is exactly where a CI result
  # is worth having, and the two mechanisms below are what keep that from
  # being expensive. `labeled` / `unlabeled` are here so that adding `[WIP]`
  # stops the checks and taking it off starts them again; `ready_for_review`
  # is kept as a re-run for a pull request that was opened as a draft before
  # this arrangement existed. No `paths` filter here, for the same reason the
  # steps are gated one at a time — see the `Check diff` step.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# One run per pull request: a push cancels the run still going for the
# previous one, which is what makes a branch pushed to five times in a row
# cost one CI result rather than five. Nothing is lost by that on a pull
# request branch — the `Check diff` gate below diffs against `origin/main`,
# so the newer run covers every commit the cancelled one would have.
#
# `cancel-in-progress` is deliberately an expression rather than a bare
# `true`. On `main` that same gate diffs against `github.event.before`, so
# each push's run covers only that push: cancelling the run for X when Y
# lands would leave the diff X introduced checked by nothing at all. Pushes
# to `main` therefore run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Is the branch up to date with `main`? A job of its own because the answer
  # takes an API call, which a job-level `if` cannot make, and because a step
  # cannot skip the job it is in — see branch-up-to-date.yml. It carries the
  # `[WIP]` condition as well, so a labelled pull request costs no runner
  # anywhere: this job is skipped, and the one below it with it.
  branch-up-to-date:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, '[WIP]')
    uses: ./.github/workflows/branch-up-to-date.yml

  type-check:
    needs: branch-up-to-date
    # Two states are not worth a CI run, and both skip the whole job before a
    # runner is even booted — a job-level `if` is evaluated by GitHub itself.
    #
    # - A `[WIP]` label on the pull request says its author does not want the
    #   checks yet. Labels arrive in the event payload, so this costs
    #   nothing, and taking the label off fires `unlabeled`, which runs
    #   everything again. Being a draft is deliberately NOT one of these
    #   states any more — a draft is where a CI result is most useful.
    # - A branch behind `main` is the "This branch is out-of-date with the
    #   base branch" state: it cannot be merged, and the update that clears it
    #   fires `synchronize` and runs everything again — on the commit that
    #   will actually be merged, which this one is not.
    #
    # The skipped conclusion satisfies a required status check in both cases.
    # For an out-of-date branch the ruleset's
    # `strict_required_status_checks_policy` still holds the merge. `[WIP]`
    # holds nothing — GitHub has no label-based merge block — so it is a
    # label to take off before merging rather than a guard rail, which is the
    # one thing it does less well than the draft flag it replaces.
    #
    # `!cancelled()` and `!= 'false'` rather than `== 'true'`, because a gate
    # that failed to answer leaves `should_run` empty: failing open costs a CI
    # run, failing closed would skip every check on the pull request while
    # reporting the required ones as satisfied. The `[WIP]` condition is
    # repeated here because `!cancelled()` also lifts the automatic skip that
    # a skipped dependency would otherwise give us.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.branch-up-to-date.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # The matrix entries are independent checks. Letting one cancel the
      # others hides their results and, since most of them are required
      # status checks, blocks the pull request on an unrelated failure.
      fail-fast: false
      matrix:
        command:
          - check:root
          # `strict-lib/` is a directory, not a workspace member, so the `ws:*`
          # entries never reach its generator or scripts.
          - strict-lib:type-check
          - strict-lib:lint
          - ws:type-check
          - ws:lint:fix
          - ws:test:browser
          - ws:test:cov
          - codemod:full
          - knip
          - lint:published-deps
          - verify:npm-packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event: these checks assert properties of the branch
          # itself, and the merge ref does not even exist while the pull
          # request has a conflict. On a push event this falls back to the
          # pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch main
        run: git fetch origin main # To allow the diff gate below to get the diff from main

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          registry-url: https://npm.pkg.github.com/
          scope: '@noshiro-pf'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: To include this workflow in the branch protection rule status check,
      # skip each step instead of skipping the entire workflow with paths-ignore.
      - name: Check diff
        id: check_diff_type
        # `z:check-should-run:code-checks` names the paths that no check in
        # this workflow looks at — `experimental/`, prose, and the style
        # tools' own configuration — and reports `should_run=false` when the
        # diff touches nothing else. The list lives in the root package.json
        # so that this workflow and node-version-compatibility.yml cannot
        # drift apart. Anything a check here *does* look at — a source file,
        # a lockfile, a workflow — is absent from that list, so it runs.
        #
        # It diffs against origin/main. On a push to main that is a diff
        # against HEAD itself, which comes back empty and reads as "nothing
        # relevant changed" — so every step below skips, the coverage upload
        # among them, and the job still reports success. Compare with what
        # main pointed at before the push instead.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            pnpm run z:check-should-run:code-checks
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ]; then
            git fetch --depth=1 origin "${BEFORE}"
            pnpm run z:check-should-run:code-checks --base-branch "${BEFORE}"
          else
            # A manual run, or the first push to the branch: there is nothing
            # to compare against, so run everything rather than skip it.
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          fi

      # `run: exit 0` ends the step, not the job — every step below has to
      # carry the condition itself. See node-version-compatibility.yml, which
      # has always done it this way.
      # `ws:test:cov` needs a browser too: the synstate adapters' hooks only
      # run in one, so their coverage would otherwise be reported as zero.
      - name: Install Playwright Browsers
        if: steps.check_diff_type.outputs.should_run == 'true' && (matrix.command == 'ws:test:browser' || matrix.command == 'ws:test:cov')
        run: pnpm exec playwright install chromium

      - name: Build all packages
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ws:build

      # The browser tests used to be wrapped in a two-attempt retry, because
      # one file at a time would fail to load. The cause was Vite optimizing a
      # dependency mid-run and reloading the page; naming those dependencies in
      # each package's `optimizeDepsInclude` removed it, so a failure here is
      # now a failure rather than something to try again.
      - name: Run "${{ matrix.command }}"
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run ${{ matrix.command }}

      - name: Check if there is no file diff
        if: steps.check_diff_type.outputs.should_run == 'true'
        run: pnpm run z:assert-repo-is-clean

      - name: Upload coverage reports to Codecov
        if: steps.check_diff_type.outputs.should_run == 'true' && matrix.command == 'ws:test:cov'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0

  # The one required status check for this workflow. Everything above still
  # reports its own check run and is still worth reading, but none of them is
  # required any more, because a required context can be satisfied by a run
  # that never happened. Two ways, both measured on this repository:
  #
  # - A job GitHub skips produces exactly one check run, named after the
  #   *job* (`type-check`) — never the matrix contexts
  #   (`type-check (check:root)`, …). Those contexts are not superseded, so
  #   they keep whatever they last said on that commit: a green from an
  #   earlier run stays green, and the pull request reads as fully checked
  #   while nothing ran.
  # - A skipped job whose check run name *is* the required context — a job
  #   with no matrix, as `verify-published` and `backup-repository-settings`
  #   are — reports `skipped`, and GitHub counts a skipped required check as
  #   satisfied.
  #
  # This job closes both. Its name does not depend on a matrix, so every run
  # supersedes the last, and `if: always()` means it reports whatever
  # happened above rather than being skipped along with it. "Skipped" cannot
  # be read as "passed" here.
  type-check-result:
    needs:
      - branch-up-to-date
      - type-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the checks above to have passed
        env:
          # Empty when the gate was skipped (`[WIP]`) or failed to answer.
          SHOULD_RUN: ${{ needs.branch-up-to-date.outputs.should_run }}
          RESULT: ${{ needs.type-check.result }}
        run: |
          # The one skip that is not a failure. A branch behind `main` cannot
          # be merged as it stands — `strict_required_status_checks_policy`
          # holds it — and the update that clears it runs everything again on
          # the commit that will actually be merged. Every other non-success,
          # `[WIP]` included, means the checks did not run on this head and
          # must not read as passing.
          if [ "${SHOULD_RUN}" = 'false' ]; then
            echo 'The branch is behind the base branch, so the checks were skipped. They run again once it is updated.'
            exit 0
          fi

          if [ "${RESULT}" = 'success' ]; then
            echo 'The checks passed.'
            exit 0
          fi

          summary="The checks did not pass on this commit (result: ${RESULT}). A \`[WIP]\` label skips them; take the label off to run them."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1
