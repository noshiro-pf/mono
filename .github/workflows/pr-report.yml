# cspell:ignore ededed

name: PR Report

# Writes the state of every open pull request — the order they declare with
# `Merge-After:`, the issues they close, their labels, the verdict of the
# checks the ruleset requires, and how far each branch is from `main` — into
# one issue, updated in place.
#
# An issue rather than a comment or a new issue each time, because the report
# is a *current state*, not an event: editing a body notifies nobody and
# leaves no timeline, so the link keeps pointing at the truth and the
# repository stays quiet. The run's own summary carries the same text, for
# reading a single run without leaving the Actions tab.
#
# `pnpm run pr-report` is the whole of it. Everything this workflow adds is
# where the text goes, so the same report can be had locally, or by an agent,
# with no GitHub UI involved.
#
# The same run also writes a machine-readable copy of the report to a branch
# of its own, which is what the GitHub Pull Requests Manager page reads
# (`apps/pr-manager-app`). One run, two outputs — `--payload-file` beside
# `--format markdown` — so the issue and the page can never be describing
# moments that differ by whatever happened between two runs. See
# `apps/pr-report-payload/README.md` for why a branch rather than the issue
# body this used to be embedded in.

# The events are pings, not input: nothing from a payload reaches the job,
# which re-reads every pull request from the API each time. So the trigger
# list is only the question "what can change the report", and the answer is
# the pull requests themselves, `main` moving under all of them, and time.
on:
  # `pull_request_target`, not `pull_request`, for two reasons that both
  # matter. A `pull_request` run from a fork gets a read-only token whatever
  # `permissions:` below says, so the `gh issue edit` would fail — silently,
  # as far as the report's readers are concerned, since the issue would simply
  # stop changing. And `pull_request` resolves the workflow file, and the
  # checkout, from the pull request's own head: the branch being reported on
  # would be the branch supplying the reporter. The usual hazard of
  # `pull_request_target` is answered at the checkout step below.
  pull_request_target:
    types:
      # Membership of the list.
      - opened
      - reopened
      - closed
      # The title, and the body the `Merge-After:` trailer and the closing
      # keywords are read from.
      - edited
      # `skip-ci` and `merge-queued`, which are what the `paused` and `queued`
      # verdicts are.
      - labeled
      - unlabeled
      # A new head: ahead / behind, and every check verdict, start over.
      - synchronize
      # The report counts drafts.
      - ready_for_review
      - converted_to_draft

  push:
    # A merge — or anything else reaching `main` — moves the base under every
    # open pull request at once, which is the one change no `pull_request`
    # event reports. No `paths:` filter: any commit at all changes the ahead /
    # behind of all of them.
    branches:
      - main

  # A check finishing is the other thing that changes the report, and for a
  # long time it raised no event this workflow could hear. `check_suite` is
  # the obvious candidate and is the wrong one — GitHub does not trigger a
  # workflow with it when the suite is GitHub Actions' own, which here is all
  # of them. `workflow_run` does fire, for each workflow named below, whatever
  # triggered that workflow's own run.
  #
  # The list is the workflows behind the nine contexts
  # `repo-settings/rulesets/main.json` requires, which are the verdicts the
  # report states. **A workflow added there has to be added here too**, or its
  # result reaches the report only at the next pull request event or at the
  # schedule below; `pnpm run check:root:workflow-run-names` checks that every
  # name here is a workflow that exists, which is the half of that a script
  # can decide.
  #
  # Seven of these finish within seconds of one another, so this arrives in
  # bursts. The concurrency group below is what makes that affordable: the
  # same collapse that debounces a run of label events debounces this, leaving
  # one run writing and one queued behind it.
  workflow_run:
    workflows:
      - Code Check
      - Style Check
      - Strict Lib Generation
      - Node.js Version Compatibility
      - Verify Published Packages
      - Skip CI Label
      - Lint Pull Request
    types:
      - completed

  schedule:
    # 07:00 JST, as the floor rather than the whole of it. The `workflow_run`
    # block above covers the checks this repository runs; anything that reports
    # a status without an Actions workflow behind it would still land here
    # first. A scheduled workflow runs on the default branch, and GitHub
    # disables one in a repository that has been idle for 60 days.
    - cron: '0 22 * * *'

  workflow_dispatch:

# Deny by default; each job grants back what it needs. The split below is
# what this is in aid of.
permissions: {}

concurrency:
  # One issue, one writer: every run of this workflow edits the same body, so
  # they queue behind one another globally rather than per pull request.
  #
  # Not `cancel-in-progress`, even though a later run does supersede an earlier
  # one here. GitHub already collapses a burst: when a run is queued behind a
  # running one, any run that was *already* queued in the group is cancelled,
  # so a stream of events leaves one running plus the newest pending and drops
  # everything between. That is the debounce this wants, and it cannot starve —
  # whereas cancelling the in-progress run would let a steady trickle of events
  # keep killing the run that was about to write. The cost is one extra
  # completed run per burst, whose body the pending one overwrites seconds
  # later.
  group: pr-report
  cancel-in-progress: false

jobs:
  # Runs the dependency tree, and holds nothing. Everything this job produces
  # leaves as an artifact.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This is where `pull_request_target`'s hazard — a job that installs
          # and runs the tree it checked out — is answered. The event's own
          # ref is the pull request's *base*, which is not necessarily `main`:
          # a chained pull request's base is another branch, and running that
          # branch's `pr-report` and lockfile is the thing being avoided.
          # Pinning to the default branch also makes
          # `repo-settings/rulesets/main.json` — desired state, which a pull
          # request may be in the middle of changing — read from the one copy
          # that decides.
          #
          # Empty is `actions/checkout`'s own default, so every other event
          # keeps checking out the ref it was raised on; a `workflow_dispatch`
          # from a branch is how a change to this workflow gets tried out.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      # The script runs from source through `tsx`, so nothing has to be built.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One run, both outputs. A second run for the payload would cost another
      # twenty requests and another minute, and would describe a different
      # moment from the Markdown.
      - name: Generate the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/report"
          pnpm run pr-report -- \
            --format markdown \
            --payload-file "${RUNNER_TEMP}/report/pr-report.json" \
            > "${RUNNER_TEMP}/report/pr-report.md"

      - name: Add it to the run summary
        run: cat "${RUNNER_TEMP}/report/pr-report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Hand it to the publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-report
          path: ${{ runner.temp }}/report
          retention-days: 1

  # Holds the token, and installs nothing. No checkout either: every step
  # below is the definition GitHub resolved rather than a file out of a tree,
  # so there is nothing here a dependency of the job above could have
  # rewritten. This is the same split, and the same reason, as
  # `pnpm-update.yml`.
  publish:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Force-pushes the payload to its own branch. `main` is out of reach:
      # `repo-settings/rulesets/main-no-bypass.json` forbids creation,
      # deletion and non-fast-forward there with no bypass actors, and a
      # `GITHUB_TOKEN` cannot write `.github/workflows/` at all.
      contents: write
      # Creates the report issue on the first run and edits it on every one
      # after.
      issues: write

    steps:
      - name: Take the report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-report
          path: ${{ runner.temp }}/report

      # A fresh repository each time, so the branch is one commit holding one
      # file however long this goes on — rather than a commit per run, which
      # at fifty runs a day is what the repository would otherwise carry.
      #
      # Nothing watches this branch: every `push:` trigger in
      # `.github/workflows/` names `main`, so this starts no run of anything.
      - name: Publish the payload to its branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_BRANCH: data/pr-report
          DATA_PATH: pr-report.json
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          cp "${RUNNER_TEMP}/report/pr-report.json" "${work}/${DATA_PATH}"
          cd "${work}"

          git init --quiet --initial-branch=main
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${DATA_PATH}"
          git commit --quiet --message 'chore(pr-report): publish the payload'
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${DATA_BRANCH}"

      # The label is what identifies the one report issue across runs: a title
      # can be edited by anyone reading it, and the issue number is not
      # something a workflow can remember between runs without a repository
      # variable and the admin token that writes one.
      - name: Publish the report to its issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_LABEL: pr-report
          REPORT_TITLE: Open pull requests
        run: |
          set -euo pipefail

          gh label create "${REPORT_LABEL}" \
            --color ededed \
            --description 'The daily open pull request report, updated in place' \
            --force

          number="$(gh issue list \
            --label "${REPORT_LABEL}" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "${number}" ]; then
            gh issue create \
              --title "${REPORT_TITLE}" \
              --label "${REPORT_LABEL}" \
              --body-file "${RUNNER_TEMP}/report/pr-report.md"
          else
            gh issue edit "${number}" \
              --body-file "${RUNNER_TEMP}/report/pr-report.md"
          fi
