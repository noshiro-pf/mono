name: Verify Published Packages

# Installs the pinned published version of every package from npm and runs a
# small program against each.
#
# The pins live in `verify-npm-packages/published/packages/*/package.json` and
# move only when `pnpm-update` refreshes them, so this has something new to say
# exactly when they change — which is what it runs on. Tracking `latest`
# instead would mean starting to fail the moment a release goes out, on a
# branch that changed nothing.
#
# The local half of the check — tarballs packed from the branch — runs on every
# branch as part of type-check.yml. This one does not need a build: it installs
# from the registry.

on:
  push:
    branches-ignore:
      # `archive/**` holds frozen snapshots of retired work. They are never
      # merged back, so every check on them is wasted CI.
      - 'archive/**'

  # `Check for a draft pull request` below skips the work while the pull
  # request is a draft, and the job still reports — so without this trigger the
  # required checks would sit green on a branch nothing has checked, and
  # marking the pull request ready for review, which is not a push, would not
  # re-run them. This is what runs them for real.
  pull_request:
    types:
      - ready_for_review

  workflow_dispatch:

jobs:
  verify-published:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # A draft pull request is work in progress, so everything below is
      # skipped until it is marked ready for review. A `push` event carries no
      # pull request context — the branch is all it knows — so ask the API
      # whether the open pull request for that branch is a draft.
      #
      # This runs first, before the checkout: every other step hangs off it, so
      # a push to a draft costs one API call rather than an install and a
      # build. The job itself still runs and still reports, for the same reason
      # nothing here uses `paths-ignore` — these are required status checks,
      # and a job that never reports leaves the pull request waiting on a check
      # that will never arrive.
      - name: Check for a draft pull request
        id: check_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # `workflow_dispatch` is someone asking for the checks explicitly,
          # and `pull_request` only fires here on `ready_for_review`, which is
          # the moment the draft stopped being one.
          if [ "${EVENT_NAME}" != 'push' ] || [ "${GITHUB_REF_NAME}" = 'main' ]; then
            exit 0
          fi

          # Every open pull request whose head is this branch has to be a
          # draft. `none` — no pull request yet — runs the checks: the branch
          # may never get one, and nothing would re-run them if it did, since
          # opening a pull request is not a push.
          jq_filter='if length == 0 then "none" elif all(.[]; .isDraft) then "true" else "false" end'

          # Fail open. A pull request that cannot be read is not a draft as far
          # as this gate is concerned; running the checks anyway is the
          # harmless half of being wrong.
          if ! is_draft="$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --head "${GITHUB_REF_NAME}" --state open --json isDraft \
            --jq "${jq_filter}")"; then
            echo 'Could not read the pull requests for this branch; running the checks.'
            exit 0
          fi

          if [ "${is_draft}" = 'true' ]; then
            echo 'is_draft=true' >>"${GITHUB_OUTPUT}"
            echo 'This branch has a draft pull request; skipping. Mark it ready for review to run the checks.'
          fi

      - name: Checkout
        if: steps.check_draft.outputs.is_draft != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event, so a `ready_for_review` run checks exactly
          # what a push to this branch would have.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The gate below resolves `github.event.before` and a merge base,
          # neither of which exists in the default shallow clone. It also
          # brings every branch in as `refs/remotes/origin/*`, which is why
          # nothing below fetches `main` explicitly.
          fetch-depth: 0

      - name: Check whether the pins changed
        id: pins
        if: steps.check_draft.outputs.is_draft != 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${GITHUB_REF_NAME}" = 'main' ]; then
            base="${BEFORE}"
            case "${base}" in
              ''|0000000000000000000000000000000000000000) base='origin/main' ;;
            esac
          else
            # The merge base, not main's tip: once `pnpm-update` moves the pins
            # on main, a two-dot diff calls that a change made here and runs
            # this against the branch's older pins.
            base="$(git merge-base origin/main HEAD)"
          fi

          # Assigned rather than piped into `grep -q`, which reports grep's
          # status: `git diff` failing on an unresolvable base came back as
          # "nothing changed" and the check quietly never ran.
          changed_files="$(git diff --name-only "${base}" -- verify-npm-packages/published)"

          if [ -n "${changed_files}" ]; then
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'The published pins did not change; nothing to verify.'
          fi

      - name: Install pnpm
        if: steps.pins.outputs.changed == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        if: steps.pins.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.pins.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify the published packages
        if: steps.pins.outputs.changed == 'true'
        run: pnpm run verify:npm-packages:published
