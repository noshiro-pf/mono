name: Verify Published Packages

# Installs the pinned published version of every package from npm and runs a
# small program against each.
#
# The pins live in `verify-npm-packages/published/packages/*/package.json` and
# move only when `pnpm-update` refreshes them, so this has something new to say
# exactly when they change — which is what it runs on. Tracking `latest`
# instead would mean starting to fail the moment a release goes out, on a
# branch that changed nothing.
#
# The local half of the check — tarballs packed from the branch — runs on every
# branch as part of code-check.yml. This one does not need a build: it installs
# from the registry.
#
# The check workflow shape — triggers, concurrency, `permissions: {}`, the
# gate, the aggregate — is in README.md. What is particular to this one: the
# diff question is answered in shell here rather than by the gate.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    uses: ./.github/workflows/check-gates.yml
    permissions:
      actions: read
      contents: read
      packages: read
    with:
      # `none`: the one job below gates itself in shell, against a merge base
      # and a single directory rather than against one of the root
      # package.json's ignore lists. Asking check-gates.yml for that answer
      # would cost it a checkout and an install to save the one runner this
      # workflow has.
      diff-scope: none
      result-job: verify-published-result

  verify-published:
    needs: gates
    # No `should_run` clause: the gate was not asked the diff question.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-ci')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.reused_result == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The gate below resolves a merge base, which does not exist in the
          # default shallow clone. It also brings every branch in as
          # `refs/remotes/origin/*`, which is why nothing below fetches `main`
          # explicitly.
          fetch-depth: 0

      - name: Check whether the pins changed
        id: pins
        run: |
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          # The merge base, not main's tip: once `pnpm-update` moves the pins
          # on main, a two-dot diff calls that a change made here and runs
          # this against the branch's older pins.
          base="$(git merge-base origin/main HEAD)"

          # Assigned rather than piped into `grep -q`, which reports grep's
          # status: `git diff` failing on an unresolvable base came back as
          # "nothing changed" and the check quietly never ran.
          changed_files="$(git diff --name-only "${base}" -- verify-npm-packages/published)"

          if [ -n "${changed_files}" ]; then
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'The published pins did not change; nothing to verify.'
          fi

      - name: Install pnpm
        if: steps.pins.outputs.changed == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        if: steps.pins.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.pins.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify the published packages
        if: steps.pins.outputs.changed == 'true'
        run: pnpm run verify:npm-packages:published

  # The one required status check for this workflow — see "The aggregate job"
  # in README.md. No `should_run` clause, as above.
  verify-published-result:
    needs:
      - gates
      - verify-published
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-ci')) &&
      needs.gates.outputs.branch_up_to_date != 'false'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5

    steps:
      - name: Require the checks above to have passed
        env:
          RESULT: ${{ needs.verify-published.result }}
          REUSED_RESULT: ${{ needs.gates.outputs.reused_result }}
          REUSED_FROM: ${{ needs.gates.outputs.reused_from }}
        run: |
          case "${REUSED_RESULT}" in
            success)
              echo "The checks already passed on this commit: ${REUSED_FROM}"
              exit 0
              ;;
            failure)
              summary="The checks already failed on this commit: ${REUSED_FROM} — use \"Re-run all jobs\" to run them again."
              echo "${summary}"
              echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
              exit 1
              ;;
          esac

          if [ "${RESULT}" = 'success' ]; then
            echo 'The checks passed.'
            exit 0
          fi

          summary="The checks did not pass on this commit (result: ${RESULT})."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1
