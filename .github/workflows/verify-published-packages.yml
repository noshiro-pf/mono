name: Verify Published Packages

# Installs the pinned published version of every package from npm and runs a
# small program against each.
#
# The pins live in `verify-npm-packages/published/packages/*/package.json` and
# move only when `pnpm-update` refreshes them, so this has something new to say
# exactly when they change — which is what it runs on. Tracking `latest`
# instead would mean starting to fail the moment a release goes out, on a
# branch that changed nothing.
#
# The local half of the check — tarballs packed from the branch — runs on every
# branch as part of type-check.yml. This one does not need a build: it installs
# from the registry.

on:
  # Only main — pull request branches are covered by the `pull_request` events
  # below; see the note in type-check.yml.
  push:
    branches:
      - main

  # `synchronize` fires on every push to the pull request's branch, so these
  # types cover the pull request's whole life — a draft included. `labeled` /
  # `unlabeled` are what let a `[WIP]` label stop and restart the checks; see
  # the note in type-check.yml.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

  workflow_dispatch:

# One run per pull request; a push cancels the run still going for the
# previous one. `cancel-in-progress` is an expression rather than `true` so
# that pushes to `main` run to completion — see the note in type-check.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the branch is behind `main`, and whether `[WIP]` is on the pull
  # request — see the notes in type-check.yml. `diff-scope: none` because the
  # one job below gates itself in shell, against a merge base and a single
  # directory rather than against one of the root package.json's ignore
  # lists: asking check-gates.yml for that answer would cost it a checkout
  # and an install to save the one runner this workflow has.
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, '[WIP]')
    uses: ./.github/workflows/check-gates.yml
    with:
      diff-scope: none

  verify-published:
    needs: gates
    # Skip the whole job while the pull request carries the `[WIP]` label, or
    # while its branch is behind `main` and cannot be merged as it stands —
    # see the notes in type-check.yml. Being a draft no longer skips
    # anything.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.gates.outputs.branch_up_to_date != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event: these checks assert properties of the branch
          # itself, and the merge ref does not even exist while the pull
          # request has a conflict. On a push event this falls back to the
          # pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The gate below resolves `github.event.before` and a merge base,
          # neither of which exists in the default shallow clone. It also
          # brings every branch in as `refs/remotes/origin/*`, which is why
          # nothing below fetches `main` explicitly.
          fetch-depth: 0

      - name: Check whether the pins changed
        id: pins
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${GITHUB_REF_NAME}" = 'main' ]; then
            base="${BEFORE}"
            case "${base}" in
              ''|0000000000000000000000000000000000000000) base='origin/main' ;;
            esac
          else
            # The merge base, not main's tip: once `pnpm-update` moves the pins
            # on main, a two-dot diff calls that a change made here and runs
            # this against the branch's older pins.
            base="$(git merge-base origin/main HEAD)"
          fi

          # Assigned rather than piped into `grep -q`, which reports grep's
          # status: `git diff` failing on an unresolvable base came back as
          # "nothing changed" and the check quietly never ran.
          changed_files="$(git diff --name-only "${base}" -- verify-npm-packages/published)"

          if [ -n "${changed_files}" ]; then
            echo 'changed=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'The published pins did not change; nothing to verify.'
          fi

      - name: Install pnpm
        if: steps.pins.outputs.changed == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        if: steps.pins.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.pins.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify the published packages
        if: steps.pins.outputs.changed == 'true'
        run: pnpm run verify:npm-packages:published

  # The one required status check for this workflow: it reports whatever
  # happened above, so that a skipped run cannot read as a passing one. The
  # two clauses after `always()` are the skips that are not failures — a
  # `[WIP]` label, held by `no-wip-label`, and a branch behind the base
  # branch, held by the ruleset — for which this job reports `skipped` rather
  # than red. See the note on `type-check-result` in type-check.yml.
  verify-published-result:
    needs:
      - gates
      - verify-published
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.gates.outputs.branch_up_to_date != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the checks above to have passed
        env:
          RESULT: ${{ needs.verify-published.result }}
        run: |
          if [ "${RESULT}" = 'success' ]; then
            echo 'The checks passed.'
            exit 0
          fi

          summary="The checks did not pass on this commit (result: ${RESULT})."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1
