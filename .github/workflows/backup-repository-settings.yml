name: Backup Repository Settings

# Controls when the action will run.
on:
  # Only main. This is one of the two workflows that keep a `push` trigger,
  # and the reason is different from type-check.yml's: what this compares is
  # `bk/` against the repository's *live* settings, which is a property of the
  # repository rather than of a branch — no branch can change them, and
  # nothing a branch changes can make the comparison say something different.
  # So the comparison, and the App token it needs, belong to the runs whose
  # checkout is main's own content: this push and a manual
  # `workflow_dispatch`. A merge is simply the occasion on which that drift is
  # looked for.
  push:
    branches:
      - main

  # Every step below but the checkout skips on a pull request — see the note
  # above — and the trigger nevertheless has to stay. This workflow reports
  # `backup-repository-settings-result`, a required status check, and a
  # context GitHub never sees on the head commit reads as "Expected — waiting
  # for status to be reported" and blocks the merge forever; a `paths` filter
  # would have the same effect, which is what the note further down is about.
  # `labeled` / `unlabeled` are what let a `[WIP]` label stop and restart the
  # checks; see the note in type-check.yml.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# One run per pull request; a push cancels the run still going for the
# previous one. `cancel-in-progress` is an expression rather than `true` so
# that pushes to `main` run to completion — see the note in type-check.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# Deny by default; each job grants back exactly what it needs. See the note in
# type-check.yml for why the repository's own default is not good enough here.
permissions: {}

jobs:
  # Whether the branch is behind `main`, and whether `[WIP]` is on the pull
  # request — see the notes in type-check.yml. `diff-scope: none` because
  # nothing here asks what the diff touched: the one job below gates its own
  # steps on the event, and on a pull request it does nothing a diff could
  # change the answer for. Asking check-gates.yml for a diff would cost it a
  # checkout and an install for an answer no step reads.
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, '[WIP]')
    uses: ./.github/workflows/check-gates.yml
    # What check-gates.yml's own job declares. A caller's job-level
    # `permissions` is the ceiling for the workflow it calls — permissions can
    # be reduced along the chain, never elevated — so the top-level `{}` above
    # would otherwise leave the called workflow unable to check out.
    permissions:
      contents: read
      packages: read
    with:
      diff-scope: none

  backup-repository-settings:
    needs: gates
    # Skip the whole job while the pull request carries the `[WIP]` label, or
    # while its branch is behind `main` and cannot be merged as it stands —
    # see the notes in type-check.yml. Being a draft no longer skips
    # anything.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.gates.outputs.branch_up_to_date != 'false'
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # The one step with no condition on it, so that this job's conclusion on
      # a pull request is a plain `success` from a step that ran rather than
      # whatever a job with nothing in it reports. No full history: with the
      # comparison running only on main's own content there is no merge base
      # to resolve here any more.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event: the merge ref does not even exist while the
          # pull request has a conflict, and a checkout that fails would turn
          # this job red on a pull request it does not check. On a push event
          # this falls back to the pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # NOTE: To keep this workflow in the branch protection rule status check,
      # skip each step instead of skipping the whole workflow with `paths`.
      #
      # Every step from here on runs only where the checkout is main's own
      # content — a push to main, or a `workflow_dispatch` — because each of
      # them runs the checked-out tree's own tooling
      # (`repo-settings:backup` is `libs/github-settings-as-code`, reached
      # through `tsx`), and the comparison it performs is about the repository
      # rather than about a branch, so a branch is not a thing it can have
      # anything to say about.
      #
      # A pull request that hand-edits `repo-settings/` is therefore checked
      # against reality by the run on main after it merges, not while it is
      # open. Running it on branches as well was also its own nuisance: a
      # setting changed in the web UI turned every open pull request red, for
      # something its author neither caused nor could fix from that branch —
      # which is what happened on 13 Aug when `migrate/**` was dropped from the
      # deletion ruleset.
      - name: Install pnpm
        if: github.event_name != 'pull_request'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node_id
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: pnpm install --frozen-lockfile

      # GITHUB_TOKEN の permissions に administration は存在せず、リポジトリ設定や
      # ruleset を読めないため GitHub App の installation token を使う。
      # read では merge 関連設定と ruleset の bypass_actors が API から返らない。
      #
      # Minted after the dependencies are installed, so that the key is not in
      # the job while allowed build scripts run — the same order as
      # pnpm-update.yml and node-support-update.yml, which say so too.
      #
      # `contents` is not among them: the backup writes into the workspace and
      # reads settings through the API, and nothing here writes to the
      # repository.
      - name: Generate Token
        id: app-token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_BOT_PRIVATE_KEY }}
          permission-administration: write
          permission-pages: read
          # environments のバックアップに必要。 App の installation に
          # Environments: read が無いと、この step が落ちる。
          permission-environments: read

      - name: Back up
        if: github.event_name != 'pull_request'
        run: pnpm run repo-settings:backup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: noshiro-pf

      - name: Check if there is no file diff
        if: github.event_name != 'pull_request'
        run: pnpm run z:assert-repo-is-clean

  # The one required status check for this workflow: it reports whatever
  # happened above, so that a skipped run cannot read as a passing one. The
  # two clauses after `always()` are the skips that are not failures — a
  # `[WIP]` label, held by `no-wip-label`, and a branch behind the base
  # branch, held by the ruleset — for which this job reports `skipped` rather
  # than red. See the note on `type-check-result` in type-check.yml.
  backup-repository-settings-result:
    needs:
      - gates
      - backup-repository-settings
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.gates.outputs.branch_up_to_date != 'false'
    runs-on: ubuntu-latest
    # Reads `needs.*.result` and echoes. It touches nothing.
    permissions: {}
    timeout-minutes: 5

    steps:
      - name: Require the checks above to have passed
        env:
          RESULT: ${{ needs.backup-repository-settings.result }}
        run: |
          if [ "${RESULT}" = 'success' ]; then
            echo 'The checks passed.'
            exit 0
          fi

          summary="The checks did not pass on this commit (result: ${RESULT})."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1
