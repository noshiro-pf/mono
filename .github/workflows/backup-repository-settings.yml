name: Backup Repository Settings

# Controls when the action will run.
on:
  # Only main — pull request branches are covered by the `pull_request` events
  # below; see the note in type-check.yml.
  push:
    branches:
      - main

  # `synchronize` fires on every push to the pull request's branch, so these
  # types cover the pull request's whole life — a draft included. `labeled` /
  # `unlabeled` are what let a `[WIP]` label stop and restart the checks; see
  # the note in type-check.yml.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# One run per pull request; a push cancels the run still going for the
# previous one. `cancel-in-progress` is an expression rather than `true` so
# that pushes to `main` run to completion — see the note in type-check.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Whether the branch is behind `main`, and whether `[WIP]` is on the pull
  # request — see the notes in type-check.yml.
  branch-up-to-date:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, '[WIP]')
    uses: ./.github/workflows/branch-up-to-date.yml

  backup-repository-settings:
    needs: branch-up-to-date
    # Skip the whole job while the pull request carries the `[WIP]` label, or
    # while its branch is behind `main` and cannot be merged as it stands —
    # see the notes in type-check.yml. Being a draft no longer skips
    # anything.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.branch-up-to-date.outputs.should_run != 'false'
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The branch tip, not the merge commit GitHub synthesises for a
          # `pull_request` event: these checks assert properties of the branch
          # itself, and the merge ref does not even exist while the pull
          # request has a conflict. On a push event this falls back to the
          # pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # NOTE: To keep this workflow in the branch protection rule status check,
      # skip each step instead of skipping the whole workflow with `paths`.
      #
      # What this compares is the committed backup against GitHub's current
      # settings, which is a property of the repository rather than of a
      # branch: no branch can change them. Running it everywhere meant a
      # setting changed in the web UI turned every open pull request red, for
      # something its author neither caused nor could fix from that branch —
      # which is what happened on 13 Aug when `migrate/**` was dropped from the
      # deletion ruleset.
      #
      # So: always on main, and on a branch only when it touches
      # `repo-settings/` — the case where the backup itself was edited by hand
      # and is worth checking against reality.
      - name: Decide whether to check
        id: should_run
        run: |
          if [ "${GITHUB_REF_NAME}" = 'main' ] || [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          # Against the merge base, not against main's tip: if main's backup
          # moved after this branch forked, a two-dot diff would call that a
          # change made here, run the check against this branch's older files
          # and fail it — the very thing this gate exists to stop.
          #
          # `origin/main` is already here: `fetch-depth: 0` makes the checkout
          # fetch `+refs/heads/*:refs/remotes/origin/*`, so every branch is
          # present with its full history.
          base="$(git merge-base origin/main HEAD)"

          if [ -n "$(git diff --name-only "$base" -- repo-settings)" ]; then
            echo 'should_run=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'should_run=false' >>"${GITHUB_OUTPUT}"
            echo 'No change under repo-settings/; the repository-wide check runs on main.'
          fi

      # GITHUB_TOKEN の permissions に administration は存在せず、リポジトリ設定や
      # ruleset を読めないため GitHub App の installation token を使う。
      # read では merge 関連設定と ruleset の bypass_actors が API から返らない。
      - name: Generate Token
        id: app-token
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_BOT_PRIVATE_KEY }}
          permission-administration: write
          permission-contents: write
          permission-pages: read

      - name: Install pnpm
        if: steps.should_run.outputs.should_run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        if: steps.should_run.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node_id
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.should_run.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Back up
        if: steps.should_run.outputs.should_run == 'true'
        run: pnpm run repo-settings:backup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: noshiro-pf

      - name: Check if there is no file diff
        if: steps.should_run.outputs.should_run == 'true'
        run: pnpm run z:assert-repo-is-clean

  # The one required status check for this workflow: it reports whatever
  # happened above, so that a skipped run cannot read as a passing one. The
  # two clauses after `always()` are the skips that are not failures — a
  # `[WIP]` label, held by `no-wip-label`, and a branch behind the base
  # branch, held by the ruleset — for which this job reports `skipped` rather
  # than red. See the note on `type-check-result` in type-check.yml.
  backup-repository-settings-result:
    needs:
      - branch-up-to-date
      - backup-repository-settings
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, '[WIP]')) &&
      needs.branch-up-to-date.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the checks above to have passed
        env:
          RESULT: ${{ needs.backup-repository-settings.result }}
        run: |
          if [ "${RESULT}" = 'success' ]; then
            echo 'The checks passed.'
            exit 0
          fi

          summary="The checks did not pass on this commit (result: ${RESULT})."
          echo "${summary}"
          echo "${summary}" >>"${GITHUB_STEP_SUMMARY}"
          exit 1
