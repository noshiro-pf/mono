# This is a basic workflow to help you get started with Actions

name: lint-test-type-check

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches-ignore:
      - 'develop'
      - 'develop*'
      - 'archive/**'
      - 'deploy/**'
    paths-ignore:
      - '.gitignore'
      - '.cspell.json'
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.txt'
      - 'articles/**'
      - 'books/**'
      - 'docs/**'
      - 'experimental/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint-test-type-check:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: true
      matrix:
        command:
          - run fmt
          - run ws:gi
          - run type-check-eslint-configs
          - run ws:type-check
          - run ws:test
          - run ws:build:non-utils
          - run ws:lint:fix
          - --filter @noshiro/syncflow run test:stream

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        id: setup_node_id
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # # Set up GitHub Actions caching for Wireit.
      # - uses: google/wireit@setup-github-actions-caching/v1.0.2

      # - run: echo '${{ toJSON(steps.setup_node_id.outputs) }}'
      # - if: ${{ steps.setup_node_id.outputs.cache-hit != 'true' }}
      - name: Install dependencies
        run: pnpm install

      - name: Setup
        run: pnpm run setup

      - name: Check if there is no file diff
        run: pnpm run zz:check:no-diff

      - name: Run "${{ matrix.command }}"
        run: pnpm ${{ matrix.command }}

      - if: ${{ !contains(fromJSON('["run ws:type-check", "run ws:test", "--filter @noshiro/syncflow run test:stream"]'), matrix.command) }}
        name: Check if there is no file diff
        run: pnpm run zz:check:no-diff
