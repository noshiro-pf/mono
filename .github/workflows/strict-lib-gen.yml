name: Strict Lib Generation

# Regenerates the strict standard library for every TypeScript minor and fails
# when the result differs from what is committed, then, in the same job,
# type-checks the committed library under each minor
# (`ws:check:types:strict-lib`).
#
# Everything under `strict-lib/v*/output/` is generated and tracked, and until
# this workflow nothing in CI ran the generator: the other workflows only
# format, type-check and lint the generator's *source*. A converter change that
# moved the output, or an output edited without its converter, therefore
# reached `main` with a green pull request. `output/diff-from-prev/` had in
# fact gone stale that way after #1744 and #1751.
#
# A workflow of its own rather than a matrix entry elsewhere, because neither
# existing gate fits what the generator reads:
#
# - code-check.yml gates on the `code` list of the gate's ignore lists
#   (tools/configs/gate-ignore-lists.json), which ignores
#   `**.md`. The generator copies each harness's `CHANGELOG.md` into the
#   published bundle, so a markdown-only diff — a `chore: version packages`
#   branch is exactly that — can change the output and would skip the check.
# - style-check.yml gates on almost nothing, which is right for formatting but
#   would regenerate the library on every pull request in the repository.
#
# So it gates on the `strict-lib` list, a list of its own.
#
# The check workflow shape — triggers, concurrency, `permissions: {}`, the
# gate, the aggregate — is in README.md.

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

  # No inputs: the queue dispatches each layer it stacks with none (see
  # "Triggers" in README.md and `check:root:dispatch-inputs`).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.event_name == 'push', github.sha, github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The ignore list is `strict-lib` in tools/configs/gate-ignore-lists.json.
  # A pull request is skipped only when *every* changed path
  # matches it, so a pattern belongs there only when nothing below can read the
  # paths it matches. Why each entry is there, and why some are not:
  #
  # Ignored:
  #
  # - `experimental/`, `docs/`, `articles/`, `books/`, `verify-npm-packages/`,
  #   `repo-settings/`, `.changeset/`: nothing the generator runs reads them.
  #   A changeset changes the output only once `changeset version` has
  #   rewritten a harness's `CHANGELOG.md` and `package.json`, and that
  #   rewrite is under `strict-lib/`, which is not ignored.
  # - `apps/`, `languages/`: the generator imports nothing from them. Their
  #   `package.json` files are read by the `pnpm install` the generator runs
  #   at the end, but the setup step below has already installed the same
  #   lockfile, and `--frozen-lockfile` there fails first on a manifest
  #   the lockfile does not match. The harnesses' type checks do not read
  #   them either; the `ws:build:deps` before those builds the `languages/`
  #   packages the workspace links, but only because `assert-deps-built`
  #   asks for every linked `dist/`, and code-check.yml builds them on any
  #   diff there.
  # - `LICENSE` and the style tools' own configuration (`.editorconfig`,
  #   `.prettierrc`, `.prettierignore`, `.cspell.config.yaml`,
  #   `**/cspell.config.yaml`, `.markdownlint-cli2.mjs`): Prettier, cspell and
  #   markdownlint do not run here. oxfmt does, and its configuration is under
  #   `strict-lib/`.
  # - `*.md` and `libs/**/*.md`: markdown at the root and in the libraries.
  #   `*.md` does not cross a `/`, so it matches `CLAUDE.md` and `README.md`
  #   and nothing deeper.
  #
  # Deliberately not ignored:
  #
  # - `**.md`: each harness's `CHANGELOG.md` is copied into the published
  #   bundle, and the bundle's `README.md` is generated. This is why the
  #   workflow does not share code-check.yml's `code` list.
  # - `**.txt`: `output/diff-from-prev/*/summary.txt` is generated output.
  # - `libs/`: the generator imports `ts-data-forge`, `ts-repo-utils`,
  #   `ts-type-forge` and `ts-fortress` from their sources through
  #   `tools/configs/tsconfig.tsx.json`. Listing only those four would miss the
  #   next import someone adds, so the whole directory stays in.
  # - `package.json`, `pnpm-lock.yaml`, `pnpm-workspace.yaml`: a new oxfmt or
  #   TypeScript version changes the formatted and parsed output.
  # - `tools/`: `tsconfig.tsx.json` decides what those imports resolve to.
  # - `.github/`: this workflow, check-gates.yml and the setup action are in
  #   it.
  #
  # When the generator starts reading something new, check it against the
  # list before relying on a green run.
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    uses: ./.github/workflows/check-gates.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      diff-scope: strict-lib
      result-job: strict-lib-gen-result / result

  strict-lib-gen:
    needs: gates
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-ci')) &&
      needs.gates.outputs.branch_up_to_date != 'false' &&
      needs.gates.outputs.should_run != 'false' &&
      needs.gates.outputs.reused_result == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}

      - name: Set up pnpm, Node.js and the dependencies
        uses: $/.github/actions/setup

      # No `ws:build`. Every harness runs `tsx` with
      # `tools/configs/tsconfig.tsx.json`, which maps our packages to their
      # sources, so the generator needs no `dist/` — measured at under two
      # minutes for all twelve series with every `dist/` removed.
      #
      # `temp/copied/` is tracked, so this step fetches nothing: it reformats
      # the upstream lib files, reruns the codemod and the converter, and
      # regenerates `output/`.
      - name: Regenerate the strict standard library
        run: pnpm run strict-lib:gen:with-codemod-fixed

      # `output/diff-from-prev/` compares consecutive series, so it has to run
      # after all of them have been regenerated.
      - name: Regenerate the cross-version diffs
        run: pnpm run strict-lib:gen:version-diff

      - name: Check if there is no file diff
        run: pnpm run z:assert-repo-is-clean

      # The harnesses' own type checks: the committed strict lib, checked by
      # each harness's own TypeScript minor. They are nine tenths of
      # `ws:check:types`, and code-check.yml leaves them to this workflow. What
      # they compile is under `strict-lib/`, plus the TypeScript version the
      # lockfile pins and `ts-type-forge`'s types, none of which the gate above
      # ignores. The other packages the build below produces are there for
      # `assert-deps-built`, not read by `tsc`.
      #
      # In this job, after the generator, rather than in a job beside it:
      # runner-minutes per pull request are what the queue spends ("A pull
      # request's checks are few and long" in README.md), and a second job
      # paid its own runner, checkout and setup for nothing. Over 21 runs
      # before they were joined, the generator's job took 2.8 minutes at the
      # median (p90 3.1) and the type checks' 7.8 (p90 8.8). The two p90s
      # added come to 11.9 minutes, within the 12 the check jobs keep to,
      # before taking off the second checkout and setup this job no longer
      # pays.
      #
      # After the clean-tree step, so that a stale output fails as the
      # generator's step, and so that what the type checks read is what is
      # committed. A failure there skips them, which costs a second run to see
      # a type error behind a stale output, and is meant: the tree then holds
      # the regenerated output, not the committed one, so they would check
      # something else, and putting the committed one back takes a
      # `pnpm install` as well, since the harnesses read `output/lib` through
      # the copies it installs. Before the generator instead, they would have
      # it run with the linked packages' `dist/` built, so that an import it
      # resolves only through one would pass here (it must run with none), and
      # would make a stale output, the failure this workflow exists for, wait
      # for them.
      #
      # `ws:build:deps` builds what the members link (`assert-deps-built.mts
      # --workspace`, which the script starts with, asks for all of it), under
      # a minute; the type checks are three waves of four `tsc` runs.
      - name: Build what the workspace links
        run: pnpm run ws:build:deps

      - name: Type-check the strict-lib harnesses
        run: pnpm run ws:check:types:strict-lib

  # The one required status check for this workflow, reported as
  # `strict-lib-gen-result / result` — see "The aggregate job" in README.md.
  strict-lib-gen-result:
    needs:
      - gates
      - strict-lib-gen
    # Not on a label event while `skip-ci` is on, so that putting the label on
    # supersedes no verdict — "A label event under `skip-ci`" in README.md.
    if: >-
      always() &&
      !((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    uses: ./.github/workflows/check-result.yml
    with:
      needs: ${{ toJSON(needs) }}
