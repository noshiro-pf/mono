name: Verify Lockfile

# Fails when `.github/workflows/actions.lock` is out of step with the
# workflows, or when a pin it records no longer verifies upstream (a tag that
# moved, a commit no longer reachable from its tag, a repository that changed
# hands). Built from the sample in github/gh-actions-lock
# (`.github/workflows/verify-lockfile.yml`); what the lockfile is and how it is
# kept current is in README.md under "Action pins and the lockfile".
#
# Its one job is its own required context (`verify-lockfile` in
# `repo-settings/rulesets/main.json`), as the `lint-pull-request.yml` jobs are,
# rather than a gate and an aggregate: it runs no repository code — the
# extension reads the workflow files as data — and takes seconds, so it runs
# on every event and always reports a real verdict. That is also why it carries
# no `skip-ci` condition and no `paths` filter: either would leave the
# required context `skipped`, or never reported, on a head nothing verified,
# and since this workflow does not run on `unlabeled`, taking `skip-ci` off
# would not bring it back.
#
# `push` to `main` as well, for a merge the ruleset was bypassed for, which can
# land a tree no pull request run verified.
#
# The job also refuses a `package.json` or lockfile under `experimental/`
# (`experimental/README.md` says why none stays there). That has nothing to do
# with the action pins; it is here because the check workflows skip a diff that
# touches `experimental/` alone, which is exactly the diff that adds one, and
# this is the one job with a checkout that runs on every pull request. A step
# costs no job and no required context of its own, at the price of a failure
# reported under `verify-lockfile`, so the step's message says what it found.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.event_name == 'push', github.sha, github.ref) }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    # The required context; renaming it is a ruleset change
    # (repo-settings/README.md).
    name: verify-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}
          persist-credentials: false

      - name: Install gh-actions-lock
        uses: $/.github/actions/install-gh-actions-lock

      # `GITHUB_TOKEN` reads the actions' public repositories, and lifts the
      # unauthenticated rate limit the runners' shared IP range exhausts.
      - name: Verify the lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

      # Inline and `git` alone, like the rest of this job: no repository code
      # runs. Git matches the names itself (`**/` is any depth, none included)
      # and `-z` gives each path as it is, where a line of output would quote
      # one with a non-ASCII byte in it. The four names are the rule
      # `experimental/README.md` states, no more: an import from another
      # ecosystem would bring a manifest this does not look for.
      #
      # Last, and run when the verification above has failed too, so that one
      # run reports both.
      - name: Refuse a package.json or lockfile under experimental/
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          # To a file first: a failure of `git` inside a process substitution
          # would go unseen, and the loop would read an empty list as a clean
          # tree.
          list="$(mktemp)"

          git ls-files -z -- \
            ':(glob)experimental/**/package.json' \
            ':(glob)experimental/**/yarn.lock' \
            ':(glob)experimental/**/package-lock.json' \
            ':(glob)experimental/**/pnpm-lock.yaml' \
            > "${list}"

          found=0

          # One annotation per file, on the file. `%`, CR and LF are escaped
          # for a workflow command, `:` and `,` for a property of one.
          while IFS= read -r -d '' path; do
            found=1

            escaped="${path//'%'/%25}"
            escaped="${escaped//$'\r'/%0D}"
            escaped="${escaped//$'\n'/%0A}"
            escaped="${escaped//:/%3A}"
            escaped="${escaped//,/%2C}"

            echo "::error file=${escaped}::experimental/ holds no package.json and no lockfile: GitHub's dependency graph reads them and Dependabot alerts on what they declare, though nothing installs it. Rename a package.json to package.snapshot.json and delete a lockfile (experimental/README.md)."
            printf 'experimental/ must not hold: %s\n' "${path}"
          done < "${list}"

          exit "${found}"
