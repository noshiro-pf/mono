name: Set up pnpm, Node.js and the dependencies

# The steps every job that runs repository code takes after its checkout, and
# the one place their action pins are written. See "Setup" in
# .github/workflows/README.md for what the steps assume and why the checkout
# is not one of them.
#
# An input exists only where callers really differ, and each difference is
# explained by its caller rather than here.

description: >-
  `pnpm/action-setup`, `actions/setup-node` on `volta.node` (or the version
  given) with the pnpm store cached unless `cache: false`, and
  `pnpm install --frozen-lockfile`.

inputs:
  node-version:
    description: >-
      The Node.js version to set up. Empty, the default, reads `volta.node`
      through `node-version-file: 'package.json'`, the version every workflow
      runs on unless it is checking another one.
    required: false
    default: ''
  pnpm:
    description: >-
      `false` to set up Node.js alone, with no pnpm and no store cache, for a
      job that runs only `node` on the tree. Takes `install: false` with it.
    required: false
    default: 'true'
  install:
    description: >-
      `false` to stop after setting up pnpm and Node.js, for a job that changes
      what is installed before it installs it.
    required: false
    default: 'true'
  cache:
    description: >-
      `false` to restore and save no cache: neither the pnpm store nor pnpm's
      lockfile verification record. Only `true` turns them on (in any case, as
      expressions compare strings), so a misspelt `false` still caches nothing,
      and the install step, which takes exactly `true` or `false`, names it.
    required: false
    default: 'true'
  engine-strict:
    description: '`true` to install with `--engine-strict`.'
    required: false
    default: 'false'
  ignore-scripts:
    description: '`true` to install with `--ignore-scripts`.'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      if: inputs.pnpm != 'false'
      uses: pnpm/action-setup@v6.1.0
      with:
        # Its default, written out: the store is `setup-node`'s to cache, below,
        # where `cache: false` turns it off; a default that changed on an update
        # would restore it for that input too.
        cache: false

    # `node-version` wins over `node-version-file` when both are given, and
    # `setup-node` warns about it, so the file is named only when no version is.
    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ case(inputs.node-version == '', 'package.json', '') }}
        cache: ${{ case(inputs.pnpm != 'false' && inputs.cache == 'true', 'pnpm', '') }}
        # Without it, `packageManager` in package.json turns the pnpm cache on
        # whatever `cache` says, and asks a pnpm that is not there for its store.
        package-manager-cache: ${{ inputs.pnpm != 'false' && inputs.cache == 'true' }}

    # pnpm verifies the lockfile against the supply-chain policies of
    # pnpm-workspace.yaml on every install, which is most of an install from a
    # warm store, and skips it when its record holds this lockfile's hash under
    # policies at least as strict. The record is per machine, so without this
    # every job verifies again. With it, a job skips the verification when a
    # job that finished before it started saved the record under this key: in
    # code-check.yml, the matrix after `build`. Jobs that start together each
    # verify. Where a record may be read from, and so which pull requests
    # reuse it, is in "Setup" in .github/workflows/README.md. A changed
    # lockfile or policy misses the key, and so does another pnpm, whose
    # record format or policies may differ: a record it ignored would
    # otherwise be restored, ignored and never replaced, since a key is saved
    # once. The path is where pnpm writes the record on Linux, read here once
    # for both steps below; the install warns when pnpm wrote nothing there.
    - name: Locate pnpm's lockfile verification record
      id: lockfile-record
      if: inputs.pnpm != 'false' && inputs.install == 'true' && inputs.cache == 'true'
      shell: bash
      run: |
        echo "path=${XDG_CACHE_HOME:-$HOME/.cache}/pnpm/lockfile-verified.jsonl" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(pnpm --version)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm's lockfile verification record
      if: inputs.pnpm != 'false' && inputs.install == 'true' && inputs.cache == 'true'
      uses: actions/cache@v5.1.0
      with:
        path: ${{ steps.lockfile-record.outputs.path }}
        key: pnpm-lockfile-verified-${{ runner.os }}-pnpm-${{ steps.lockfile-record.outputs.pnpm }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

    # What to install, and the check that each input is `true` or `false`,
    # are in the script; see its header for why it may be a file in the tree.
    - name: Install dependencies
      shell: bash
      env:
        PNPM: ${{ inputs.pnpm }}
        INSTALL: ${{ inputs.install }}
        CACHE: ${{ inputs.cache }}
        ENGINE_STRICT: ${{ inputs.engine-strict }}
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
        LOCKFILE_RECORD: ${{ steps.lockfile-record.outputs.path }}
      run: node ./tools/scripts/cmd/workflow-steps.mts install
