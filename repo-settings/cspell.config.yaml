version: '0.2'
# Inherit the repository-wide settings. Required: when cspell runs with
# this directory as its cwd, it stops at the nearest config and would
# otherwise lose the root dictionaries and ignorePaths.
import:
  - '../.cspell.config.yaml'
words:
  # A fragment of the noshiro-repo-automation-bot client id in
  # variables/settings.json. The value is not secret — a client id is public
  # — but it is also not a word, and JSON cannot carry a cspell:ignore.
  - lilpi
