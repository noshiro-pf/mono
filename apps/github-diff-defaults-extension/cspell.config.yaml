version: '0.2'
# Inherit the repository-wide settings. Required: when cspell runs with
# this directory as its cwd, it stops at the nearest config and would
# otherwise lose the root dictionaries and ignorePaths.
import:
  - '../../.cspell.config.yaml'
words:
  # The three PNG chunk types the icon generator writes: the header, the
  # compressed pixels, and the end marker.
  - IHDR
  - IDAT
  - IEND
  # Plural of "navigation": GitHub moves between its own pages without loading a
  # document, and those client-side navigations are what the observer watches
  # for.
  - navigations
