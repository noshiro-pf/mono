  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <path d="M10 10 L22 16 M10 22 L22 16" />
  </g>
  <g fill="#fff">
    <rect x="5" y="6" width="9" height="8" rx="2" />
    <rect x="5" y="18" width="9" height="8" rx="2" />
    <path d="M23 11 L28 16 L23 21 L18 16 Z" />
  </g>
</svg>
