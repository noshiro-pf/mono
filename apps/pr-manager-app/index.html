<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The state of every open pull request in noshiro-pf/mono, from the daily report."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      For iOS's "Add to Home Screen", which does not read the SVG favicon and
      without a touch icon draws the title's first letter instead. The PNG is
      favicon.svg's drawing on a full square, since iOS rounds the corners
      itself and fills transparency with black. The title meta is the name
      proposed under the icon; the home screen cuts off much longer ones.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PR Manager" />
    <title>GitHub Pull Requests Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
