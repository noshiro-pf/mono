version: '0.2'
# Inherit the repository-wide settings. Required: when cspell runs with
# this directory as its cwd, it stops at the nearest config and would
# otherwise lose the root dictionaries and ignorePaths.
import:
  - '../../.cspell.config.yaml'
words:
  # In the browser's user agent string, which the benchmark pages embed from
  # RESULTS.md.
  - KHTML
  # The package name `vanjs-core`, which the bundle size pages name.
  - vanjs
