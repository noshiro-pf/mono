version: '0.2'
# Inherit the repository-wide settings. Required: when cspell runs with
# this directory as its cwd, it stops at the nearest config and would
# otherwise lose the root dictionaries and ignorePaths.
import:
  - '../../.cspell.config.yaml'
words:
  # Font names carried over from Blueprint's own variables.
  - neue
  - segoe
  # Year-Month-Date-Hours-Minutes, the abbreviation `io-ts-types` names its
  # date types after; the datetime wrappers here take them.
  - ymdhm
