version: '0.2'
# Inherit the repository-wide settings. Required: when cspell runs with
# this directory as its cwd, it stops at the nearest config and would
# otherwise lose the root dictionaries and ignorePaths.
import:
  - '../../.cspell.config.yaml'
words:
  # The contrast standard the spec's label chips are measured against.
  - WCAG
  # CSS `font-variant-numeric: tabular-nums`.
  - nums
  # Hex colour channels in GitHub label fixtures and the format they name.
  - RRGGBB
ignoreRegExpList:
  # GitHub label colours in fixtures: six hex digits.
  - "/'[0-9a-f]{6}'/g"
