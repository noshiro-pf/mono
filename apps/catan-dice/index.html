<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Roll two dice for Catan and keep a histogram of every sum rolled so far."
    />
    <meta name="theme-color" content="#b42318" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      For iOS's "Add to Home Screen", which does not read the SVG favicon and
      without a touch icon draws the title's first letter instead. The PNG is
      favicon.svg's drawing on a full square, since iOS rounds the corners
      itself and fills transparency with black. The title meta is the name
      proposed under the icon; the home screen cuts off much longer ones.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Catan Dice" />
    <!--
      The link card X, Slack, Discord and the like draw for a shared URL.
      Crawlers do not run the page's script and want absolute URLs here, while
      Vite would only turn "/og-image.png" into a path under the base, so
      og:url and og:image are written out in full: the Pages site plus the
      app's directory in tools/configs/pages-apps.mts. theme-color is the
      stripe Discord draws beside the card. og-image.png and
      apple-touch-icon.png are drawn by `pnpm run gen:app-images`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Catan Dice" />
    <meta
      property="og:description"
      content="Roll two dice for Catan and keep a histogram of every sum rolled so far."
    />
    <meta
      property="og:url"
      content="https://noshiro-pf.github.io/mono/catan-dice/"
    />
    <meta
      property="og:image"
      content="https://noshiro-pf.github.io/mono/catan-dice/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Catan Dice — Roll two dice for Catan and keep a histogram of every sum rolled so far."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Catan Dice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
