<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A histogram rising to seven and falling away: how often each sum of two
    dice comes up, which is what the app tallies.
  -->
  <rect width="32" height="32" rx="7" fill="#b42318" />
  <g fill="#fff">
    <rect x="5.1" y="21" width="2.6" height="4" rx="0.6" />
    <rect x="8.3" y="17" width="2.6" height="8" rx="0.6" />
    <rect x="11.5" y="13" width="2.6" height="12" rx="0.6" />
    <rect x="14.7" y="8" width="2.6" height="17" rx="0.6" />
    <rect x="17.9" y="13" width="2.6" height="12" rx="0.6" />
    <rect x="21.1" y="17" width="2.6" height="8" rx="0.6" />
    <rect x="24.3" y="21" width="2.6" height="4" rx="0.6" />
  </g>
</svg>
