version: '0.2'
# Inherit the repository-wide settings. Required: when cspell runs with
# this directory as its cwd, it stops at the nearest config and would
# otherwise lose the root dictionaries and ignorePaths.
import:
  - '../../.cspell.config.yaml'
words:
  # North/west/east/south — the four seats at the table, as seen from the
  # player. Used as a type name and as record keys throughout.
  - nwes
  # The four card-back patterns in `constants/`.
  - qwbd
