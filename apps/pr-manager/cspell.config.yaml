version: '0.2'
# Inherit the repository-wide settings. Required: when cspell runs with
# this directory as its cwd, it stops at the nearest config and would
# otherwise lose the root dictionaries and ignorePaths.
import:
  - '../../.cspell.config.yaml'
words:
  # The contrast standard `src/label-color.mts` computes against, named in
  # the module, its test and the README.
  - WCAG
  # GitHub's default label colour, which `src/label-color.mts` falls back to
  # and its test asserts on.
  - ededed
