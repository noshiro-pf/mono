# Single source of truth for the versions of shared devDependencies.
# A package writes `"eslint": "catalog:"` instead of a version, so the
# declaration stays in the package that needs it while the version stays here.
# Only devDependencies use the catalog: a published package's dependencies and
# peerDependencies are its own API surface, so their ranges stay literal.
catalog:
  '@playwright/test': 1.63.0
  '@reduxjs/toolkit': 2.12.0
  '@testing-library/dom': 10.4.1
  '@testing-library/preact': 3.2.4
  '@testing-library/react': 16.3.3
  '@types/node': 26.5.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@typescript-eslint/parser': 8.70.0
  '@typescript-eslint/rule-tester': 8.70.0
  '@vitejs/plugin-react': 6.1.1
  '@vitest/browser-playwright': 5.0.0
  '@vitest/coverage-v8': 5.0.0
  '@vitest/ui': 5.0.0
  argparse: 3.0.2
  cspell: 10.3.0
  dedent: 1.7.2
  esbuild: 0.28.2
  eslint: 10.10.0
  immer: 11.1.18
  jiti: 2.7.0
  jotai: 3.0.0
  markdownlint: 0.41.1
  markdownlint-cli2: 0.23.2
  mobx: 7.0.3
  npm-run-all2: 9.0.3
  oxfmt: 0.67.0
  oxlint: 1.82.0
  oxlint-tsgolint: 7.0.2001
  playwright: 1.63.0
  preact: 10.29.8
  prettier: 3.9.6
  prettier-plugin-organize-imports: 4.3.0
  prettier-plugin-packagejson: 3.0.2
  react: 19.3.0
  react-dom: 19.3.0
  rxjs: 7.8.2
  tsx: 4.23.13
  typedoc: 0.28.20
  typedoc-github-theme: 0.4.0
  typescript: 6.0.3
  valtio: 2.3.2
  vite: 8.3.0
  vitest: 5.0.0
  zustand: 5.0.15

packages:
  - libs/*
  - apps/*
  - tools/*
  # Language development. One directory per language under languages/, with
  # that language's development packages (the conformance corpus for now)
  # below it. Not published, and fits none of libs (npm packages) / apps /
  # tools (repository tooling). See languages/sumi/docs/decisions.md (D-8).
  - languages/*/*
  # The strict standard library. Its generator and its generated output live
  # together, so it does not fit `libs/*` (one directory, one npm package) and
  # gets a top level of its own.
  - strict-lib/scripts-common
  - strict-lib/v*
  # The published package of each TypeScript minor. A member because `paths`
  # has to resolve `node_modules/strict-ts-lib-vX.Y/libs/*` through a symlink
  # to this directory, and because changesets can only version what it can see.
  - strict-lib/v*/output/lib

# NOTE: experimental/ is intentionally excluded. It holds the pre-2026 monorepo
# contents (packages/, configs/, scripts/), kept for reference and revived
# package by package. Nothing under experimental/ is installed, built, linted or
# type-checked.

update:
  # GitHub Actions のピンは `update-packages` ではなく `update-actions` が動かす。
  # ここを true にすると `--latest` の付いた `update-packages` が actions も
  # メジャー更新してしまい、`changesets/action` v1 → v2 のような、設定の書き換えを
  # 伴う更新が無人でマージされる。`update-actions` は同一メジャー内でしか動かさない
  # ので、メジャー更新は人間が判断することになる。
  #
  # pnpm の `--include-github-actions` には `minimumReleaseAge` が効かない。pnpm は
  # actions のバージョンを `git ls-remote` の ref 一覧から取っており、タグの公開日時を
  # 持たないため。そこで `update-actions` は pnpm ではなく
  # `tools/scripts/cmd/mature-updates.mts actions` を動かし、GitHub Releases の
  # `published_at` で同じ保留を適用する。下の `ignoreDeps` は actions には適用されない。
  githubActions: false
  ignoreDeps:
    - typescript

    # PixiJS 7 removed `InteractionManager`, dropped the `transparent`
    # application option and deprecated the global `settings` object.
    # `apps/annotation-tool` is v5-era code restored from `experimental/` and
    # uses all three, so `--latest` takes it from 5.3.12 to 7.4.3 and the
    # build stops at `MISSING_EXPORT "InteractionManager"` (#1859). Porting
    # the canvas to the federated events API is its own change, with its own
    # review; it is not something a nightly dependency bump should carry.
    - pixi.js-legacy

minimumReleaseAge: 10080 # = 7 days

# 除外は「方針」ではなく「一時的な waiver」として書く。名前だけで書くと、その
# パッケージは以後ずっと隔離を素通りする — 理由が解消しても誰も気づかない。
# バージョンまで書いて prune に失効させれば、必要なあいだだけ効く。
#
# prune は `pnpm update` で走り、lockfile が解決しなくなったエントリを落とす。
# 実測（pnpm 12.3.4）: lockfile に無い名前も `name@1.2.3` も消え、`pattern-*`
# だけは常に残る。だから **glob で書くと失効しない**。
#
# **waiver の理由は、下のリストの中ではなく、ここに書く。** prune はリストを
# 書き直すとき、その中のコメントを道連れにする。実測: 12.3.4 は
# `minimumReleaseAgeExclude:` の直後にあるコメントまで消し — #1937 で octokit 族
# の説明 8 行が消えたのがこれ — 12.5.1 は消える項目に付いたコメントだけ消す。
# このキーの上は両方のバージョンで無傷だった。`minimumReleaseAgeExclude:` の
# 直前も駄目で、リストが空になるとキーごと消えて理由だけが次のキーの上に浮く。
#
# 書式は `# waiver: <名前かその前方一致>` の見出しと、その下の説明。族で理由が
# 一つなら前方一致で一度書けばよい。`check:root:minimum-release-age` が、理由の
# 無い entry、entry の無い理由、リストの中に書かれた見出しで落ちる。
#
# waiver: @octokit/
#   octokit 族は `@octokit/openapi-types` を共有し、
#   `octokit-safe-types` はその型と自前のスキーマが厳密に一致することを
#   `expectType<..., '='>` で表明している。隔離が族を一つずつ通すと
#   `@octokit/openapi-types` が 2 バージョン同居して表明が破れ、`ws:build` が
#   落ちる。族が揃って動く必要があるのはそのため。
#
#   要求は「族の原子性」であって「隔離の免除」ではない。バージョンを固定して
#   あるので、族が次に揃って動いた時点で prune が落とす。
#
# waiver: @types/
#   `@types/**` の恒久除外を外した時点で lockfile に入っていて、まだ 7 日を
#   超えていなかったもの。成熟して次に動いた時点で prune が落とす。
minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - '@octokit/auth-token@6.0.0'
  - '@octokit/core@7.0.8'
  - '@octokit/endpoint@11.0.5'
  - '@octokit/graphql@9.0.5'
  - '@octokit/openapi-types@29.0.1'
  - '@octokit/request@10.0.16'
  - '@octokit/request-error@7.1.2'
  - '@octokit/types@18.0.0'
  - '@types/node@24.13.4'
  - '@types/react@19.3.0'
  - '@types/react-dom@19.3.0'

allowBuilds:
  # Both arrive with `firebase`, which apps/poll-discord-app depends on.
  # Neither install script is needed for what happens here — the app is
  # type-checked and transpiled, never run — and this list is an allowlist on
  # purpose, so they stay off. Whoever deploys the app decides separately.
  '@firebase/util': false
  esbuild: true
  protobufjs: false
  sharp: true # apps/synstate-docs (Astro)
  unrs-resolver: true

# pnpm 11.25 refuses to run a recursive script when the workspace's task graph
# has a cycle. Every cycle it names here runs through `devDependencies` and is
# deliberate: each package devDepends on the toolchain (`eslint-config-typed`,
# `ts-repo-utils`, the ESLint plugins) and the toolchain devDepends back on the
# libraries it is built from, so there is no order that satisfies all of them —
# the same fact that makes `runCmdInStagesAcrossWorkspaces` derive build order
# from `dependencies` + `peerDependencies` alone (see CLAUDE.md, "Build").
#
# The scripts this affects — `gen:index`, `check:lint`, `check:test`, `doc`, … — are per-package
# and order-independent; only `build` needs an order, and it does not come from
# here. So "arbitrary order" is the correct semantics, not a concession.
ignoreWorkspaceCycles: true
