# Single source of truth for the versions of shared devDependencies.
# A package writes `"eslint": "catalog:"` instead of a version, so the
# declaration stays in the package that needs it while the version stays here.
# Only devDependencies use the catalog: a published package's dependencies and
# peerDependencies are its own API surface, so their ranges stay literal.
catalog:
  '@reduxjs/toolkit': 2.12.0
  '@rollup/plugin-replace': 6.0.3
  '@rollup/plugin-strip': 3.0.4
  '@rollup/plugin-typescript': 12.3.0
  '@testing-library/dom': 10.4.1
  '@testing-library/preact': 3.2.4
  '@testing-library/react': 16.3.2
  '@types/node': 26.2.0
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@typescript-eslint/parser': 8.67.0
  '@typescript-eslint/rule-tester': 8.67.0
  '@vitest/browser-playwright': 4.1.10
  '@vitest/coverage-v8': 4.1.10
  '@vitest/ui': 4.1.10
  argparse: 3.0.0
  cspell: 10.0.1
  dedent: 1.7.2
  esbuild: 0.28.2
  eslint: 10.8.1
  immer: 11.1.16
  jiti: 2.7.0
  jotai: 2.20.2
  markdownlint: 0.41.1
  markdownlint-cli2: 0.23.2
  mobx: 7.0.0
  npm-run-all2: 9.0.3
  playwright: 1.62.1
  preact: 10.29.8
  prettier: 3.9.6
  prettier-plugin-organize-imports: 4.3.0
  prettier-plugin-packagejson: 3.0.2
  react: 19.2.8
  react-dom: 19.2.8
  rollup: 4.62.4
  rollup-plugin-esbuild: 6.2.1
  rxjs: 7.8.2
  tsx: 4.23.12
  typedoc: 0.28.20
  typedoc-github-theme: 0.4.0
  typescript: 6.0.3
  valtio: 2.3.2
  vite: 8.2.1
  vitest: 4.1.10
  zustand: 5.0.15

packages:
  - libs/*
  - apps/*
  - tools/*

# NOTE: experimental/ is intentionally excluded. It holds the pre-2026 monorepo
# contents (packages/, configs/, scripts/), kept for reference and revived
# package by package. Nothing under experimental/ is installed, built, linted or
# type-checked.

update:
  # GitHub Actions のピンは `update-packages` ではなく `update-actions` が動かす。
  # ここを true にすると `--latest` の付いた `update-packages` が actions も
  # メジャー更新してしまい、`changesets/action` v1 → v2 のような、設定の書き換えを
  # 伴う更新が無人でマージされる。`update-actions` は `--latest` を付けないので
  # `^current` の範囲に留まり、メジャー更新は人間が判断することになる。
  #
  # `minimumReleaseAge` は actions には効かない。pnpm は actions のバージョンを
  # `git ls-remote` の ref 一覧から取っており、タグの作成日時を持たないため。
  # 同じ理由で下の `ignoreDeps` も actions には適用されない。
  githubActions: false
  ignoreDeps:
    - typescript

minimumReleaseAge: 10080 # = 7 days

minimumReleaseAgeExclude:
  - '@types/**'
  - ts-type-forge
  - eslint-plugin-ts-type-forge
  - ts-data-forge
  - eslint-plugin-ts-data-forge
  - ts-fortress
  - eslint-plugin-ts-fortress
  - ts-repo-utils
  - ts-codemod-lib
  - synstate
  - 'synstate-*'
  - eslint-config-typed
  - octokit-safe-types
  - github-settings-as-code
  - 'strict-ts-lib-*'

allowBuilds:
  # Both arrive with `firebase`, which apps/poll-discord-app depends on.
  # Neither install script is needed for what happens here — the app is
  # type-checked and transpiled, never run — and this list is an allowlist on
  # purpose, so they stay off. Whoever deploys the app decides separately.
  '@firebase/util': false
  esbuild: true
  protobufjs: false
  sharp: true # apps/synstate-docs (Astro)
  unrs-resolver: true
