# Codecov configuration
# See: https://docs.codecov.com/docs/codecov-yaml

codecov:
  notify:
    # A pull request's coverage arrives in one upload per `coverage: true`
    # entry of code-check.yml's matrix. Without this, Codecov writes every
    # status after each upload: the first set compares the base against part
    # of the suite, and each set is two GitHub API calls per check. Checks
    # left `in_progress` for good came in bursts when the queue was busiest,
    # likely those calls being throttled.
    # Keep this equal to the number of those entries, as `comment` below
    # (`check:root:codecov-builds`). A pull request one of whose uploads
    # never arrives gets no statuses, as it already got no comment. A push to
    # main that `coverage-main` uploads once gets none either, which nothing
    # on main reads; its report, the base pull requests compare against and
    # the badges read, is processed all the same. A pull request whose
    # verdict was reused, as a queued one's is from its queue layer, uploads
    # through `coverage-pr`, once per entry too.
    after_n_builds: 1

coverage:
  status:
    project:
      default:
        # Make this status informational only (won't block PRs)
        informational: true
    patch:
      default:
        # Make this status informational only (won't block PRs)
        informational: true

# Comment settings (optional)
comment:
  layout: 'reach, diff, flags, components, files'
  behavior: default
  require_changes: false
  # A comment written before the last upload would compare the base against
  # part of the suite. Keep this equal to the number of `coverage: true`
  # entries of code-check.yml's matrix, as `codecov.notify` above
  # (`check:root:codecov-builds`).
  after_n_builds: 1

# One component per package, so that a repository-wide number is not the only
# thing on offer. `pnpm run ws:check:test:cov` writes a coverage report per package
# and the workflow uploads them together; components split that back apart by
# path, which flags could not do without one upload per package.
#
# The paths below assume Codecov sees `libs/<pkg>/src/...`. It does because
# `coverage:normalize-paths` (tools/scripts/cmd/normalize-coverage-paths.mts),
# which `ws:check:test:cov` runs last, even after a failed part, rewrites every
# lcov.info to repository-relative paths before upload. The test runner writes
# them relative to the package and the uploader does not prefix them, so
# without that step Codecov guesses the package and merges files of the same
# name across packages.
#
# A package added here also wants a badge in its README
# (`badge.svg?component=<component_id>`); a package missing from this list
# still counts towards the repository total, it just has no view of its own.
#
# No component has `statuses`, so a pull request gets the two repository-wide
# checks above and no pair per package: those were two GitHub API calls each
# for an informational number the comment's `components` table already shows.
# A component without `statuses` posts no check (Codecov's worker reads a
# missing list as empty); the badge and the comment read the paths alone.
component_management:
  individual_components:
    - component_id: eslint-config-typed
      paths: ['libs/eslint-config-typed/**']
    - component_id: eslint-plugin-ts-data-forge
      paths: ['libs/eslint-plugin-ts-data-forge/**']
    - component_id: eslint-plugin-ts-fortress
      paths: ['libs/eslint-plugin-ts-fortress/**']
    - component_id: eslint-plugin-ts-restrictions
      paths: ['libs/eslint-plugin-ts-restrictions/**']
    - component_id: eslint-plugin-ts-type-forge
      paths: ['libs/eslint-plugin-ts-type-forge/**']
    - component_id: github-settings-as-code
      paths: ['libs/github-settings-as-code/**']
    - component_id: octokit-safe-types
      paths: ['libs/octokit-safe-types/**']
    - component_id: synstate
      paths: ['libs/synstate/**']
    - component_id: synstate-preact-hooks
      paths: ['libs/synstate-preact-hooks/**']
    - component_id: synstate-preact-signals
      paths: ['libs/synstate-preact-signals/**']
    - component_id: synstate-react-hooks
      paths: ['libs/synstate-react-hooks/**']
    - component_id: synstate-react-hooks-compat
      paths: ['libs/synstate-react-hooks-compat/**']
    - component_id: synstate-router
      paths: ['libs/synstate-router/**']
    - component_id: synstate-router-dom
      paths: ['libs/synstate-router-dom/**']
    - component_id: synstate-router-react
      paths: ['libs/synstate-router-react/**']
    - component_id: ts-codemod-lib
      paths: ['libs/ts-codemod-lib/**']
    - component_id: ts-data-forge
      paths: ['libs/ts-data-forge/**']
    - component_id: ts-fortress
      paths: ['libs/ts-fortress/**']
    - component_id: ts-repo-utils
      paths: ['libs/ts-repo-utils/**']
