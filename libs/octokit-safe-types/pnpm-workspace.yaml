update:
  githubActions: true
  ignoreDeps:
    - typescript

# Keep a single copy of ts-type-forge in the dependency tree.
# ts-fortress still declares `ts-type-forge: 8.x`, and a duplicated ts-type-forge
# makes `tsc --emitDeclarationOnly` fail with TS2883 ("... cannot be named without
# a reference to '.pnpm/ts-type-forge@8.1.0/node_modules/ts-type-forge'"), because
# the global types it declares are then unreachable from the emitted `.d.mts`.
# ts-type-forge is types-only, so overriding it has no runtime effect.
overrides:
  ts-type-forge: ^9.1.1

minimumReleaseAge: 10080 # = 7 days

minimumReleaseAgeExclude:
  - '@types/**'
  - ts-type-forge
  - eslint-plugin-ts-type-forge
  - ts-data-forge
  - eslint-plugin-ts-data-forge
  - ts-fortress
  - eslint-plugin-ts-fortress
  - ts-repo-utils
  - ts-codemod-lib
  - synstate
  - 'synstate-*'
  - eslint-config-typed
  - octokit-safe-types
  - github-settings-as-code
  - 'strict-ts-lib-*'

allowBuilds:
  esbuild: true
  unrs-resolver: true
