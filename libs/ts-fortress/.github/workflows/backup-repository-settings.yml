name: Backup Repository Settings

# Controls when the action will run.
on:
  # Triggers the workflow on push events (excluding develop branches) and manual runs
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  backup-repository-settings:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GITHUB_TOKEN の permissions に administration は存在せず、リポジトリ設定や
      # ruleset を読めないため GitHub App の installation token を使う。
      # read では merge 関連設定と ruleset の bypass_actors が API から返らない。
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_BOT_PRIVATE_KEY }}
          permission-administration: write
          permission-contents: write
          permission-pages: read

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node_id
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Back up
        run: pnpm exec repo-settings backup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: noshiro-pf
          # github-settings-as-code falls back to the root package.json `name`,
          # which is the private workspace root (`ts-fortress-monorepo`), so the
          # repository has to be named explicitly.
          REPO_NAME: ts-fortress

      - name: Check if there is no file diff
        run: pnpm exec assert-repo-is-clean
