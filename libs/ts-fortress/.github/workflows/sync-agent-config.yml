name: Sync Agent Config

# Keeps the shared agent instructions up to date: fetches the latest
# agents/AGENTS.md from the common-agent-config repository (no submodule),
# vendors it into agents/common-rules.md, regenerates the root AGENTS.md
# (common part + agents/local-rules.md), and opens a pull request when
# anything changed.

on:
  schedule:
    # Weekly, Monday 06:47 JST (21:47 UTC Sunday).
    - cron: '47 21 * * 0'

  workflow_dispatch:

jobs:
  sync-agent-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          permission-contents: write # ブランチの push
          permission-pull-requests: write # PR の作成と auto-merge の有効化

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch shared agent instructions and regenerate AGENTS.md
        run: pnpm run agents:sync

      - name: Create pull request if anything changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet; then
            echo "Agent config is already up to date."
            exit 0
          fi
          BRANCH="chore/sync-agent-config-$(date -u +%Y%m%d)"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add agents/common-rules.md AGENTS.md
          git commit -m 'chore: sync common agent config'
          git push -u origin "$BRANCH"
          gh pr create \
            --title 'chore: sync common agent config' \
            --body 'Automated update of the vendored `agents/common-rules.md` and the generated `AGENTS.md`. Created by the sync-agent-config workflow.'
