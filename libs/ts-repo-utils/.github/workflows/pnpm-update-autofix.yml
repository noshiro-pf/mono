name: pnpm-update autofix

# When a weekly pnpm-update PR's CI fails, turn OFF auto-merge and let Claude Code
# attempt a one-shot fix (typically adapting to breaking changes from a major
# dependency bump), then leave the PR for manual review.
#
# Reacts to a CI workflow completing with failure (via workflow_run — note a
# `check_suite` trigger does NOT fire for GitHub Actions' own check suite). A
# label caps it at one attempt per PR so the fixer's own push cannot start an
# endless fix loop. workflow_run fires here because our CI is triggered by a PAT
# push, not GITHUB_TOKEN.
#
# Auth: PERSONAL_ACCESS_TOKEN for both checkout and the action's github_token, so
# Claude's push is attributed to a real user and re-triggers the push-based CI
# (the default GITHUB_TOKEN cannot).

on:
  workflow_run:
    workflows:
      - 'Style Check'
      - 'Lint and Build'
      - 'Test and Upload Coverage to Codecov'
      - 'Node.js Version Compatibility'
      - 'TypeScript Version Compatibility'
      - 'Codemod'
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    # Only for a failed CI run on a pnpm-update branch.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'chore/pnpm-update-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pnpm-update-autofix-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Resolve PR, guard one attempt, disable auto-merge
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          LABEL: pnpm-update-autofix-attempted
        run: |
          num=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
                  --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            echo "No open PR for $BRANCH; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          labels=$(gh pr view "$num" -R "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
          if printf '%s' "$labels" | grep -qw "$LABEL"; then
            echo "PR #$num already had an autofix attempt; leaving it for manual review."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Cap at one attempt and stop auto-merge so nothing merges without review.
          gh label create "$LABEL" -R "$GITHUB_REPOSITORY" --color BFD4F2 \
            --description "A Claude Code CI autofix has been attempted on this PR" 2>/dev/null || true
          gh pr edit "$num" -R "$GITHUB_REPOSITORY" --add-label "$LABEL"
          gh pr merge "$num" -R "$GITHUB_REPOSITORY" --disable-auto || true
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: steps.pr.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        if: steps.pr.outputs.skip == 'false'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        if: steps.pr.outputs.skip == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.pr.outputs.skip == 'false'
        run: pnpm install --no-frozen-lockfile

      - name: Configure git identity
        if: steps.pr.outputs.skip == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run Claude Code to fix the failing CI
        if: steps.pr.outputs.skip == 'false'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          prompt: |
            The pull request on branch `${{ github.event.workflow_run.head_branch }}`
            in `${{ github.repository }}` is an automated weekly dependency update, and
            its CI has failed. Make the CI pass by fixing the CODE — do NOT revert the
            dependency bumps in package.json / pnpm-lock.yaml (they are intentional).
            Failures are usually breaking API changes from a major-version bump.

            Steps:
            1. Read the repo's AGENTS.md / CLAUDE.md for conventions and commands.
            2. Reproduce the failures locally. Useful: `pnpm run tsc`, `pnpm run lint:fix`,
               `pnpm run test`, `pnpm run build`, or `pnpm run check-all`.
            3. Make the minimal code changes to adapt to the new dependency versions and
               satisfy type-check / lint / tests / build, following the repo's strict
               coding rules (no `any`, readonly, explicit return types, etc.).
            4. Run `pnpm run fmt` and re-run the checks to confirm they pass.
            5. Commit and push to this branch:
                 git add -A
                 git commit -m "fix: adapt code to updated dependencies"
                 git push origin HEAD
            If you cannot find a safe fix, do NOT commit; instead post a brief PR comment
            explaining what is broken so a human can take over.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 40
            --allowedTools "Edit,Read,Write,Bash(pnpm:*),Bash(git:*),Bash(node:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(sed:*),Bash(head:*),Bash(tail:*)"
