name: Dependabot Changeset

# Adds a changeset to Dependabot PRs so that the Changesets release flow
# publishes a new version once they are merged.
#
# `.github/dependabot.yml` already classifies the updates it opens through its
# `commit-message` prefixes, and this workflow mirrors that classification
# (`fix`-prefixed production bumps used to trigger a semantic-release release,
# `chore`-prefixed ones did not):
#
# | update                      | dependabot.yml prefix | changeset |
# | :-------------------------- | :-------------------- | :-------- |
# | npm, production dependency  | `fix`                 | patch     |
# | npm, development dependency | `chore`               | none      |
# | github-actions              | `chore`               | none      |
#
# `steps.metadata.outputs.dependency-type` alone cannot express that table:
# Dependabot reports *every* github-actions update as `direct:production`,
# because that ecosystem has no development/production distinction. The step
# below therefore additionally requires the updated dependency to be declared in
# `dependencies` / `peerDependencies` / `optionalDependencies` of a publishable
# (non-private) workspace package. That also scopes the version bump to the
# packages that really depend on the update instead of releasing every package.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDABOT_AUTO_MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTO_MERGE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # First gate, equivalent to dependabot.yml's `prefix` /
      # `prefix-development` split for the npm ecosystem. It is not sufficient on
      # its own (see the note at the top of this file), so the step body verifies
      # the update against the workspace manifests as well.
      - name: Create changeset for production dependency updates
        if: steps.metadata.outputs.dependency-type == 'direct:production'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          UPDATED_DEPS: ${{ steps.metadata.outputs.dependency-names }}
          UPDATED_DIR: ${{ steps.metadata.outputs.directory }}
        run: |
          set -euo pipefail

          # Publishable (non-private) workspace packages that declare one of the
          # updated dependencies as a runtime / peer / optional dependency.
          packages_raw="$(node -e '
            const fs = require("node:fs");
            const path = require("node:path");

            const updated = new Set(
              (process.env.UPDATED_DEPS ?? "")
                .split(",")
                .map((name) => name.trim())
                .filter((name) => name !== ""),
            );

            const out = [];

            for (const dirent of fs.readdirSync("packages", { withFileTypes: true })) {
              if (!dirent.isDirectory()) continue;

              const manifest = path.join("packages", dirent.name, "package.json");
              if (!fs.existsSync(manifest)) continue;

              const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));

              if (typeof pkg.name !== "string" || pkg.private === true) continue;

              const declared = Object.keys({
                ...pkg.dependencies,
                ...pkg.peerDependencies,
                ...pkg.optionalDependencies,
              });

              if (declared.some((name) => updated.has(name))) {
                out.push(pkg.name);
              }
            }

            process.stdout.write(out.join("\n"));
          ')"

          if [ -z "$packages_raw" ]; then
            echo "No publishable package depends on ${UPDATED_DEPS}; no changeset needed."
            exit 0
          fi

          mapfile -t packages <<< "$packages_raw"

          # The directory is part of the slug because Dependabot opens one PR per
          # manifest directory, so the same dependency name can be updated by
          # several concurrent PRs.
          slug="$(printf '%s' "${UPDATED_DIR}-${UPDATED_DEPS}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed -e 's/^-*//' -e 's/-*$//')"
          file=".changeset/dependabot-${slug}.md"

          if [ -f "$file" ]; then
            echo "Changeset $file already exists; nothing to do."
            exit 0
          fi

          {
            echo "---"
            for pkg in "${packages[@]}"; do
              echo "'${pkg}': patch"
            done
            echo "---"
            echo ""
            echo "$PR_TITLE"
          } > "$file"

          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore: add changeset for ${UPDATED_DEPS}"
          git push
