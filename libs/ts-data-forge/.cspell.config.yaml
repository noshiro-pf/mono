version: '0.2'
language: en
allowCompoundWords: true
caseSensitive: false
ignoreRandomStrings: true
words:
  - amannn
  - anthropics
  - bivariant
  - contravariance
  - darkred
  - foldl
  - foldr
  - funcs
  - iset
  - leqc
  - nand
  - noshiro
  - nums
  - sindresorhus
  - strs
  - testw
  - tscw
  - tses
  - unmemoized
  - unshift
  - unshifted
  - unstringifiable
  - uppercased
  - vitest
  - xnor
ignorePaths:
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/docs/**'
  - agents/common/**
