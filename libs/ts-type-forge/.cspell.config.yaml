version: '0.2'
language: en
allowCompoundWords: true
caseSensitive: false
ignoreRandomStrings: true
words:
  - amannn
  - anthropics
  - bivariant
  - contravariance
  - gcanti
  - nand
  - noshiro
  - rgba
  - testw
  - tscw
  - tses
  - unshift
  - unshifted
  - xnor
ignorePaths:
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/docs/**'
  - agents/common/**
