version: '0.2'
language: en
allowCompoundWords: true
caseSensitive: false
ignoreRandomStrings: true
words:
  - bivariant
  - contravariance
  - gcanti
  - NAND
  - noshiro
  - rgba
  - testw
  - tscw
  - tses
  - XNOR
ignorePaths:
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/docs/**'
  - agents/common/**
