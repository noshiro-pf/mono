name: Backup Repository Settings

# Controls when the action will run.
on:
  # Triggers the workflow on push events (excluding develop branches) and manual runs
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read # Checkout only. Repository settings are read via the App token below.

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  backup-repository-settings:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: setup_node_id
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_SETTINGS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_SETTINGS_BOT_PRIVATE_KEY }}
          # read では足りない。GitHub は以下を write 相当のときだけ返すため、
          # backup であっても write が必要になる。
          #   - merge 関連設定（ allow_auto_merge, merge_commit_title など ）
          #     … "To view merge-related settings, you must have the
          #        contents:read and contents:write permissions."
          #   - ruleset の bypass_actors
          #     … "the bypass_actors property is only returned if the user
          #        making the API request has write access to the ruleset."
          permission-administration: write
          permission-contents: write
          permission-pages: read

      # owner / repo は actions/checkout が設定する origin から解決されるため、
      # OWNER の指定は不要。
      - name: Back up
        run: pnpm exec tsx src/cmd/repo-settings.mts backup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Check if there is no file diff
        run: pnpm exec assert-repo-is-clean
