allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAge: 10080 # = 7 days

minimumReleaseAgeExclude:
  - '@types/**'
  - ts-type-forge
  - ts-data-forge
  - ts-fortress
  - ts-repo-utils
  - ts-codemod-lib
  - synstate
  - 'synstate-*'
  - eslint-config-typed
  - octokit-safe-types
  - github-settings-as-code

overrides:
  ts-fortress: '^11.2.0'
  ts-type-forge: '^9.1.1'
  ts-data-forge: '^12.2.2'
  # ts-codemod-lib@2.2.3 breaks at runtime with ts-data-forge >= 11
  # (Arr.isArrayOfLength was removed), so keep the major it was built against.
  'ts-codemod-lib>ts-data-forge': '^7.1.1'

update:
  githubActions: true
  ignoreDeps:
    - typescript
